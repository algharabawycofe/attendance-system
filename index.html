<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام الحضور والانصراف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
--primary:#2563eb;--primary-dark:#1e40af;--primary-light:#dbeafe;
--success:#10b981;--warning:#f59e0b;--danger:#ef4444;
--whatsapp:#25D366;--whatsapp-dark:#128C7E;
--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;
--gray-500:#6b7280;--gray-700:#374151;--gray-900:#111827;
--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
--shadow-md:0 4px 6px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.03);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Tahoma,sans-serif;background:var(--gray-50);color:var(--gray-900);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 50%,#0ea5e9 100%);padding:20px;position:relative;overflow:hidden}
.login-page::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.08) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.06) 0%,transparent 40%)}
.login-card{position:relative;background:#fff;border-radius:20px;padding:44px 38px;width:100%;max-width:420px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.login-logo{text-align:center;font-size:52px;margin-bottom:8px}
.login-title{text-align:center;font-size:24px;font-weight:800;color:var(--gray-900);margin-bottom:6px}
.login-subtitle{text-align:center;font-size:13px;color:var(--gray-500);margin-bottom:28px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12.5px;font-weight:600;color:var(--gray-700);margin-bottom:6px}
.login-field input{width:100%;padding:12px 14px;border:1.5px solid var(--gray-200);border-radius:10px;transition:all .2s;font-size:14px}
.login-field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-light)}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:10px;font-size:15px;font-weight:700;margin-top:8px;transition:all .2s}
.login-btn:hover{transform:translateY(-1px)}
.login-btn:disabled{background:var(--gray-300);cursor:not-allowed;transform:none}
.login-error{background:#fef2f2;color:var(--danger);padding:11px 14px;border-radius:8px;font-size:13px;font-weight:600;margin-top:14px;border:1px solid #fecaca;display:none}
.login-hint{text-align:center;font-size:12px;color:var(--gray-500);margin-top:20px;padding-top:18px;border-top:1px solid var(--gray-100)}
.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:64px 1fr;grid-template-areas:"sidebar header" "sidebar main";height:100vh;overflow:hidden}
@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:64px 1fr;grid-template-areas:"header" "main"}}
.sidebar{grid-area:sidebar;background:#fff;border-left:1px solid var(--gray-200);display:flex;flex-direction:column;padding:20px 0;overflow-y:auto}
@media(max-width:900px){.sidebar{position:fixed;top:64px;right:-280px;width:260px;height:calc(100vh - 64px);z-index:100;transition:right .3s;box-shadow:-4px 0 20px rgba(0,0,0,.1)}.sidebar.open{right:0}}
.sidebar-brand{padding:0 20px 20px;border-bottom:1px solid var(--gray-100);margin-bottom:12px}
.sidebar-brand h1{font-size:17px;font-weight:800;color:var(--gray-900);display:flex;align-items:center;gap:8px}
.sidebar-brand p{font-size:11.5px;color:var(--gray-500);margin-top:2px}
.nav-group{padding:0 12px;margin-bottom:6px}
.nav-label{font-size:10.5px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.5px;padding:10px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--gray-700);cursor:pointer;transition:all .15s;width:100%;text-align:right}
.nav-item:hover{background:var(--gray-100)}
.nav-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:700}
.nav-item .icon{font-size:17px;width:22px;text-align:center}
.sidebar-footer{margin-top:auto;padding:16px 20px 0;border-top:1px solid var(--gray-100);font-size:11.5px;color:var(--gray-500);text-align:center}
.header{grid-area:header;background:#fff;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 24px;gap:16px;justify-content:space-between}
.header-title{font-size:17px;font-weight:700;color:var(--gray-900)}
.header-actions{display:flex;align-items:center;gap:12px}
.user-menu{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:30px;background:var(--gray-50);font-size:13px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.user-name{font-weight:600;color:var(--gray-900)}
.user-role{font-size:11px;color:var(--gray-500)}
.menu-btn{display:none;padding:8px;border-radius:8px;font-size:20px}
@media(max-width:900px){.menu-btn{display:block}}
.logout-btn{padding:7px 14px;background:var(--gray-100);border-radius:8px;font-size:12.5px;font-weight:600;color:var(--gray-700);transition:all .15s}
.logout-btn:hover{background:#fee2e2;color:var(--danger)}
.main{grid-area:main;overflow-y:auto;padding:24px}
@media(max-width:900px){.main{padding:16px}}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--gray-100)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.card-title{font-size:16px;font-weight:700;color:var(--gray-900)}
.card-subtitle{font-size:12.5px;color:var(--gray-500);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{background:var(--gray-300);cursor:not-allowed}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-whatsapp{background:var(--whatsapp);color:#fff}
.btn-whatsapp:hover{background:var(--whatsapp-dark)}
.btn-outline{background:#fff;color:var(--gray-700);border:1.5px solid var(--gray-200)}
.btn-outline:hover{border-color:var(--gray-300);background:var(--gray-50)}
.btn-outline:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:6px}
.form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:160px}
.field label{font-size:12px;font-weight:600;color:var(--gray-700)}
.field input,.field select{width:100%;padding:9px 12px;border:1.5px solid var(--gray-200);border-radius:9px;transition:all .15s;background:#fff}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border-radius:12px;padding:18px;border:1px solid var(--gray-100);box-shadow:var(--shadow);transition:all .2s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.stat-icon.blue{background:var(--primary-light);color:var(--primary)}
.stat-icon.green{background:#d1fae5;color:var(--success)}
.stat-icon.orange{background:#fed7aa;color:var(--warning)}
.stat-icon.red{background:#fee2e2;color:var(--danger)}
.stat-icon.purple{background:#e9d5ff;color:#9333ea}
.stat-value{font-size:26px;font-weight:800;color:var(--gray-900);line-height:1}
.stat-label{font-size:12.5px;color:var(--gray-500);margin-top:4px}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--gray-100);background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
thead{background:var(--gray-50)}
th{padding:11px 12px;text-align:right;font-weight:700;font-size:12px;color:var(--gray-700);border-bottom:1px solid var(--gray-200);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--gray-100);color:var(--gray-700)}
tbody tr:hover{background:var(--gray-50)}
tbody tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-green{background:#d1fae5;color:#065f46}
.b-red{background:#fee2e2;color:#991b1b}
.b-orange{background:#fed7aa;color:#92400e}
.b-blue{background:var(--primary-light);color:var(--primary-dark)}
.b-gray{background:var(--gray-100);color:var(--gray-700)}
.b-purple{background:#e9d5ff;color:#6b21a8}
.b-wa{background:#dcfce7;color:#166534}
.alert{padding:12px 14px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.alert-info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.alert-success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.alert-warning{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.alert-danger{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.empty{text-align:center;padding:50px 20px;color:var(--gray-500)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-title{font-size:15px;font-weight:600;color:var(--gray-700);margin-bottom:4px}
.loader-overlay{position:fixed;inset:0;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:2000}
.spinner{width:44px;height:44px;border:4px solid var(--gray-200);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.daily-table input,.daily-table select{padding:6px 8px;font-size:12.5px;border:1px solid var(--gray-200);border-radius:7px;width:100%;transition:all .15s}
.daily-table input:focus,.daily-table select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);outline:none}
.daily-table .perm-hours{max-width:80px}
.row-saving{background:#fffbeb}
.row-saved{background:#f0fdf4}
.date-nav{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.date-nav button{padding:6px 12px;font-size:12px;border:1.5px solid var(--gray-200);background:#fff;border-radius:7px;font-weight:600;color:var(--gray-700);transition:all .15s}
.date-nav button:hover{border-color:var(--primary);color:var(--primary)}
.date-nav button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tabs-inline{display:flex;gap:6px;padding:4px;background:var(--gray-100);border-radius:10px;margin-bottom:16px;width:fit-content}
.tab-inline{padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--gray-700);transition:all .15s}
.tab-inline.active{background:#fff;color:var(--primary);box-shadow:var(--shadow)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1500}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.modal-header{font-size:17px;font-weight:800;color:var(--gray-900);margin-bottom:16px}
.modal-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.modal-actions .btn{flex:1;justify-content:center;min-width:120px}
.upload-zone{border:2px dashed var(--gray-300);border-radius:12px;padding:32px 20px;text-align:center;background:var(--gray-50);transition:all .2s;cursor:pointer}
.upload-zone:hover{border-color:var(--primary);background:var(--primary-light)}
.report-card{border:1px solid var(--gray-200);border-radius:12px;padding:16px;margin-bottom:14px;background:#fff}
.report-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--gray-100);margin-bottom:12px;flex-wrap:wrap;gap:10px}
.report-name{font-size:15px;font-weight:700;color:var(--gray-900)}
.report-summary{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;padding:12px;background:var(--gray-50);border-radius:10px;margin-bottom:12px}
.report-summary b{color:var(--gray-900)}
.timeline{position:relative;padding-right:28px;margin:16px 0}
.timeline::before{content:'';position:absolute;right:10px;top:8px;bottom:8px;width:2px;background:var(--gray-200)}
.timeline-item{position:relative;padding:12px 0}
.timeline-item::before{content:'';position:absolute;right:-24px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid #fff;box-shadow:0 0 0 2px var(--primary-light)}
.branch-section{border:1px solid var(--gray-200);border-radius:12px;padding:16px;margin-bottom:14px;background:#fff}
.branch-section-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--gray-100);margin-bottom:12px;flex-wrap:wrap;gap:10px}
.muted{color:var(--gray-500);font-size:12px}
.mt-2{margin-top:8px}
.mt-3{margin-top:12px}
.mt-4{margin-top:16px}
.inactive-row{opacity:.55}
.wa-preview{width:100%;min-height:320px;padding:12px;border:1.5px solid var(--gray-200);border-radius:9px;font-family:inherit;font-size:13px;resize:vertical;white-space:pre-wrap;direction:rtl;text-align:right;background:var(--gray-50);line-height:1.9}
@media print{.sidebar,.header,.btn,.no-print{display:none !important}.app{display:block}.main{padding:0;overflow:visible}.card,.report-card,.branch-section{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}body{background:#fff}}
</style>
</head>
<body>

<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="login-logo">⏱</div>
    <div class="login-title" id="loginTitle">نظام الحضور</div>
    <div class="login-subtitle" id="loginSub"></div>
    <div class="login-field">
      <label>اسم المستخدم</label>
      <input id="loginUser" autocomplete="username">
    </div>
    <div class="login-field">
      <label>كلمة المرور</label>
      <input id="loginPass" type="password" autocomplete="current-password">
    </div>
    <div class="login-field" id="loginNameWrap" style="display:none">
      <label>الاسم الكامل</label>
      <input id="loginName">
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">دخول</button>
    <div class="login-error" id="loginErr"></div>
    <div class="login-hint" id="loginHint"></div>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1>⏱ نظام الحضور</h1>
      <p id="sidebarRole">—</p>
    </div>
    <div id="navMenu"></div>
    <div class="sidebar-footer">إدارة الحضور والانصراف</div>
  </aside>
  <header class="header">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="header-title" id="pageTitle"></div>
    </div>
    <div class="header-actions">
      <div class="user-menu">
        <div class="user-avatar" id="userAvatar">—</div>
        <div>
          <div class="user-name" id="userName">—</div>
          <div class="user-role" id="userRole">—</div>
        </div>
      </div>
      <button class="logout-btn" onclick="doLogout()">خروج</button>
    </div>
  </header>
  <main class="main" id="mainContent"></main>
</div>

<div id="loader" class="loader-overlay" style="display:none"><div class="spinner"></div></div>
<div id="modalContainer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getFirestore, collection, doc, getDocs,
  addDoc, updateDoc, deleteDoc, writeBatch, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBla94ZCx9oaTMm1-tmehyVx-Pyn-_zz3g",
  authDomain: "attendance-system-403c3.firebaseapp.com",
  projectId: "attendance-system-403c3",
  storageBucket: "attendance-system-403c3.firebasestorage.app",
  messagingSenderId: "241577979833",
  appId: "1:241577979833:web:af35ec638772254e95d068"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const DB = { branches:[], users:[], shifts:[], employees:[], punches:[], daily:[] };
let currentUser = null;
let activePage = 'dashboard';
let lastReport = null;
let lastEmpReport = null;
let unsubs = [];
const UI = {};

const DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const STATUS = { present:'حاضر', absent:'غائب', leave:'أجازة', mission:'مهمة' };
const PERM = { none:'بدون', hour:'إذن ساعات', day:'يوم كامل' };

const $ = id => document.getElementById(id);
const showLoader = v => $('loader').style.display = v ? 'flex' : 'none';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s==null?'':s).trim().toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,'');
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };

const localKey = d => {
  const dt = (d instanceof Date) ? d : new Date(d);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
};
const today = () => localKey(new Date());
const dayName = dk => DAYS[new Date(dk+'T00:00:00').getDay()];
const fmtDate = d => d ? new Date(d).toLocaleDateString('ar-EG', { year:'numeric', month:'short', day:'numeric' }) : '—';

function fmtMins(m){
  m = Math.round(m||0);
  const abs = Math.abs(m);
  if(!abs) return '0 دقيقة';
  const h = Math.floor(abs/60), mn = abs%60;
  let t = h && mn ? `${h}س ${mn}د` : (h ? `${h} ساعة` : `${mn} دقيقة`);
  return m < 0 ? `-${t}` : t;
}
function fmtHM(ms){
  const d = new Date(ms);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function dtAt(dateKey, timeStr){
  const [y,m,d] = dateKey.split('-').map(Number);
  const [hh,mm] = String(timeStr||'00:00').split(':').map(Number);
  return new Date(y, m-1, d, hh||0, mm||0, 0, 0);
}
function parseDate(str){
  if(!str) return null;
  let s = String(str).trim();
  const isPM = s.includes('م') || s.toUpperCase().includes('PM');
  const isAM = s.includes('ص') || s.toUpperCase().includes('AM');
  s = s.replace(/[صم]/g,'').trim();
  const parts = s.split(/\s+/);
  if(parts.length >= 2){
    const dp = parts[0].split(/[\/\-\.]/);
    const tp = parts[1].split(':');
    if(dp.length === 3 && tp.length >= 2){
      let d = parseInt(dp[0],10), m = parseInt(dp[1],10)-1, y = parseInt(dp[2],10);
      if(y < 100) y += 2000;
      let h = parseInt(tp[0],10), mn = parseInt(tp[1],10), sec = tp[2]?parseInt(tp[2],10):0;
      if(isPM && h < 12) h += 12;
      else if(isAM && h === 12) h = 0;
      const dt = new Date(y, m, d, h, mn, sec);
      if(!isNaN(dt.getTime())) return dt;
    }
  }
  const dt = new Date(s);
  return isNaN(dt.getTime()) ? null : dt;
}
async function hash(p){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function fsAll(n){
  const s = await getDocs(collection(db, n));
  return s.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function fsAdd(n, data){
  const r = await addDoc(collection(db, n), data);
  return { id: r.id, ...data };
}
async function fsUpd(n, id, data){ await updateDoc(doc(db, n, id), data); }
async function fsDel(n, id){ await deleteDoc(doc(db, n, id)); }
async function fsBatchDel(n, fn){
  const s = await getDocs(collection(db, n));
  const b = writeBatch(db);
  let c = 0;
  s.docs.forEach(d => { if(fn({id:d.id, ...d.data()})){ b.delete(d.ref); c++; } });
  if(c) await b.commit();
}
async function fsBatchAdd(n, items){
  const CH = 400;
  for(let i=0; i<items.length; i+=CH){
    const b = writeBatch(db);
    items.slice(i, i+CH).forEach(it => b.set(doc(collection(db, n)), it));
    await b.commit();
  }
}

async function loadAll(){
  showLoader(true);
  try {
    const [b, u, s, e, p, d] = await Promise.all([
      fsAll('branches'), fsAll('users'), fsAll('shifts'),
      fsAll('employees'), fsAll('punches'), fsAll('daily')
    ]);
    Object.assign(DB, { branches:b, users:u, shifts:s, employees:e, punches:p, daily:d });
  } finally {
    showLoader(false);
  }
}
function startLive(){
  unsubs.forEach(u => { try{ u(); }catch(e){} });
  unsubs = [];
  ['daily','punches','employees','shifts','branches','users'].forEach(col => {
    unsubs.push(onSnapshot(collection(db, col), snap => {
      DB[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if(currentUser && !['reports','employee'].includes(activePage)) refreshPage();
    }, err => { console.error('onSnapshot error for', col, err); }));
  });
}
function stopLive(){ unsubs.forEach(u => { try{ u(); }catch(e){} }); unsubs = []; }

const getBranch = id => DB.branches.find(b => b.id === id);
const branchName = id => getBranch(id)?.name || '—';
const getShift = id => DB.shifts.find(s => s.id === id);
const getDefaultShift = bId => {
  const b = getBranch(bId);
  return b?.defaultShiftId ? getShift(b.defaultShiftId) : null;
};

async function checkSetup(){
  showLoader(true);
  try {
    const users = await fsAll('users');
    const setup = users.length === 0;
    window.__setup = setup;
    $('loginTitle').textContent = setup ? 'إنشاء حساب المدير' : 'نظام الحضور';
    $('loginSub').textContent = setup ? 'أدخل بيانات حساب المدير الرئيسي' : 'تسجيل الدخول';
    $('loginNameWrap').style.display = setup ? 'block' : 'none';
    $('loginBtn').textContent = setup ? 'إنشاء الحساب' : 'دخول';
    $('loginHint').textContent = setup ? '' : 'يرجى التواصل مع الإدارة للحصول على بيانات الدخول';
    $('loginBtn').disabled = false;
    $('loginPage').style.display = 'flex';
    $('app').style.display = 'none';
  } catch(e){
    console.error('checkSetup failed:', e);
    $('loginPage').style.display = 'flex';
    $('app').style.display = 'none';
    const err = $('loginErr');
    err.textContent = '⚠️ فشل الاتصال بقاعدة البيانات: ' + (e?.message || e);
    err.style.display = 'block';
    $('loginBtn').disabled = true;
    $('loginHint').textContent = 'افتح Console (F12) للتفاصيل';
  } finally {
    showLoader(false);
  }
}
async function doLogin(){
  const u = $('loginUser').value.trim();
  const p = $('loginPass').value;
  const err = $('loginErr');
  err.style.display = 'none';
  if(!u || !p){ err.textContent = 'أدخل اسم المستخدم وكلمة المرور'; err.style.display='block'; return; }
  showLoader(true);
  try {
    if(window.__setup){
      const name = $('loginName').value.trim() || u;
      const user = await fsAdd('users', {
        username: u, passwordHash: await hash(p),
        role: 'admin', name, branchId: null, createdAt: Date.now()
      });
      currentUser = user;
      sessionStorage.setItem('uid', user.id);
      await loadAll();
      enterApp();
      return;
    }
    const users = await fsAll('users');
    const ph = await hash(p);
    const user = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.passwordHash === ph);
    if(!user){ err.textContent = 'بيانات الدخول غير صحيحة'; err.style.display = 'block'; return; }
    currentUser = user;
    sessionStorage.setItem('uid', user.id);
    await loadAll();
    enterApp();
  } catch(e){
    err.textContent = '⚠️ خطأ: ' + (e?.message || e);
    err.style.display = 'block';
  } finally {
    showLoader(false);
  }
}
function doLogout(){
  stopLive();
  currentUser = null;
  sessionStorage.removeItem('uid');
  $('app').style.display = 'none';
  $('loginPage').style.display = 'flex';
  $('loginPass').value = '';
  checkSetup();
}
function enterApp(){
  $('loginPage').style.display = 'none';
  $('app').style.display = 'grid';
  const role = currentUser.role === 'admin' ? 'مدير النظام' : branchName(currentUser.branchId);
  $('userName').textContent = currentUser.name;
  $('userRole').textContent = role;
  $('userAvatar').textContent = (currentUser.name || 'م').charAt(0).toUpperCase();
  $('sidebarRole').textContent = role;
  if(currentUser.role === 'admin'){
    if(!['dashboard','daily','settings','uploads','reports','employee'].includes(activePage)) activePage = 'dashboard';
  } else {
    activePage = 'daily';
  }
  startLive();
  buildNav();
  renderPage();
}
function toggleSidebar(){ $('sidebar').classList.toggle('open'); }
function buildNav(){

    { id:'daily', icon:'📅', label:'التسجيل اليومي' },

function navigateTo(page){
  activePage = page;
  if(window.innerWidth <= 900) $('sidebar').classList.remove('open');
  buildNav();
  renderPage();
  $('mainContent').scrollTop = 0;
}
function refreshPage(){
  const ae = document.activeElement;
  if(ae && ['INPUT','SELECT','TEXTAREA'].includes(ae.tagName)) return;
  if(document.querySelector('.row-saving')) return;
  renderPage();
}
function renderPage(){
  const titles = { dashboard:'الرئيسية', daily:'التسجيل اليومي', settings:'الإعدادات', uploads:'رفع البصمة', reports:'التقارير', employee:'سجل الموظف' };
  $('pageTitle').textContent = titles[activePage] || '';
  const content = { dashboard: renderDashboard, daily: renderDaily, settings: renderSettings, uploads: renderUploads, reports: renderReports, employee: renderEmployeeHistory };
  $('mainContent').innerHTML = content[activePage]?.() || '';
}

      <div class="stat"><div class="stat-icon green">👥</div><div class="stat-value">${activeEmps}</div><div class="stat-label">الموظفين</div></div>
      <div class="stat"><div class="stat-icon orange">✅</div><div class="stat-value">${todayEntries}</div><div class="stat-label">تسجيلات اليوم</div></div>

function viewBranchToday(bId){ UI.dailyBranch = bId; navigateTo('daily'); }

function renderDaily(){
  const isAdmin = currentUser.role === 'admin';
  const date = UI.dailyDate || today();
  UI.dailyDate = date;
  if(!isAdmin) UI.dailyBranch = currentUser.branchId;
  const bId = isAdmin ? UI.dailyBranch : currentUser.branchId;
  const branchField = isAdmin ? `
    <div class="field" style="max-width:240px">
      <label>الفرع</label>
      <select onchange="setDailyBranch(this.value)">
        <option value="">اختر الفرع</option>
        ${DB.branches.map(b => `<option value="${b.id}" ${bId === b.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}
      </select>
    </div>` : '';
  const base = new Date(date+'T00:00:00');
  const y = new Date(base); y.setDate(y.getDate()-1);
  const yn = new Date(base); yn.setDate(yn.getDate()+1);
  const yKey = localKey(y), ynKey = localKey(yn);
  const tKey = today();
  const dateNav = `
    <div class="field" style="max-width:200px">
      <label>التاريخ</label>
      <input type="date" value="${date}" onchange="setDailyDate(this.value)">
    </div>
    <div class="date-nav" style="align-self:flex-end">
      <button class="${date === yKey ? 'active' : ''}" onclick="setDailyDate('${yKey}')">أمس</button>
      <button class="${date === tKey ? 'active' : ''}" onclick="setDailyDate('${tKey}')">اليوم</button>
      <button class="${date === ynKey ? 'active' : ''}" onclick="setDailyDate('${ynKey}')">غداً</button>
    </div>`;
  if(!bId){
    return `<div class="card"><div class="card-header"><div class="card-title">التسجيل اليومي</div></div><div class="form-row">${branchField}${dateNav}</div><div class="empty"><div class="empty-icon">🏢</div><div class="empty-title">اختر الفرع</div></div></div>`;
  }
  const emps = DB.employees.filter(e => e.branchId === bId && e.active !== false).sort((a,b) => a.name.localeCompare(b.name,'ar'));
  const dailyMap = {};
  DB.daily.forEach(d => { if(d.dateKey === date && d.branchId === bId) dailyMap[d.empId] = d; });
  const branchShifts = DB.shifts.filter(s => s.branchId === bId);
  const defShift = getDefaultShift(bId);
  const savedCount = Object.keys(dailyMap).length;
  if(!emps.length){
    return `<div class="card"><div class="card-header"><div class="card-title">التسجيل اليومي</div></div><div class="form-row">${branchField}${dateNav}</div><div class="empty"><div class="empty-icon">👥</div><div class="empty-title">لا يوجد موظفين</div></div></div>`;
  }
  const rows = emps.map(e => {
    const rec = dailyMap[e.id] || {};
    const shiftId = rec.shiftId || e.shiftId || defShift?.id || '';
    const status = rec.status || 'present';
    const permType = rec.permType || 'none';
    const permHours = rec.permHours || '';
    const notes = rec.notes || '';
    const timeIn = rec.timeIn || '';
    const timeOut = rec.timeOut || '';
    return `<tr data-empid="${e.id}" data-branch="${bId}" data-date="${date}">
      <td style="text-align:right;min-width:170px">
        <div style="font-weight:600">${esc(e.name)}</div>
        <div class="muted">${esc(e.code)}</div>
        ${dailyMap[e.id] ? '<span class="badge b-blue" style="margin-top:4px">محفوظ</span>' : ''}
      </td>
      <td style="min-width:140px">
        <select class="f-shift" onchange="saveRow('${e.id}')">
          <option value="">—</option>
          ${branchShifts.map(s => `<option value="${s.id}" ${shiftId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
        </select>
      </td>
      <td><input type="time" class="f-in" value="${timeIn}" onchange="saveRow('${e.id}')"></td>
      <td><input type="time" class="f-out" value="${timeOut}" onchange="saveRow('${e.id}')"></td>
      <td><select class="f-status" onchange="saveRow('${e.id}')">${Object.keys(STATUS).map(k => `<option value="${k}" ${status === k ? 'selected' : ''}>${STATUS[k]}</option>`).join('')}</select></td>
      <td><select class="f-ptype" onchange="saveRow('${e.id}');togglePermHours('${e.id}')">${Object.keys(PERM).map(k => `<option value="${k}" ${permType === k ? 'selected' : ''}>${PERM[k]}</option>`).join('')}</select></td>
      <td><input type="number" class="f-phours perm-hours" min="0" max="24" step="0.5" value="${permHours}" onchange="saveRow('${e.id}')" style="${permType === 'hour' ? '' : 'display:none'}"></td>
      <td><input type="text" class="f-notes" value="${esc(notes)}" style="min-width:120px" onchange="saveRow('${e.id}')"></td>
    </tr>`;
  }).join('');
  return `<div class="card">
    <div class="card-header">
      <div><div class="card-title">التسجيل اليومي</div><div class="card-subtitle">${emps.length} موظف — ${savedCount} مسجل</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" onclick="copyFromYesterday('${bId}','${date}')">📋 نسخ من الأمس</button>

        <button class="btn btn-success btn-sm" onclick="saveAll('${bId}','${date}')">💾 حفظ</button>

      <thead><tr><th>الموظف</th><th>الشفت</th><th>الدخول</th><th>الخروج</th><th>الحالة</th><th>الإذن</th><th>ساعات الإذن</th><th>ملاحظات</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;

function setDailyBranch(b){ UI.dailyBranch = b; renderPage(); }
function setDailyDate(d){ UI.dailyDate = d; renderPage(); }
function togglePermHours(empId){
  const tr = document.querySelector(`tr[data-empid="${empId}"]`);
  if(!tr) return;
  const val = tr.querySelector('.f-ptype').value;
  const inp = tr.querySelector('.f-phours');
  inp.style.display = val === 'hour' ? 'block' : 'none';
  if(val !== 'hour') inp.value = '';
}
function saveRow(empId){
  const tr = document.querySelector(`tr[data-empid="${empId}"]`);
  if(!tr) return;
  tr.classList.add('row-saving');
  clearTimeout(tr.__t);
  tr.__t = setTimeout(async () => {
    await persistRow(tr, empId);
    tr.classList.remove('row-saving');
    tr.classList.add('row-saved');
    setTimeout(() => tr.classList.remove('row-saved'), 1500);
  }, 400);
}
function rowDataFromTr(tr, bId, date){
  const empId = tr.dataset.empid;
  return {
    branchId: bId, dateKey: date, empId,
    shiftId: tr.querySelector('.f-shift').value,
    timeIn: tr.querySelector('.f-in').value,
    timeOut: tr.querySelector('.f-out').value,
    status: tr.querySelector('.f-status').value,
    permType: tr.querySelector('.f-ptype').value,
    permHours: num(tr.querySelector('.f-phours').value),
    notes: tr.querySelector('.f-notes').value.trim(),
    updatedBy: currentUser.name,
    updatedAt: Date.now()
  };
}
function isRowEmpty(data, emp, bId){
  const defShift = emp?.shiftId || getBranch(bId)?.defaultShiftId || '';
  return !data.timeIn && !data.timeOut && !data.notes
    && data.status === 'present' && data.permType === 'none'
    && !data.permHours && data.shiftId === defShift;
}
async function persistRow(tr, empId){
  const bId = tr.dataset.branch;
  const date = tr.dataset.date;
  const data = rowDataFromTr(tr, bId, date);
  const emp = DB.employees.find(e => e.id === empId);
  const isEmpty = isRowEmpty(data, emp, bId);
  const existing = DB.daily.find(d => d.branchId === bId && d.dateKey === date && d.empId === empId);
  try {
    if(isEmpty && existing){
      await fsDel('daily', existing.id);
      DB.daily = DB.daily.filter(d => d.id !== existing.id);
    } else if(!isEmpty && existing){
      await fsUpd('daily', existing.id, data);
      Object.assign(existing, data);
    } else if(!isEmpty){
      const rec = await fsAdd('daily', data);
      DB.daily.push(rec);
    }
  } catch(e){ console.error(e); }
}
async function saveAll(bId, date){
  const rows = document.querySelectorAll('tr[data-empid]');
  if(!rows.length) return;
  showLoader(true);
  try {
    rows.forEach(tr => { clearTimeout(tr.__t); tr.classList.remove('row-saving'); });
    const old = DB.daily.filter(d => d.branchId === bId && d.dateKey === date);
    const newRecords = [];
    rows.forEach(tr => {
      const empId = tr.dataset.empid;
      const emp = DB.employees.find(e => e.id === empId);
      const data = rowDataFromTr(tr, bId, date);
      if(isRowEmpty(data, emp, bId)) return;
      newRecords.push(data);
    });
    const totalOps = old.length + newRecords.length;
    if(totalOps <= 450){
      const b = writeBatch(db);
      old.forEach(d => b.delete(doc(db, 'daily', d.id)));
      newRecords.forEach(data => b.set(doc(collection(db, 'daily')), data));
      await b.commit();
    } else {
      for(let i=0; i<old.length; i+=400){
        const b = writeBatch(db);
        old.slice(i, i+400).forEach(d => b.delete(doc(db, 'daily', d.id)));
        await b.commit();
      }
      for(let i=0; i<newRecords.length; i+=400){
        const b = writeBatch(db);
        newRecords.slice(i, i+400).forEach(data => b.set(doc(collection(db, 'daily')), data));
        await b.commit();
      }
    }
    await loadAll();
    renderPage();
  } catch(e){ alert('خطأ في الحفظ: ' + e.message); }
  finally { showLoader(false); }
}
async function copyFromYesterday(bId, date){
  const base = new Date(date+'T00:00:00');
  const y = new Date(base); y.setDate(y.getDate()-1);
  const yKey = localKey(y);
  const prev = DB.daily.filter(d => d.branchId === bId && d.dateKey === yKey);
  if(!prev.length) return;
  if(!confirm(`نسخ ${prev.length} سجل من ${yKey}؟`)) return;
  for(const p of prev){
    const tr = document.querySelector(`tr[data-empid="${p.empId}"]`);
    if(!tr) continue;
    if(p.shiftId) tr.querySelector('.f-shift').value = p.shiftId;
    if(p.status) tr.querySelector('.f-status').value = p.status;
    if(p.permType) tr.querySelector('.f-ptype').value = p.permType;
    if(p.permHours) tr.querySelector('.f-phours').value = p.permHours;
    if(p.notes) tr.querySelector('.f-notes').value = p.notes;
    togglePermHours(p.empId);
  }
}

/* ============================================================
   ✅ أدوات التعريب — تحويل الأرقام والأسماء والتواريخ للعربية
   ============================================================ */

const AR_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];

/** تحويل الأرقام إلى أرقام عربية (٠-٩) */
function arNum(v){
  return String(v==null?'':v).replace(/[0-9]/g, d => AR_DIGITS[+d]);
}

/** تحويل المدة إلى نص عربي بأرقام عربية */
function fmtMinsAr(m){
  return arNum(fmtMins(m));
}

/** تاريخ كامل بالعربي: الأحد ٢٧ سبتمبر ٢٠٢٦ */
function fmtDateArFull(dateKey){
  if(!dateKey) return '—';
  const d = new Date(dateKey + 'T00:00:00');
  if(isNaN(d.getTime())) return dateKey;
  const day = DAYS[d.getDay()];
  let month = '';
  try { month = d.toLocaleDateString('ar-EG', { month:'long' }); } catch(e){ month = ''; }
  return `${day} ${arNum(d.getDate())} ${month} ${arNum(d.getFullYear())}`.replace(/\s+/g,' ');
}

/** تحويل وقت HH:MM إلى صيغة عربية: ٩:٠٥ ص */
function arTime(hm){
  if(!hm) return '—';
  const parts = String(hm).split(':');
  let h = parseInt(parts[0], 10);
  const m = parseInt(parts[1] || '0', 10);
  if(isNaN(h)) return '—';
  const period = h < 12 ? 'ص' : 'م';
  let h12 = h % 12;
  if(h12 === 0) h12 = 12;
  return `${arNum(h12)}:${arNum(String(m).padStart(2,'0'))} ${period}`;
}

/* ====== قواعد النقل الصوتي (للأسماء غير الموجودة في القاموس) ====== */
const TRANSLIT_RULES = [
  ['kh','خ'],['sh','ش'],['th','ث'],['gh','غ'],['dh','ذ'],['ch','ش'],['ph','ف'],
  ['aa','ا'],['ee','ي'],['oo','و'],['ou','و'],['ei','ي'],['ai','اي'],['ay','اي'],
  ['a','ا'],['b','ب'],['c','ك'],['d','د'],['e','ي'],['f','ف'],['g','ج'],['h','ه'],
  ['i','ي'],['j','ج'],['k','ك'],['l','ل'],['m','م'],['n','ن'],['o','و'],['p','ب'],
  ['q','ق'],['r','ر'],['s','س'],['t','ت'],['u','و'],['v','ف'],['w','و'],['x','كس'],
  ['y','ي'],['z','ز']
];

function translitWord(w){
  let out = '', i = 0;
  while(i < w.length){
    let matched = false;
    for(const [en, ar] of TRANSLIT_RULES){
      if(w.startsWith(en, i)){ out += ar; i += en.length; matched = true; break; }
    }
    if(!matched) i++;
  }
  return out || w;
}

/**
 * تحويل الاسم الإنجليزي إلى عربي.
 * - لو الاسم عربي أصلاً → يرجعه كما هو
 * - لو موجود في القاموس → يرجعه بالعربي الصحيح
 * - غير كده → نقل صوتي تقريبي
 */
function arabizeName(name){
  const s = String(name == null ? '' : name).trim();
  if(!s) return '';
  if(!/[A-Za-z]/.test(s)) return s;
  return s.replace(/[A-Za-z][A-Za-z'\-]*/g, word => {
    const key = word.toLowerCase().replace(/[^a-z]/g,'');
    if(!key) return word;
    if(AR_NAME_DICT[key]) return AR_NAME_DICT[key];
    return translitWord(key);
  });
}

/** تقرير الحضور اليومي — بأسماء الموظفين ومواعيدهم */
function buildDailyWhatsAppText(bId, date){
  const branch = getBranch(bId);
  const emps = DB.employees
    .filter(e => e.branchId === bId && e.active !== false)
    .sort((a,b) => String(a.name||'').localeCompare(String(b.name||''),'ar'));

  const dailyMap = {};
  DB.daily.forEach(d => { if(d.dateKey === date && d.branchId === bId) dailyMap[d.empId] = d; });

  const punchMap = {};
  DB.punches.forEach(p => {
    if(p.dateKey === date && p.branchId === bId){
      (punchMap[p.empId] = punchMap[p.empId] || []).push(p);
    }
  });

  let present = 0, absent = 0, leave = 0, mission = 0, incomplete = 0;
  const lines = [];

  emps.forEach(e => {
    const rec = dailyMap[e.id] || null;
    const punches = punchMap[e.id] || [];
    const day = calcDay(e, date, rec, punches, bId);

    let icon = '✅';
    if(day.status === 'غياب'){ absent++; icon = '❌'; }
    else if(day.status === 'أجازة'){ leave++; icon = '🏖️'; }
    else if(day.status === 'مهمة'){ mission++; icon = '🎯'; }
    else if(day.status === 'بصمة ناقصة'){ incomplete++; icon = '⚠️'; }
    else present++;

    let line = `${icon} ${arabizeName(e.name)}`;
    if(day.timeIn || day.timeOut){
      line += `\n     🕐 الدخول: ${arTime(day.timeIn)}  ←  الخروج: ${arTime(day.timeOut)}`;
    }
    line += `\n     📌 ${day.status}`;
    if(day.lateness > 0) line += ` — تأخير ${arNum(Math.round(day.lateness))} دقيقة`;
    if(day.excusedMins > 0) line += ` — إذن ${fmtMinsAr(day.excusedMins)}`;
    const notes = rec?.notes ? String(rec.notes).trim() : '';
    if(notes) line += `\n     📝 ${notes}`;
    lines.push(line);
  });

  let txt = `━━━━━━━━━━━━━━━━━━\n`;
  txt += `🏢 الفرع: ${branch?.name || '—'}\n`;
  txt += `📅 التاريخ: ${fmtDateArFull(date)}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `👥 إجمالي الموظفين: ${arNum(emps.length)}\n`;
  txt += `✅ حاضر: ${arNum(present)}\n`;
  if(absent)     txt += `❌ غائب: ${arNum(absent)}\n`;
  if(leave)      txt += `🏖️ أجازة: ${arNum(leave)}\n`;
  if(mission)    txt += `🎯 مهمة: ${arNum(mission)}\n`;
  if(incomplete) txt += `⚠️ بصمة ناقصة: ${arNum(incomplete)}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `📋 تفاصيل الموظفين:\n`;
  txt += lines.length ? lines.join('\n\n') : 'لا يوجد موظفون';
  txt += `\n━━━━━━━━━━━━━━━━━━`;

  return txt;
}

/** تقرير التقارير — ملخص + تفاصيل كل موظف */
function buildReportWhatsAppText(){
  if(!lastReport || !lastReport.rows.length) return '';
  const { rows, branchId, from, to } = lastReport;

  let gP=0, gA=0, gL=0, gM=0, gI=0, gW=0, gLt=0, gO=0;
  rows.forEach(r => {
    gP += r.totals.present;
    gA += r.totals.absent;
    gL += r.totals.leave;
    gM += r.totals.mission;
    gI += r.totals.incomplete;
    gW += r.totals.workMins;
    gLt += r.totals.lateness;
    gO += r.totals.overtime;
  });

  const period = `${from ? fmtDateArFull(from) : 'البداية'} ← ${to ? fmtDateArFull(to) : 'الآن'}`;

  let txt = `━━━━━━━━━━━━━━━━━━\n`;
  txt += `🏢 الفرع: ${branchName(branchId)}\n`;
  txt += `📅 الفترة: ${period}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `👥 عدد الموظفين: ${arNum(rows.length)}\n`;
  txt += `✅ إجمالي الحضور: ${arNum(gP)}\n`;
  if(gA)  txt += `❌ إجمالي الغياب: ${arNum(gA)}\n`;
  if(gL)  txt += `🏖️ إجمالي الأجازات: ${arNum(gL)}\n`;
  if(gM)  txt += `🎯 إجمالي المهام: ${arNum(gM)}\n`;
  if(gI)  txt += `⚠️ بصمة ناقصة: ${arNum(gI)}\n`;
  txt += `🕒 إجمالي ساعات العمل: ${fmtMinsAr(gW)}\n`;
  txt += `⏰ إجمالي التأخير: ${fmtMinsAr(gLt)}\n`;
  txt += `⚖️ صافي إضافي/عجز: ${gO >= 0 ? '+' : ''}${fmtMinsAr(gO)}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `📋 تفاصيل الموظفين:\n\n`;

  const lines = rows.map(r => {
    const t = r.totals;
    let line = `👤 ${arabizeName(r.emp.name)}`;
    line += `\n     📅 أيام: ${arNum(t.days)} | ✅ حضور: ${arNum(t.present)} | ❌ غياب: ${arNum(t.absent)}`;
    if(t.leave)   line += ` | 🏖️ أجازة: ${arNum(t.leave)}`;
    if(t.mission) line += ` | 🎯 مهمة: ${arNum(t.mission)}`;
    line += `\n     🕒 ساعات العمل: ${fmtMinsAr(t.workMins)}`;
    line += `\n     ⏰ تأخير: ${fmtMinsAr(t.lateness)}`;
    line += `\n     ⚖️ صافي: ${t.overtime >= 0 ? '+' : ''}${fmtMinsAr(t.overtime)}`;
    return line;
  });

  txt += lines.length ? lines.join('\n\n') : 'لا توجد بيانات';
  txt += `\n━━━━━━━━━━━━━━━━━━`;

  return txt;
}

/** سجل الموظف الكامل — بالعربي */
function buildEmployeeWhatsAppText(){
  if(!lastEmpReport) return '';
  const { emp, from, to, branchStats, grand } = lastEmpReport;

  const period = `${from ? fmtDateArFull(from) : 'البداية'} ← ${to ? fmtDateArFull(to) : 'الآن'}`;

  let txt = `━━━━━━━━━━━━━━━━━━\n`;
  txt += `👤 الاسم: ${arabizeName(emp.name)}\n`;
  txt += `🔢 رقم البصمة: ${arNum(emp.code)}\n`;
  txt += `🏢 الفرع: ${branchName(emp.branchId)}\n`;
  txt += `📅 الفترة: ${period}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `📊 الإجمالي:\n`;
  txt += `📅 عدد الأيام: ${arNum(grand.days)}\n`;
  txt += `✅ حضور: ${arNum(grand.present)}\n`;
  if(grand.absent)     txt += `❌ غياب: ${arNum(grand.absent)}\n`;
  if(grand.leave)      txt += `🏖️ أجازة: ${arNum(grand.leave)}\n`;
  if(grand.mission)    txt += `🎯 مهمة: ${arNum(grand.mission)}\n`;
  if(grand.incomplete) txt += `⚠️ بصمة ناقصة: ${arNum(grand.incomplete)}\n`;
  txt += `🕒 إجمالي ساعات العمل: ${fmtMinsAr(grand.workMins)}\n`;
  txt += `⏰ إجمالي التأخير: ${fmtMinsAr(grand.lateness)}\n`;
  txt += `⚖️ صافي إضافي/عجز: ${grand.overtime >= 0 ? '+' : ''}${fmtMinsAr(grand.overtime)}\n`;

  const history = emp.transferHistory || [];
  if(history.length){
    txt += `━━━━━━━━━━━━━━━━━━\n`;
    txt += `🔄 سجل التنقلات:\n`;
    history.forEach(h => {
      txt += `• ${h.fromName} ← ${h.toName} — ${fmtDateArFull(h.date)}${h.reason ? ' (' + h.reason + ')' : ''}\n`;
    });
  }

  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `📋 التفاصيل اليومية:\n\n`;

  const lines = [];
  branchStats.forEach(b => {
    lines.push(`🏢 ${b.branchName}  (${fmtDateArFull(b.firstDate)} ← ${fmtDateArFull(b.lastDate)})`);
    b.days.forEach(d => {
      let line = `   • ${fmtDateArFull(d.dateKey)}`;
      if(d.timeIn || d.timeOut){
        line += `\n        🕐 ${arTime(d.timeIn)} ← ${arTime(d.timeOut)}`;
      }
      line += `\n        📌 ${d.status}`;
      if(d.lateness > 0) line += ` — تأخير ${arNum(Math.round(d.lateness))} دقيقة`;
      if(d.excusedMins > 0) line += ` — إذن ${fmtMinsAr(d.excusedMins)}`;
      lines.push(line);
    });
    lines.push('');
  });

  txt += lines.length ? lines.join('\n') : 'لا توجد سجلات';
  txt += `\n━━━━━━━━━━━━━━━━━━`;

  return txt;
}

/** فتح نافذة مشاركة الواتساب */
function openWhatsAppShare(text, title){
  if(!text){ alert('لا يوجد محتوى لمشاركته'); return; }
  let defaultPhone = '';
  if(UI.dailyBranch){
    const b = getBranch(UI.dailyBranch);
    if(b?.whatsapp) defaultPhone = b.whatsapp;
  } else if(currentUser?.branchId){
    const b = getBranch(currentUser.branchId);
    if(b?.whatsapp) defaultPhone = b.whatsapp;
  }

  showModal(`
    <div class="modal-header">📤 إرسال عبر واتساب</div>
    <div class="field" style="margin-bottom:12px">
      <label>رقم الواتساب (اختياري)</label>
      <input id="waPhone" type="tel" dir="ltr" style="text-align:left"
        placeholder="مثال: 201012345678 — اتركه فارغ لاختيار جهة الاتصال يدويًا"
        value="${esc(defaultPhone)}">
      <div class="muted" style="margin-top:4px;font-size:11px">
        💡 اكتب الرقم بالصيغة الدولية بدون + أو مسافات (مثال: 201012345678)
      </div>
    </div>
    <div class="field" style="margin-bottom:12px">
      <label>📄 معاينة الرسالة (${esc(title)})</label>
      <textarea id="waText" class="wa-preview" readonly>${esc(text)}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-whatsapp" onclick="sendWhatsApp()">📱 فتح واتساب</button>
      <button class="btn btn-outline" onclick="copyWhatsAppText()">📋 نسخ النص</button>
      <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
    </div>
    <div class="muted" style="margin-top:12px;font-size:11.5px;text-align:center;padding-top:10px;border-top:1px solid var(--gray-100)">
      💡 على الموبايل هيظهرلك خيار "مشاركة" مع كل التطبيقات المتاحة
    </div>
  `);

  setTimeout(() => {
    const el = $('waPhone');
    if(el && !el.value) el.focus();
  }, 100);
}

/** فتح واتساب مع النص */
function sendWhatsApp(){
  const text = $('waText')?.value || '';
  if(!text){ alert('لا يوجد نص'); return; }

  let phone = ($('waPhone')?.value || '').trim().replace(/[^\d+]/g, '');
  phone = phone.replace(/^\+/, '').replace(/^0+/, '');

  if(!phone && navigator.share){
    navigator.share({ text, title: 'تقرير الحضور' })
      .then(() => closeModal())
      .catch(err => {
        if(err.name !== 'AbortError'){
          const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
          window.open(url, '_blank');
        }
      });
    return;
  }

  const encoded = encodeURIComponent(text);
  const url = phone
    ? `https://wa.me/${phone}?text=${encoded}`
    : `https://wa.me/?text=${encoded}`;

  window.open(url, '_blank');
  closeModal();
}

/** نسخ النص للحافظة */
function copyWhatsAppText(){
  const text = $('waText')?.value || '';
  if(!text) return;
  const done = () => {
    const btn = document.querySelector('.modal-actions button:nth-child(2)');
    if(btn){
      const old = btn.textContent;
      btn.textContent = '✅ تم النسخ';
      setTimeout(() => { btn.textContent = old; }, 1500);
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => {
      const ta = $('waText');
      if(ta){ ta.removeAttribute('readonly'); ta.select(); document.execCommand('copy'); ta.setAttribute('readonly',''); done(); }
    });
  } else {
    const ta = $('waText');
    if(ta){ ta.removeAttribute('readonly'); ta.select(); document.execCommand('copy'); ta.setAttribute('readonly',''); done(); }
  }
}

function shareDailyWhatsApp(bId, date){
  if(!bId){ alert('اختر الفرع'); return; }
  UI.dailyBranch = bId;
  const text = buildDailyWhatsAppText(bId, date);
  openWhatsAppShare(text, `تقرير ${getBranch(bId)?.name || ''} - ${date}`);
}

function shareReportWhatsApp(){
  const text = buildReportWhatsAppText();
  if(!text){ alert('اعرض التقرير أولاً'); return; }
  const title = `تقرير ${branchName(lastReport.branchId)}`;
  openWhatsAppShare(text, title);
}

function shareEmployeeWhatsApp(){
  const text = buildEmployeeWhatsAppText();
  if(!text){ alert('اعرض السجل أولاً'); return; }
  openWhatsAppShare(text, `سجل ${arabizeName(lastEmpReport.emp.name)}`);
}

async function addBranch(){

  const user = $('brUser').value.trim();
  const pass = $('brPass').value.trim();
  const mgr = $('brMgr').value.trim() || name;

  if(DB.users.some(u => u.username.toLowerCase() === user.toLowerCase())){ alert('اسم المستخدم مستخدم'); return; }
  showLoader(true);
  try {
    const b = await fsAdd('branches', { name, defaultShiftId:'', whatsapp: wa, createdAt: Date.now() });
    await fsAdd('users', { username: user, passwordHash: await hash(pass), role: 'branch', name: mgr, branchId: b.id, createdAt: Date.now() });
    await loadAll();
    renderPage();
  } catch(e){ alert(e.message); }
  finally { showLoader(false); }

function autoShiftHours(){
  const s = $('shStart').value, e = $('shEnd').value;
  if(!s || !e) return;
  const [sh,sm] = s.split(':').map(Number);
  const [eh,em] = e.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins <= 0) mins += 1440;
  $('shHours').value = (mins/60).toFixed(1).replace(/\.0$/,'');
}
async function addShift(){
  const bId = $('shBranch').value;
  const name = $('shName').value.trim();
  const start = $('shStart').value;
  const end = $('shEnd').value;
  const hours = num($('shHours').value) || 8;
  const graceMins = num($('shGrace').value);
  const offDays = Array.from(document.querySelectorAll('.shOff:checked')).map(c => +c.value);
  if(!bId || !name){ alert('أكمل الحقول المطلوبة'); return; }
  showLoader(true);
  try {
    const sh = await fsAdd('shifts', { branchId:bId, name, start, end, hours, graceMins, offDays, createdAt: Date.now() });
    const br = getBranch(bId);
    if(br && !br.defaultShiftId) await fsUpd('branches', bId, { defaultShiftId: sh.id });
    await loadAll();
    renderPage();
  } catch(e){ alert(e.message); }
  finally { showLoader(false); }
}
async function deleteShift(id){
  if(!confirm('حذف الشفت؟')) return;

    renderPage();
  } catch(e){ alert(e.message); }
  finally { showLoader(false); }
}

async function confirmTransfer(empId){
  const emp = DB.employees.find(e => e.id === empId);
  if(!emp) return;
  const toBranchId = $('transferToBranch').value;
  const date = $('transferDate').value;
  const reason = $('transferReason').value.trim();
  if(!toBranchId || !date){ alert('أكمل الحقول'); return; }
  const history = emp.transferHistory || [];
  history.push({
    from: emp.branchId, fromName: branchName(emp.branchId),
    to: toBranchId, toName: branchName(toBranchId),
    date, reason, by: currentUser.name, at: Date.now()
  });
  showLoader(true);
  try {
    await fsUpd('employees', empId, { branchId: toBranchId, transferHistory: history, lastTransfer: date });
    await loadAll();
    closeModal();
    renderPage();
  } catch(e){ alert(e.message); }
  finally { showLoader(false); }
}

async function importEmployees(ev){

  if(!bId){ alert('اختر الفرع'); ev.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = async e => {
    showLoader(true);
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', codepage:1256 });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { raw:false });
      if(!rows.length){ alert('الملف فارغ'); return; }
      const keys = Object.keys(rows[0]);
      const nameKey = keys.find(k => /name|الاسم|اسم/i.test(k));
      const codeKey = keys.find(k => /no\.?|code|id|كود|رقم/i.test(k));
      if(!nameKey || !codeKey){ alert('مطلوب عمودين: اسم + رقم بصمة'); return; }

      const items = []; let skipped = 0, dup = 0;
      rows.forEach(r => {

        const code = String(r[codeKey]||'').trim();

        if(existing.some(e => norm(e.code) === norm(code)) || items.some(i => norm(i.code) === norm(code))){ dup++; return; }
        items.push({ branchId:bId, name, code, shiftId:'', active: true, createdAt: Date.now() });

      alert(`تم استيراد ${items.length} موظف\n(مكرر: ${dup} | ناقص: ${skipped})`);
      renderPage();
    } catch(err){ alert(err.message); }

  };
  reader.readAsArrayBuffer(file);

      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { raw:false });
      const emps = DB.employees.filter(e => e.branchId === bId);
      if(!emps.length){ alert('لا يوجد موظفين'); return; }
      if(replace) await fsBatchDel('punches', p => p.branchId === bId);
      const items = []; let matched = 0, skipped = 0;

}

function detectShift(empId, excludeDate){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 45);
  const cutoffKey = localKey(cutoff);
  const ps = DB.punches.filter(p => p.empId === empId && p.dateKey !== excludeDate && p.dateKey >= cutoffKey);
  if(ps.length < 4) return null;
  const byDay = {};
  ps.forEach(p => { (byDay[p.dateKey] = byDay[p.dateKey] || []).push(p); });
  const inH = [], outH = [];
  Object.values(byDay).forEach(day => {
    const sorted = day.slice().sort((a,b) => a.timeMs - b.timeMs);
    const cin = sorted.find(p => /in/i.test(p.status||'')) || sorted[0];
    const couts = sorted.filter(p => /out/i.test(p.status||''));
    const cout = couts.length ? couts[couts.length-1] : null;
    if(cin){ const d = new Date(cin.timeMs); inH.push(d.getHours() + d.getMinutes()/60); }
    if(cout){ const d = new Date(cout.timeMs); outH.push(d.getHours() + d.getMinutes()/60); }
  });
  if(inH.length < 3 || outH.length < 3) return null;
  inH.sort((a,b) => a-b);
  outH.sort((a,b) => a-b);
  const medIn = inH[Math.floor(inH.length/2)];
  const medOut = outH[Math.floor(outH.length/2)];
  const toHM = dec => {
    let h = Math.floor(dec), m = Math.round((dec-h)*60);
    if(m === 60){ h++; m = 0; }
    if(h >= 24) h -= 24;
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  };
  const start = toHM(medIn), end = toHM(medOut);
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins <= 0) mins += 1440;
  const hours = mins/60;
  if(hours < 4 || hours > 16) return null;
  return { start, end, hours: Math.round(hours*10)/10, name:'تلقائي', graceMins: 15, offDays: [], detected: true };
}

function calcDay(emp, dateKey, dailyRec, punches, branchId){
  let sh = null;
  if(dailyRec?.shiftId) sh = getShift(dailyRec.shiftId);
  if(!sh && emp.shiftId) sh = getShift(emp.shiftId);
  const bId = branchId || emp.branchId;
  if(!sh && getBranch(bId)?.defaultShiftId) sh = getShift(getBranch(bId).defaultShiftId);
  if(!sh) sh = detectShift(emp.id, dateKey);
  if(!sh) sh = { start:'09:00', end:'17:00', hours:8, graceMins:15, offDays:[5], name:'افتراضي' };
  const status = dailyRec?.status || 'present';
  const permType = dailyRec?.permType || 'none';
  const permHours = num(dailyRec?.permHours);
  if(status === 'leave') return mkDay(dateKey, 'أجازة', 0, 0, 0, 0, 0, sh, '—', '—');
  if(status === 'absent') return mkDay(dateKey, 'غياب', 0, 0, 0, 0, 0, sh, '—', '—');
  if(status === 'mission') return mkDay(dateKey, 'مهمة', 0, 0, 0, 0, 0, sh, '—', '—');
  let timeIn = dailyRec?.timeIn || '';
  let timeOut = dailyRec?.timeOut || '';
  if((!timeIn || !timeOut) && punches.length){
    const sorted = punches.slice().sort((a,b) => a.timeMs - b.timeMs);
    const cin = sorted.find(p => /in/i.test(p.status||'')) || sorted[0];
    const couts = sorted.filter(p => /out/i.test(p.status||''));
    const cout = couts.length ? couts[couts.length-1] : null;
    if(!timeIn && cin) timeIn = fmtHM(cin.timeMs);
    if(!timeOut && cout) timeOut = fmtHM(cout.timeMs);
  }
  if(!timeIn || !timeOut) return mkDay(dateKey, 'بصمة ناقصة', 0, 0, 0, 0, 0, sh, timeIn, timeOut);
  const dtIn = dtAt(dateKey, timeIn);
  let dtOut = dtAt(dateKey, timeOut);
  if(dtOut.getTime() < dtIn.getTime()) dtOut = new Date(dtOut.getTime() + 86400000);
  const workMins = Math.round((dtOut - dtIn) / 60000);
  const shiftMins = Math.round(sh.hours * 60);
  let excusedMins = 0;
  if(permType === 'hour') excusedMins = Math.round(permHours * 60);
  else if(permType === 'day') excusedMins = shiftMins;
  const shiftStartMs = dtAt(dateKey, sh.start).getTime();
  let diff = Math.round((dtIn.getTime() - shiftStartMs) / 60000);
  if(diff < -720) diff += 1440;
  if(diff > 720) diff -= 1440;
  let lateRaw = Math.max(0, diff);
  if(lateRaw <= (sh.graceMins||0)) lateRaw = 0;
  const requiredMins = Math.max(0, shiftMins - excusedMins);
  const overtime = workMins - requiredMins;
  const netLate = Math.max(0, lateRaw - (permType === 'hour' ? Math.round(permHours*60) : 0));
  let statusLabel = 'منتظم';
  if(netLate > 0) statusLabel = 'تأخير';
  else if(overtime < -1) statusLabel = 'عجز';
  return mkDay(dateKey, statusLabel, workMins, requiredMins, overtime, netLate, excusedMins, sh, timeIn, timeOut);
}
function mkDay(dateKey, status, workMins, requiredMins, overtime, lateness, excusedMins, shift, timeIn, timeOut){
  return { dateKey, status, workMins, requiredMins, overtime, lateness, excusedMins, shift, timeIn, timeOut };
}
function calcEmp(emp, from, to, branchId){
  const days = {};
  DB.daily.forEach(d => {
    if(d.empId !== emp.id) return;
    if(branchId && d.branchId !== branchId) return;
    if(from && d.dateKey < from) return;
    if(to && d.dateKey > to) return;
    days[d.dateKey] = d;
  });
  const pByDay = {};
  DB.punches.forEach(p => {
    if(p.empId !== emp.id) return;
    if(branchId && p.branchId !== branchId) return;
    if(from && p.dateKey < from) return;
    if(to && p.dateKey > to) return;
    (pByDay[p.dateKey] = pByDay[p.dateKey] || []).push(p);
  });
  Object.keys(pByDay).forEach(k => { if(!days[k]) days[k] = null; });
  const allDates = Object.keys(days).sort();
  const results = allDates.map(dk => calcDay(emp, dk, days[dk], pByDay[dk] || [], branchId));
  const t = { days: results.length, workMins:0, requiredMins:0, overtime:0, lateness:0, excused:0, present:0, absent:0, leave:0, mission:0, incomplete:0 };
  results.forEach(d => {
    t.workMins += d.workMins;
    t.requiredMins += d.requiredMins;
    t.overtime += d.overtime;
    t.lateness += d.lateness;
    t.excused += d.excusedMins;
    if(d.status === 'غياب') t.absent++;
    else if(d.status === 'أجازة') t.leave++;
    else if(d.status === 'مهمة') t.mission++;
    else if(d.status === 'بصمة ناقصة') t.incomplete++;
    else t.present++;
  });
  return { emp, days: results, totals: t };
}

                  <td><b>${workTxt}</b></td>
                  <td>${exc}</td>
                  <td>${lateTxt}</td>
                  <td>${ovTxt}</td>
                  <td><span class="badge ${cls}">${d.status}</span></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table></div>
        </div>`;
      }).join('');
    }
    body = summary + content;
  } else {
    body = `<div class="empty"><div class="empty-icon">📊</div><div class="empty-title">لا يوجد تقرير</div></div>`;
  }
  return `<div class="card">
    <div class="card-header">
      <div><div class="card-title">التقارير</div><div class="card-subtitle">عرض وتصدير التقارير</div></div>
    </div>
    <div class="form-row">
      <div class="field" style="max-width:260px">
        <label>الفرع</label>
        <select id="repBranch">
          <option value="">اختر</option>
          ${DB.branches.map(b => `<option value="${b.id}" ${bId === b.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="max-width:180px"><label>من</label><input type="date" id="repFrom" value="${UI.repFrom || ''}"></div>
      <div class="field" style="max-width:180px"><label>إلى</label><input type="date" id="repTo" value="${UI.repTo || ''}"></div>
      <div class="field" style="max-width:180px">
        <label>العرض</label>
        <select id="repView">
          <option value="detailed" ${view === 'detailed' ? 'selected' : ''}>تفصيلي</option>
          <option value="summary" ${view === 'summary' ? 'selected' : ''}>ملخص</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="generateReport()">عرض</button>
      <button class="btn btn-outline" onclick="exportReport()">📥 Excel</button>
      ${(lastReport && lastReport.rows.length) ? `<button class="btn btn-whatsapp" onclick="shareReportWhatsApp()">📤 واتساب</button>` : ''}
    </div>
  </div>
  ${body}`;
}
function generateReport(){
  const bId = $('repBranch').value;
  const from = $('repFrom').value;
  const to = $('repTo').value;
  const view = $('repView').value;
  if(!bId){ alert('اختر الفرع'); return; }
  UI.repBranch = bId; UI.repFrom = from; UI.repTo = to; UI.repView = view;
  const empIds = new Set();
  DB.daily.forEach(d => {
    if(d.branchId !== bId) return;
    if(from && d.dateKey < from) return;
    if(to && d.dateKey > to) return;
    empIds.add(d.empId);
  });
  DB.punches.forEach(p => {
    if(p.branchId !== bId) return;
    if(from && p.dateKey < from) return;
    if(to && p.dateKey > to) return;
    empIds.add(p.empId);
  });
  const emps = Array.from(empIds).map(id => DB.employees.find(e => e.id === id)).filter(Boolean);
  const rows = emps.map(e => calcEmp(e, from, to, bId)).filter(r => r.days.length > 0);
  lastReport = { rows, branchId: bId, from, to };
  renderPage();
}
function exportReport(){
  if(!lastReport || !lastReport.rows.length){ alert('لا يوجد تقرير'); return; }
  const out = [];
  lastReport.rows.forEach(r => {
    r.days.forEach(d => {
      out.push({
        'الفرع': branchName(lastReport.branchId),
        'رقم البصمة': r.emp.code,
        'الاسم': r.emp.name,
        'التاريخ': d.dateKey,
        'اليوم': dayName(d.dateKey),
        'الشفت': d.shift ? `${d.shift.start} - ${d.shift.end}` : '',
        'دخول': d.timeIn || '',
        'خروج': d.timeOut || '',
        'ساعات العمل': fmtMins(d.workMins),
        'المطلوب': fmtMins(d.requiredMins),
        'إذن (دقيقة)': d.excusedMins,
        'تأخير (دقيقة)': d.lateness,
        'إضافي/عجز (دقيقة)': d.overtime,
        'الحالة': d.status
      });
    });
  });
  const ws = XLSX.utils.json_to_sheet(out);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'تقرير');
  XLSX.writeFile(wb, `تقرير_${branchName(lastReport.branchId)}_${today()}.xlsx`);
}

    <button class="btn btn-outline" onclick="exportEmployeeReport()" ${!lastEmpReport ? 'disabled' : ''}>📥 Excel</button>
    <button class="btn btn-whatsapp" onclick="shareEmployeeWhatsApp()" ${!lastEmpReport ? 'disabled' : ''}>📤 واتساب</button>
  ` : '';

    <div class="card-header">
      <div><div class="card-title">👤 سجل الموظف الكامل</div><div class="card-subtitle">اختر الفرع ثم الموظف لعرض التاريخ الكامل</div></div>

      <div class="empty">

        <div class="empty-title">اختر الفرع أولاً</div>
        <div class="muted" style="margin-top:8px">ثم اختر الموظف لعرض سجله الكامل</div>
      </div>
    </div>`;
  }

  if(!empId){

      return header + `<div class="card">
        <div class="empty">
          <div class="empty-icon">👥</div>
          <div class="empty-title">لا يوجد موظفين في هذا الفرع</div>
          <div class="muted" style="margin-top:8px">اذهب للإعدادات → الموظفين → استورد موظفين لهذا الفرع</div>
        </div>
      </div>`;
    }
    return header + `<div class="card">
      <div class="card-header">
        <div><div class="card-title">👥 موظفي ${esc(branchName(filterBranchId))}</div><div class="card-subtitle">${branchEmps.length} موظف — اضغط على أي واحد لعرض سجله</div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">
        ${branchEmps.map(e => {
          const dailyCount = DB.daily.filter(d => d.empId === e.id).length;
          const punchCount = DB.punches.filter(p => p.empId === e.id).length;
          const transCount = (e.transferHistory || []).length;
          const isInactive = e.active === false;
          return `<div class="branch-section" style="cursor:pointer;transition:all .15s;padding:14px"
            onmouseover="this.style.borderColor='var(--primary)';this.style.background='#eff6ff'"
            onmouseout="this.style.borderColor='var(--gray-200)';this.style.background='#fff'"

                <div class="muted">رقم البصمة: ${esc(e.code)}</div>
                <div class="muted">الفرع الحالي: ${esc(branchName(e.branchId))}</div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
                  <span class="badge b-blue">${dailyCount} تسجيل</span>
                  <span class="badge b-gray">${punchCount} بصمة</span>
                  ${transCount ? `<span class="badge b-purple">${transCount} نقل</span>` : ''}
                </div>
              </div>
              <span class="badge ${isInactive ? 'b-red' : 'b-green'}">${isInactive ? 'منتهي' : 'نشط'}</span>
            </div>
            <button class="btn btn-primary btn-sm" style="width:100%;margin-top:12px">عرض السجل الكامل →</button>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  if(!emp){
    return header + `<div class="card"><div class="empty"><div class="empty-icon">❓</div><div class="empty-title">الموظف غير موجود</div></div></div>`;
  }

  const empInfo = `
    <div class="card" style="background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <div>
          <div style="font-size:22px;font-weight:800">${esc(emp.name)}</div>
          <div style="font-size:13px;opacity:.85;margin-top:4px">رقم البصمة: ${esc(emp.code)}</div>
        </div>
        <div style="text-align:left">
          <div style="font-size:12px;opacity:.85">الحالة</div>
          <div style="font-size:16px;font-weight:700">${emp.active === false ? 'منتهي' : 'نشط'}</div>
          ${emp.active === false ? `<div style="font-size:12px;opacity:.85">حتى ${fmtDate(emp.endDate)}</div>` : ''}
          <div style="font-size:12px;opacity:.85;margin-top:4px">الفرع الحالي: ${esc(branchName(emp.branchId))}</div>
        </div>
      </div>
    </div>`;

  const history = emp.transferHistory || [];
  const timelineHtml = history.length ? `<div class="card">
    <div class="card-header"><div class="card-title">🔄 سجل التنقلات (${history.length})</div></div>
    <div class="timeline">
      ${history.map(h => `
        <div class="timeline-item">
          <div style="font-weight:700">${esc(h.fromName)} ← ${esc(h.toName)}</div>
          <div class="muted">${fmtDate(h.date)}${h.reason ? ` — ${esc(h.reason)}` : ''}</div>
          <div class="muted" style="font-size:11px">بواسطة: ${esc(h.by || '—')}</div>
        </div>
      `).join('')}
    </div>
  </div>` : '';

  const from = UI.empRepFrom || '';
  const to = UI.empRepTo || '';
  const dayBranchMap = {};
  DB.daily.forEach(d => {
    if(d.empId !== emp.id) return;
    if(from && d.dateKey < from) return;
    if(to && d.dateKey > to) return;
    dayBranchMap[d.dateKey] = d.branchId;
  });
  DB.punches.forEach(p => {
    if(p.empId !== emp.id) return;
    if(from && p.dateKey < from) return;
    if(to && p.dateKey > to) return;
    if(!dayBranchMap[p.dateKey]) dayBranchMap[p.dateKey] = p.branchId;
  });
  const byBranch = {};
  Object.keys(dayBranchMap).forEach(dk => {
    (byBranch[dayBranchMap[dk]] = byBranch[dayBranchMap[dk]] || []).push(dk);
  });

  const branchStats = Object.keys(byBranch).map(bId => {
    const dates = byBranch[bId].sort();
    const days = dates.map(dk => {
      const rec = DB.daily.find(d => d.empId === emp.id && d.dateKey === dk && d.branchId === bId) || null;
      const punches = DB.punches.filter(p => p.empId === emp.id && p.dateKey === dk && p.branchId === bId);
      return calcDay(emp, dk, rec, punches, bId);
    });
    const t = { days: days.length, workMins:0, overtime:0, lateness:0, present:0, absent:0, leave:0, mission:0, incomplete:0 };
    days.forEach(d => {
      t.workMins += d.workMins;
      t.overtime += d.overtime;
      t.lateness += d.lateness;
      if(d.status === 'غياب') t.absent++;
      else if(d.status === 'أجازة') t.leave++;
      else if(d.status === 'مهمة') t.mission++;
      else if(d.status === 'بصمة ناقصة') t.incomplete++;
      else t.present++;
    });
    return { branchId: bId, branchName: branchName(bId), firstDate: dates[0], lastDate: dates[dates.length-1], days, totals: t };

  } else {
    branchesHtml = branchStats.map(b => {
      const c = b.totals.overtime >= 0 ? 'var(--primary)' : 'var(--danger)';
      return `<div class="branch-section">
        <div class="branch-section-header">
          <div>
            <div style="font-size:16px;font-weight:700">🏢 ${esc(b.branchName)}</div>
            <div class="muted">${b.firstDate} → ${b.lastDate}</div>
          </div>
          <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px">
            <span>📅 <b>${b.totals.days}</b> يوم</span>
            <span>✅ <b style="color:var(--success)">${b.totals.present}</b></span>
            <span>❌ <b style="color:var(--danger)">${b.totals.absent}</b></span>
            <span>🏖 <b style="color:var(--primary)">${b.totals.leave}</b></span>
            <span>⏰ <b style="color:var(--danger)">${fmtMins(b.totals.lateness)}</b></span>
            <span>⚖️ <b style="color:${c}">${b.totals.overtime>=0?'+':''}${fmtMins(b.totals.overtime)}</b></span>
          </div>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>التاريخ</th><th>الشفت</th><th>دخول</th><th>خروج</th><th>ساعات</th><th>إذن</th><th>تأخير</th><th>إضافي/عجز</th><th>الحالة</th></tr></thead>
          <tbody>
            ${b.days.map(d => {
              const shiftTxt = d.shift ? `${d.shift.start} - ${d.shift.end}` : '—';
              const detected = d.shift?.detected ? ' <span class="badge b-purple" style="font-size:9px">تلقائي</span>' : '';
              const exc = d.excusedMins > 0 ? `<span class="badge b-blue">${fmtMins(d.excusedMins)}</span>` : '—';
              const ovTxt = ['بصمة ناقصة','غياب','أجازة','مهمة'].includes(d.status) ? '—'
                : d.overtime > 0 ? `<b style="color:var(--primary)">+${fmtMins(d.overtime)}</b>`
                : d.overtime < 0 ? `<b style="color:var(--danger)">${fmtMins(d.overtime)}</b>` : '0';
              const workTxt = d.status === 'غياب' ? '—' : fmtMins(d.workMins);
              const lateTxt = d.lateness > 0 ? `<b style="color:var(--danger)">${fmtMins(d.lateness)}</b>` : '0';
              const cls = d.status === 'منتظم' ? 'b-green' : d.status === 'تأخير' ? 'b-red' : d.status === 'غياب' ? 'b-gray' : d.status === 'أجازة' ? 'b-blue' : d.status === 'مهمة' ? 'b-purple' : 'b-orange';
              return `<tr>
                <td>${d.dateKey}<br><span class="muted" style="font-size:11px">${dayName(d.dateKey)}</span></td>
                <td><span class="badge b-gray" style="font-size:10px">${shiftTxt}</span>${detected}</td>
                <td>${d.timeIn || '—'}</td>
                <td>${d.timeOut || '—'}</td>
                <td><b>${workTxt}</b></td>
                <td>${exc}</td>
                <td>${lateTxt}</td>
                <td>${ovTxt}</td>
                <td><span class="badge ${cls}">${d.status}</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>
      </div>`;
    }).join('');
  }

  return `${header}
  ${empInfo}
  ${timelineHtml}
  ${grandSummary}
  <div class="card">
    <div class="card-header">
      <div><div class="card-title">📋 التفاصيل حسب الفرع</div></div>
      <button class="btn btn-outline btn-sm" onclick="clearEmpSelection()">← رجوع للقائمة</button>
    </div>
    ${branchesHtml}
  </div>`;
}

function exportEmployeeReport(){
  if(!lastEmpReport){ alert('اعرض التقرير أولاً'); return; }
  const { emp, from, to, branchStats, grand, transferHistory } = lastEmpReport;
  const wb = XLSX.utils.book_new();

  const summaryRows = [];
  summaryRows.push({ 'البند': 'الاسم', 'القيمة': emp.name });
  summaryRows.push({ 'البند': 'رقم البصمة', 'القيمة': emp.code });
  summaryRows.push({ 'البند': 'الحالة', 'القيمة': emp.active === false ? 'منتهي' : 'نشط' });
  summaryRows.push({ 'البند': 'الفرع الحالي', 'القيمة': branchName(emp.branchId) });
  summaryRows.push({ 'البند': 'الفترة', 'القيمة': `${from || '—'} → ${to || '—'}` });
  summaryRows.push({ 'البند': '', 'القيمة': '' });
  summaryRows.push({ 'البند': '📊 الإجمالي الكامل', 'القيمة': '' });
  summaryRows.push({ 'البند': 'عدد الأيام', 'القيمة': grand.days });
  summaryRows.push({ 'البند': 'حضور', 'القيمة': grand.present });
  summaryRows.push({ 'البند': 'غياب', 'القيمة': grand.absent });
  summaryRows.push({ 'البند': 'أجازة', 'القيمة': grand.leave });
  summaryRows.push({ 'البند': 'مهمة', 'القيمة': grand.mission });
  summaryRows.push({ 'البند': 'بصمة ناقصة', 'القيمة': grand.incomplete });
  summaryRows.push({ 'البند': 'ساعات العمل', 'القيمة': fmtMins(grand.workMins) });
  summaryRows.push({ 'البند': 'التأخير', 'القيمة': fmtMins(grand.lateness) });
  summaryRows.push({ 'البند': 'إضافي/عجز', 'القيمة': fmtMins(grand.overtime) });

  if(transferHistory.length){
    summaryRows.push({ 'البند': '', 'القيمة': '' });
    summaryRows.push({ 'البند': '🔄 سجل التنقلات', 'القيمة': '' });
    transferHistory.forEach(h => {
      summaryRows.push({ 'البند': `${h.fromName} ← ${h.toName}`, 'القيمة': `${h.date}${h.reason ? ' — ' + h.reason : ''}` });
    });
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows), 'الملخص');

  const branchRows = branchStats.map(b => ({
    'الفرع': b.branchName,
    'من': b.firstDate,
    'إلى': b.lastDate,
    'أيام': b.totals.days,
    'حضور': b.totals.present,
    'غياب': b.totals.absent,
    'أجازة': b.totals.leave,
    'ساعات العمل': fmtMins(b.totals.workMins),
    'تأخير': fmtMins(b.totals.lateness),
    'إضافي/عجز': fmtMins(b.totals.overtime)
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(branchRows), 'حسب الفرع');

  const dailyRows = [];
  branchStats.forEach(b => {
    b.days.forEach(d => {
      dailyRows.push({
        'الفرع': b.branchName,
        'التاريخ': d.dateKey,
        'اليوم': dayName(d.dateKey),
        'الشفت': d.shift ? `${d.shift.start} - ${d.shift.end}` : '',
        'دخول': d.timeIn || '',
        'خروج': d.timeOut || '',
        'ساعات': fmtMins(d.workMins),
        'إذن': fmtMins(d.excusedMins),
        'تأخير': fmtMins(d.lateness),
        'إضافي/عجز': fmtMins(d.overtime),
        'الحالة': d.status
      });
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dailyRows), 'الأيام التفصيلية');

  XLSX.writeFile(wb, `سجل_${emp.name}_${today()}.xlsx`);
}

(async function init(){
  showLoader(true);
  try {
    await checkSetup();
    const uid = sessionStorage.getItem('uid');
    if(uid){
      const users = await fsAll('users');
      const u = users.find(x => x.id === uid);
      if(u){ currentUser = u; await loadAll(); enterApp(); }
    }
    ['loginUser','loginPass','loginName'].forEach(id => {
      const el = $(id);
      if(el) el.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
    });
  } catch(e){
    console.error('init failed:', e);
    $('loginPage').style.display = 'flex';
    $('app').style.display = 'none';
    const err = $('loginErr');
    err.textContent = '⚠️ خطأ في التهيئة: ' + (e?.message || e);
    err.style.display = 'block';
    $('loginHint').textContent = 'افتح Console (F12) للتفاصيل';
  } finally {
    showLoader(false);
  }
})();
