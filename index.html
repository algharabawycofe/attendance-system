async function handleUpload(ev){
  const file = ev.target.files[0]; if(!file) return;
  const bId = $('upBranch').value;
  const replace = $('upReplace').value === '1';
  if(!bId){ alert('اختر الفرع'); ev.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = async e => {
    showLoader(true);
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', codepage:1256 });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { raw:false });
      const emps = DB.employees.filter(e => e.branchId === bId);
      if(!emps.length){ alert('لا يوجد موظفين'); return; }
      if(replace) await fsBatchDel('punches', p => p.branchId === bId);
      const items = []; let matched = 0, skipped = 0;
      rows.forEach(r => {
        const code = String(r['No.'] ?? r['Code'] ?? r['ID'] ?? r['كود'] ?? r['الرقم'] ?? '').trim();
        const name = String(r['Name'] ?? r['الاسم'] ?? '').trim();
        const dtStr = r['Date/Time'] ?? r['DateTime'] ?? r['التاريخ'] ?? r['التاريخ والوقت'];
        const status = String(r['Status'] ?? r['الحالة'] ?? '').trim();
        if(!dtStr){ skipped++; return; }
        const dt = parseDate(dtStr);
        if(!dt){ skipped++; return; }
        const dateKey = localKey(dt);
        let emp = null;
        if(code){
          emp = emps.find(e => norm(e.code) === norm(code) && norm(e.name) === norm(name)) ||
                emps.find(e => norm(e.code) === norm(code));
        }
        if(!emp && name) emp = emps.find(e => norm(e.name) === norm(name));
        if(!emp){ skipped++; return; }
        matched++;
        items.push({ branchId: bId, empId: emp.id, code: emp.code, name: emp.name, dateKey, timeMs: dt.getTime(), status });
      });
      if(items.length) await fsBatchAdd('punches', items);
      await fsUpd('branches', bId, { lastUpload: Date.now() });
      await loadAll();
      $('uploadResult').innerHTML = `
        <div class="alert alert-success">تم الاستيراد — ${matched} سجل مرتبط${skipped ? ` | ${skipped} غير مرتبط` : ''}</div>
        <button class="btn btn-primary mt-3" onclick="navigateTo('reports')">الانتقال للتقارير</button>`;
    } catch(err){ alert(err.message); }
    finally { showLoader(false); ev.target.value = ''; }
  };
  reader.readAsArrayBuffer(file);
}

/* ============================================================
   حساب اليوم
   ============================================================ */

function detectShift(empId, excludeDate){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 45);
  const cutoffKey = localKey(cutoff);
  const ps = DB.punches.filter(p => p.empId === empId && p.dateKey !== excludeDate && p.dateKey >= cutoffKey);
  if(ps.length < 4) return null;
  const byDay = {};
  ps.forEach(p => { (byDay[p.dateKey] = byDay[p.dateKey] || []).push(p); });
  const inH = [], outH = [];
  Object.values(byDay).forEach(day => {
    const sorted = day.slice().sort((a,b) => a.timeMs - b.timeMs);
    const cin = sorted.find(p => /in/i.test(p.status||'')) || sorted[0];
    const couts = sorted.filter(p => /out/i.test(p.status||''));
    const cout = couts.length ? couts[couts.length-1] : null;
    if(cin){ const d = new Date(cin.timeMs); inH.push(d.getHours() + d.getMinutes()/60); }
    if(cout){ const d = new Date(cout.timeMs); outH.push(d.getHours() + d.getMinutes()/60); }
  });
  if(inH.length < 3 || outH.length < 3) return null;
  inH.sort((a,b) => a-b);
  outH.sort((a,b) => a-b);
  const medIn = inH[Math.floor(inH.length/2)];
  const medOut = outH[Math.floor(outH.length/2)];
  const toHM = dec => {
    let h = Math.floor(dec), m = Math.round((dec-h)*60);
    if(m === 60){ h++; m = 0; }
    if(h >= 24) h -= 24;
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  };
  const start = toHM(medIn), end = toHM(medOut);
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins <= 0) mins += 1440;
  const hours = mins/60;
  if(hours < 4 || hours > 16) return null;
  return { start, end, hours: Math.round(hours*10)/10, name:'تلقائي', graceMins: 15, offDays: [], detected: true };
}

function calcDay(emp, dateKey, dailyRec, punches, branchId){
  let sh = null;
  if(dailyRec?.shiftId) sh = getShift(dailyRec.shiftId);
  if(!sh && emp.shiftId) sh = getShift(emp.shiftId);
  const bId = branchId || emp.branchId;
  if(!sh && getBranch(bId)?.defaultShiftId) sh = getShift(getBranch(bId).defaultShiftId);
  if(!sh) sh = detectShift(emp.id, dateKey);
  if(!sh) sh = { start:'09:00', end:'17:00', hours:8, graceMins:15, offDays:[5], name:'افتراضي' };
  const status = dailyRec?.status || 'present';
  const permType = dailyRec?.permType || 'none';
  const permHours = num(dailyRec?.permHours);
  if(status === 'leave') return mkDay(dateKey, 'أجازة', 0, 0, 0, 0, 0, sh, '—', '—');
  if(status === 'absent') return mkDay(dateKey, 'غياب', 0, 0, 0, 0, 0, sh, '—', '—');
  if(status === 'mission') return mkDay(dateKey, 'مهمة', 0, 0, 0, 0, 0, sh, '—', '—');
  let timeIn = dailyRec?.timeIn || '';
  let timeOut = dailyRec?.timeOut || '';
  if((!timeIn || !timeOut) && punches.length){
    const sorted = punches.slice().sort((a,b) => a.timeMs - b.timeMs);
    const cin = sorted.find(p => /in/i.test(p.status||'')) || sorted[0];
    const couts = sorted.filter(p => /out/i.test(p.status||''));
    const cout = couts.length ? couts[couts.length-1] : null;
    if(!timeIn && cin) timeIn = fmtHM(cin.timeMs);
    if(!timeOut && cout) timeOut = fmtHM(cout.timeMs);
  }
  if(!timeIn || !timeOut) return mkDay(dateKey, 'بصمة ناقصة', 0, 0, 0, 0, 0, sh, timeIn, timeOut);
  const dtIn = dtAt(dateKey, timeIn);
  let dtOut = dtAt(dateKey, timeOut);
  if(dtOut.getTime() < dtIn.getTime()) dtOut = new Date(dtOut.getTime() + 86400000);
  const workMins = Math.round((dtOut - dtIn) / 60000);
  const shiftMins = Math.round(sh.hours * 60);
  let excusedMins = 0;
  if(permType === 'hour') excusedMins = Math.round(permHours * 60);
  else if(permType === 'day') excusedMins = shiftMins;
  const shiftStartMs = dtAt(dateKey, sh.start).getTime();
  let diff = Math.round((dtIn.getTime() - shiftStartMs) / 60000);
  if(diff < -720) diff += 1440;
  if(diff > 720) diff -= 1440;
  let lateRaw = Math.max(0, diff);
  if(lateRaw <= (sh.graceMins||0)) lateRaw = 0;
  const requiredMins = Math.max(0, shiftMins - excusedMins);
  const overtime = workMins - requiredMins;
  const netLate = Math.max(0, lateRaw - (permType === 'hour' ? Math.round(permHours*60) : 0));
  let statusLabel = 'منتظم';
  if(netLate > 0) statusLabel = 'تأخير';
  else if(overtime < -1) statusLabel = 'عجز';
  return mkDay(dateKey, statusLabel, workMins, requiredMins, overtime, netLate, excusedMins, sh, timeIn, timeOut);
}
function mkDay(dateKey, status, workMins, requiredMins, overtime, lateness, excusedMins, shift, timeIn, timeOut){
  return { dateKey, status, workMins, requiredMins, overtime, lateness, excusedMins, shift, timeIn, timeOut };
}
function calcEmp(emp, from, to, branchId){
  const days = {};
  DB.daily.forEach(d => {
    if(d.empId !== emp.id) return;
    if(branchId && d.branchId !== branchId) return;
    if(from && d.dateKey < from) return;
    if(to && d.dateKey > to) return;
    days[d.dateKey] = d;
  });
  const pByDay = {};
  DB.punches.forEach(p => {
    if(p.empId !== emp.id) return;
    if(branchId && p.branchId !== branchId) return;
    if(from && p.dateKey < from) return;
    if(to && p.dateKey > to) return;
    (pByDay[p.dateKey] = pByDay[p.dateKey] || []).push(p);
  });
  Object.keys(pByDay).forEach(k => { if(!days[k]) days[k] = null; });
  const allDates = Object.keys(days).sort();
  const results = allDates.map(dk => calcDay(emp, dk, days[dk], pByDay[dk] || [], branchId));
  const t = { days: results.length, workMins:0, requiredMins:0, overtime:0, lateness:0, excused:0, present:0, absent:0, leave:0, mission:0, incomplete:0 };
  results.forEach(d => {
    t.workMins += d.workMins;
    t.requiredMins += d.requiredMins;
    t.overtime += d.overtime;
    t.lateness += d.lateness;
    t.excused += d.excusedMins;
    if(d.status === 'غياب') t.absent++;
    else if(d.status === 'أجازة') t.leave++;
    else if(d.status === 'مهمة') t.mission++;
    else if(d.status === 'بصمة ناقصة') t.incomplete++;
    else t.present++;
  });
  return { emp, days: results, totals: t };
}

function generateReport(){
  const bId = $('repBranch').value;
  const from = $('repFrom').value;
  const to = $('repTo').value;
  const view = $('repView').value;
  if(!bId){ alert('اختر الفرع'); return; }
  UI.repBranch = bId; UI.repFrom = from; UI.repTo = to; UI.repView = view;
  const empIds = new Set();
  DB.daily.forEach(d => {
    if(d.branchId !== bId) return;
    if(from && d.dateKey < from) return;
    if(to && d.dateKey > to) return;
    empIds.add(d.empId);
  });
  DB.punches.forEach(p => {
    if(p.branchId !== bId) return;
    if(from && p.dateKey < from) return;
    if(to && p.dateKey > to) return;
    empIds.add(p.empId);
  });
  const emps = Array.from(empIds).map(id => DB.employees.find(e => e.id === id)).filter(Boolean);
  const rows = emps.map(e => calcEmp(e, from, to, bId)).filter(r => r.days.length > 0);
  lastReport = { rows, branchId: bId, from, to };
  renderPage();
}
function exportReport(){

        'دخول': d.timeIn || '',

/* ============================================================
   🔍 المقارنة
   ============================================================ */

const CMP_TOLERANCE = 10;

function timeToMins(t){
  if(!t || t === '—') return null;
  const [h,m] = String(t).split(':').map(Number);
  if(isNaN(h) || isNaN(m)) return null;
  return h*60 + m;
}

function calcBranchNetMins(dailyRec){
  const inM = timeToMins(dailyRec.timeIn);
  const outM = timeToMins(dailyRec.timeOut);
  if(inM === null || outM === null) return null;
  let workMins = outM - inM;
  if(workMins < 0) workMins += 1440;
  const perm = dailyRec.permType || 'none';
  const permHours = num(dailyRec.permHours);
  let permMins = 0;
  if(perm === 'hour') permMins = Math.round(permHours * 60);
  else if(perm === 'day') permMins = workMins;
  return Math.max(0, workMins - permMins);
}

function calcPunchMins(pIn, pOut){
  const inM = timeToMins(pIn);
  const outM = timeToMins(pOut);
  if(inM === null || outM === null) return null;
  let workMins = outM - inM;
  if(workMins < 0) workMins += 1440;
  return workMins;
}

function compareDayFull(emp, dateKey, dailyRec, punches){
  const r = {
    empId: emp.id, empName: emp.name, empCode: emp.code,
    dateKey, day: dayName(dateKey),
    branchIn: '', branchOut: '', branchStatus: 'present',
    branchPermType: 'none', branchPermHours: 0,
    branchRawMins: null, branchNetMins: null,
    punchIn: '', punchOut: '', hasPunch: false,
    punchMins: null,
    inDiff: null, outDiff: null, netDiff: null,
    issues: [], level: 'match'
  };

  if(dailyRec){
    r.branchIn = dailyRec.timeIn || '';
    r.branchOut = dailyRec.timeOut || '';
    r.branchStatus = dailyRec.status || 'present';
    r.branchPermType = dailyRec.permType || 'none';
    r.branchPermHours = num(dailyRec.permHours);
    if(r.branchIn && r.branchOut){
      r.branchRawMins = calcPunchMins(r.branchIn, r.branchOut);
      r.branchNetMins = calcBranchNetMins(dailyRec);
    }
  }

  if(punches && punches.length){
    const sorted = punches.slice().sort((a,b) => a.timeMs - b.timeMs);
    const cin = sorted.find(p => /in/i.test(p.status||'')) || sorted[0];
    const couts = sorted.filter(p => /out/i.test(p.status||''));
    const cout = couts.length ? couts[couts.length-1] : null;
    if(cin) r.punchIn = fmtHM(cin.timeMs);
    if(cout) r.punchOut = fmtHM(cout.timeMs);
    r.hasPunch = !!(cin || cout);
    if(r.punchIn && r.punchOut) r.punchMins = calcPunchMins(r.punchIn, r.punchOut);
  }

  if(!dailyRec && r.hasPunch){
    r.level = 'error';
    r.issues.push('الفرع مكتبش (فيه بصمة)');
    return r;
  }
  if(!dailyRec && !r.hasPunch){
    r.level = 'missing';
    r.issues.push('مفيش بيانات');
    return r;
  }

  const bStatus = r.branchStatus;

  if(bStatus === 'absent' || bStatus === 'leave' || bStatus === 'mission'){
    if(r.hasPunch){
      r.level = 'error';
      r.issues.push(`الفرع قال «${STATUS[bStatus] || bStatus}» لكن فيه بصمة`);
    } else {
      r.level = 'match';
    }
    return r;
  }

  if(!r.hasPunch){
    r.level = 'error';
    r.issues.push('الفرع قال «حاضر» لكن مفيش بصمة');
    return r;
  }

  const inDiffRaw = (timeToMins(r.branchIn) !== null && timeToMins(r.punchIn) !== null)
    ? timeToMins(r.branchIn) - timeToMins(r.punchIn) : null;
  const outDiffRaw = (timeToMins(r.branchOut) !== null && timeToMins(r.punchOut) !== null)
    ? timeToMins(r.branchOut) - timeToMins(r.punchOut) : null;
  r.inDiff = inDiffRaw;
  r.outDiff = outDiffRaw;

  if(inDiffRaw === null){
    r.level = 'warn';
    r.issues.push('دخول ناقص');
  } else if(Math.abs(inDiffRaw) > CMP_TOLERANCE){
    r.level = 'warn';
    r.issues.push(`فرق دخول ${inDiffRaw > 0 ? '+' : ''}${Math.abs(inDiffRaw)} دقيقة`);
  }

  if(outDiffRaw === null){
    if(r.level !== 'error') r.level = 'warn';
    r.issues.push('خروج ناقص');
  } else if(Math.abs(outDiffRaw) > CMP_TOLERANCE){
    if(r.level !== 'error') r.level = 'warn';
    r.issues.push(`فرق خروج ${outDiffRaw > 0 ? '+' : ''}${Math.abs(outDiffRaw)} دقيقة`);
  }

  if(r.branchNetMins !== null && r.punchMins !== null){
    r.netDiff = r.branchNetMins - r.punchMins;
    if(Math.abs(r.netDiff) > CMP_TOLERANCE){
      if(r.level !== 'error') r.level = 'warn';
      r.issues.push(`فرق صافي ${r.netDiff > 0 ? '+' : ''}${Math.abs(r.netDiff)} دقيقة`);
    }
  }

  if(r.branchPermType === 'hour' && r.branchPermHours > 0){
    r.issues.push(`إذن ${arNum(r.branchPermHours)} ساعة`);
  } else if(r.branchPermType === 'day'){
    r.issues.push('إذن يوم كامل');
  }

  return r;
}

function buildComparisonRows(branchId, from, to){
  const emps = DB.employees.filter(e => e.branchId === branchId && e.active !== false);
  const rows = [];
  const allDates = new Set();

  DB.daily.forEach(d => {
    if(d.branchId !== branchId) return;
    if(from && d.dateKey < from) return;
    if(to && d.dateKey > to) return;
    allDates.add(d.dateKey);
  });
  DB.punches.forEach(p => {
    if(p.branchId !== branchId) return;
    if(from && p.dateKey < from) return;
    if(to && p.dateKey > to) return;
    allDates.add(p.dateKey);
  });

  const sortedDates = Array.from(allDates).sort();
  emps.forEach(emp => {
    sortedDates.forEach(dateKey => {
      const rec = DB.daily.find(d =>
        d.empId === emp.id && d.dateKey === dateKey && d.branchId === branchId
      ) || null;
      const punches = DB.punches.filter(p =>
        p.empId === emp.id && p.dateKey === dateKey && p.branchId === branchId
      );
      const cmp = compareDayFull(emp, dateKey, rec, punches);
      if(cmp.level === 'missing' && !rec && !punches.length) return;
      rows.push(cmp);
    });
  });

  return rows.sort((a,b) => {
    if(a.dateKey !== b.dateKey) return b.dateKey.localeCompare(a.dateKey);
    return a.empName.localeCompare(b.empName,'ar');
  });
}

function buildSummaryRows(rows){
  const map = {};
  rows.forEach(r => {
    if(!map[r.empId]){
      map[r.empId] = {
        empId: r.empId, empName: r.empName, empCode: r.empCode,
        days: 0, match: 0, warn: 0, error: 0,
        totalBranchNet: 0, totalPunch: 0, totalPermMins: 0
      };
    }
    const m = map[r.empId];
    m.days++;
    if(r.level === 'match') m.match++;
    else if(r.level === 'warn') m.warn++;
    else if(r.level === 'error') m.error++;
    if(r.branchNetMins !== null) m.totalBranchNet += r.branchNetMins;
    if(r.punchMins !== null) m.totalPunch += r.punchMins;
    if(r.branchPermType === 'hour') m.totalPermMins += Math.round(r.branchPermHours*60);
    else if(r.branchPermType === 'day' && r.branchRawMins) m.totalPermMins += r.branchRawMins;
  });
  return Object.values(map).sort((a,b) => a.empName.localeCompare(b.empName,'ar'));
}

function buildComparisonByEmployee(rows){
  const map = {};
  rows.forEach(r => {
    if(!map[r.empId]){
      map[r.empId] = {
        empId: r.empId, empName: r.empName, empCode: r.empCode,
        days: [],
        totals: { days:0, match:0, warn:0, error:0, branchNetTotal:0, punchTotal:0, permTotal:0 }
      };
    }
    const m = map[r.empId];
    m.days.push(r);
    m.totals.days++;
    if(r.level === 'match') m.totals.match++;
    else if(r.level === 'warn') m.totals.warn++;
    else if(r.level === 'error') m.totals.error++;
    if(r.branchNetMins !== null) m.totals.branchNetTotal += r.branchNetMins;
    if(r.punchMins !== null)     m.totals.punchTotal    += r.punchMins;
    if(r.branchPermType === 'hour') m.totals.permTotal += Math.round(r.branchPermHours*60);
    else if(r.branchPermType === 'day' && r.branchRawMins) m.totals.permTotal += r.branchRawMins;
  });
  Object.values(map).forEach(m => {
    m.days.sort((a,b) => a.dateKey.localeCompare(b.dateKey));
  });
  return Object.values(map).sort((a,b) => a.empName.localeCompare(b.empName,'ar'));
}

function printComparison(empId){
  if(!lastComparison || !lastComparison.rows.length){
    alert('اعرض المقارنة أولاً');
    return;
  }
  const needSwitch = (UI.cmpTab !== 'detailed') || (empId && (UI.cmpFilter || 'all') !== 'all');
  if(needSwitch){
    UI.cmpTab = 'detailed';
    if(empId) UI.cmpFilter = 'all';
    renderPage();
    setTimeout(() => printComparison(empId), 400);
    return;
  }
  if(empId){
    document.querySelectorAll('.cmp-emp-card').forEach(c => c.classList.remove('cmp-print-target'));
    const target = document.querySelector(`.cmp-emp-card[data-cmp-emp="${empId}"]`);
    if(!target){ alert('لم يتم العثور على بيانات الموظف'); return; }
    target.classList.add('cmp-print-target');
    document.body.classList.add('cmp-printing-single');
    const cleanup = () => {
      document.body.classList.remove('cmp-printing-single');
      target.classList.remove('cmp-print-target');
      window.removeEventListener('afterprint', cleanup);
    };
    window.addEventListener('afterprint', cleanup);
    setTimeout(() => { window.print(); setTimeout(cleanup, 500); }, 100);
  } else {
    window.print();
  }
}

      content = `
        <div class="card no-print">
          <div class="card-header">
            <div>
              <div class="card-title">📋 التفصيل اليومي — حسب الموظف</div>
              <div class="card-subtitle">${arNum(byEmp.length)} موظف — ${arNum(filtered.length)} من ${arNum(rows.length)} صف</div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button class="btn btn-outline btn-sm" onclick="setCmpFilter('all')" ${filter === 'all' ? 'disabled' : ''}>الكل</button>
              <button class="btn btn-outline btn-sm" onclick="setCmpFilter('issues')" ${filter === 'issues' ? 'disabled' : ''}>الفروقات</button>
              <button class="btn btn-outline btn-sm" onclick="setCmpFilter('error')" ${filter === 'error' ? 'disabled' : ''}>التناقضات</button>
              <button class="btn btn-outline btn-sm" onclick="setCmpFilter('match')" ${filter === 'match' ? 'disabled' : ''}>المطابق</button>

    } else {
      const sumRows = buildSummaryRows(rows);

}

function setCmpFilter(f){ UI.cmpFilter = f; renderPage(); }
function setCmpTab(t){ UI.cmpTab = t; renderPage(); }

function generateComparison(){
  const bId = $('cmpBranch').value;
  const from = $('cmpFrom').value;
  const to = $('cmpTo').value;
  if(!bId){ alert('اختر الفرع'); return; }
  UI.cmpBranch = bId; UI.cmpFrom = from; UI.cmpTo = to;
  UI.cmpTab = UI.cmpTab || 'detailed';
  UI.cmpFilter = UI.cmpFilter || 'all';
  showLoader(true);
  try {
    const rows = buildComparisonRows(bId, from, to);
    const summary = { total: rows.length, match: 0, warn: 0, error: 0, missing: 0 };
    rows.forEach(r => {
      if(r.level === 'match') summary.match++;
      else if(r.level === 'warn') summary.warn++;
      else if(r.level === 'error') summary.error++;
      else summary.missing++;
    });
    lastComparison = { rows, summary, branchId: bId, from, to };
    renderPage();
  } finally { showLoader(false); }
}

function exportComparison(){
  if(!lastComparison || !lastComparison.rows.length){ alert('لا يوجد تقرير'); return; }
  const { rows, branchId } = lastComparison;
  const wb = XLSX.utils.book_new();
  const detailed = rows.map(r => ({
    'رقم البصمة': r.empCode,
    'الاسم': r.empName,
    'التاريخ': r.dateKey,
    'اليوم': r.day,
    'فرع — دخول': r.branchIn || '',
    'فرع — خروج': r.branchOut || '',
    'فرع — إذن': r.branchPermType === 'hour' ? `${r.branchPermHours} س` : r.branchPermType === 'day' ? 'يوم' : '',
    'فرع — صافي (دقيقة)': r.branchNetMins ?? '',
    'بصمة — دخول': r.punchIn || '',
    'بصمة — خروج': r.punchOut || '',
    'بصمة — ساعات (دقيقة)': r.punchMins ?? '',
    'الفرق (دقيقة)': r.netDiff ?? '',
    'النتيجة': r.level === 'match' ? 'مطابق' : r.level === 'warn' ? 'فرق' : r.level === 'error' ? 'تناقض' : 'غير مكتمل',
    'الملاحظات': r.issues.join(' | ')
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detailed), 'تفصيلي');
  const summary = buildSummaryRows(rows).map(m => ({
    'رقم البصمة': m.empCode,
    'الاسم': m.empName,
    'أيام': m.days,
    'مطابق': m.match,
    'فروقات': m.warn,
    'تناقضات': m.error,
    'صافي ساعات الفرع (دقيقة)': m.totalBranchNet,
    'ساعات البصمة (دقيقة)': m.totalPunch,
    'الفرق (دقيقة)': m.totalBranchNet - m.totalPunch
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), 'ملخص');
  XLSX.writeFile(wb, `مقارنة_${branchName(branchId)}_${today()}.xlsx`);
}

async function backupSystem(){
  showLoader(true);
  try {
    const backup = {
      version: '1.0',
      app: 'attendance-system',
      exportedAt: Date.now(),
      exportedBy: currentUser.name,
      counts: {
        branches: DB.branches.length, users: DB.users.length, shifts: DB.shifts.length,
        employees: DB.employees.length, punches: DB.punches.length, daily: DB.daily.length
      },
      data: {
        branches: DB.branches, users: DB.users, shifts: DB.shifts,
        employees: DB.employees, punches: DB.punches, daily: DB.daily,
        settings: DB.settings || {}
      }
    };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const now = new Date();
    const ts = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
    a.href = url;
    a.download = `backup_${ts}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch(e){ alert('خطأ في النسخ الاحتياطي: ' + e.message); }
  finally { showLoader(false); }
}

async function restoreSystem(ev){
  const file = ev.target.files[0];
  if(!file){ return; }
  const hasPass = !!DB.settings?.maintenancePasswordHash;
  if(hasPass){
    const pass1 = prompt('🔑 أدخل كلمة مرور الصيانة لتأكيد الاسترجاع:');
    if(!pass1){ ev.target.value = ''; return; }
    const passHash = await hash(pass1);
    if(passHash !== DB.settings.maintenancePasswordHash){
      alert('❌ كلمة المرور غير صحيحة');
      ev.target.value = '';
      return;
    }
  }
  if(!confirm('⚠️ سيتم حذف كل البيانات الحالية واستبدالها بالنسخة الاحتياطية.\n\nهل أنت متأكد؟')){
    ev.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = async e => {
    showLoader(true);
    try {
      const backup = JSON.parse(e.target.result);
      if(!backup.data || backup.app !== 'attendance-system'){
        alert('❌ ملف النسخة الاحتياطية غير صالح');
        return;
      }
      await fsBatchDel('branches', () => true);
      await fsBatchDel('users', () => true);
      await fsBatchDel('shifts', () => true);
      await fsBatchDel('employees', () => true);
      await fsBatchDel('punches', () => true);
      await fsBatchDel('daily', () => true);
      await fsBatchDel('settings', () => true);
      if(backup.data.branches?.length)  await fsRestore('branches',  backup.data.branches);
      if(backup.data.users?.length)     await fsRestore('users',     backup.data.users);
      if(backup.data.shifts?.length)    await fsRestore('shifts',    backup.data.shifts);
      if(backup.data.employees?.length) await fsRestore('employees', backup.data.employees);
      if(backup.data.punches?.length)   await fsRestore('punches',   backup.data.punches);
      if(backup.data.daily?.length)     await fsRestore('daily',     backup.data.daily);
      if(backup.data.settings && Object.keys(backup.data.settings).length){
        const { id, ...rest } = backup.data.settings;
        await fsAdd('settings', rest);
      }
      await loadAll();
      alert(`✅ تم الاسترجاع بنجاح`);
      renderPage();
    } catch(err){ alert('❌ خطأ: ' + err.message); }
    finally { showLoader(false); ev.target.value = ''; }
  };
  reader.readAsText(file);
}

async function saveMaintenanceSettings(updates){
  showLoader(true);
  try {
    if(DB.settingsId){
      await fsUpd('settings', DB.settingsId, updates);
      Object.assign(DB.settings, updates);
    } else {
      const rec = await fsAdd('settings', { maintenance: false, ...updates });
      DB.settings = rec;
      DB.settingsId = rec.id;
    }
  } finally { showLoader(false); }
}

async function toggleMaintenance(){
  const m = DB.settings?.maintenance || false;
  const hasPass = !!DB.settings?.maintenancePasswordHash;
  if(!hasPass){
    const p1 = prompt('🔑 يجب تعيين كلمة مرور للصيانة أولاً.\n\nاكتب كلمة المرور (٤ أحرف على الأقل):');
    if(!p1 || p1.length < 4){ alert('كلمة المرور قصيرة جداً'); return; }
    const p2 = prompt('🔑 أعد كتابة كلمة المرور للتأكيد:');
    if(p2 !== p1){ alert('❌ كلمتا المرور غير متطابقتين'); return; }
    const ph = await hash(p1);
    await saveMaintenanceSettings({ maintenancePasswordHash: ph });
    alert('✅ تم تعيين كلمة المرور. اضغط زر التفعيل مرة أخرى لتفعيل الصيانة.');
    renderPage();
    return;
  }
  const action = m ? 'إيقاف' : 'تفعيل';
  const p = prompt(`🔑 أدخل كلمة مرور الصيانة لـ${action} الصيانة:`);
  if(!p) return;
  const ph = await hash(p);
  if(ph !== DB.settings.maintenancePasswordHash){
    alert('❌ كلمة المرور غير صحيحة');
    return;
  }
  const newState = !m;
  await saveMaintenanceSettings({ maintenance: newState });
  alert(newState ? '🔴 تم تفعيل الصيانة' : '🟢 تم إيقاف الصيانة');
  renderPage();
}

async function changeMaintenancePassword(){
  const oldPass = prompt('🔑 أدخل كلمة المرور الحالية:');
  if(!oldPass) return;
  const oldHash = await hash(oldPass);
  if(oldHash !== DB.settings.maintenancePasswordHash){
    alert('❌ كلمة المرور غير صحيحة');
    return;
  }
  const p1 = prompt('🔑 كلمة المرور الجديدة (٤ أحرف على الأقل):');
  if(!p1 || p1.length < 4){ alert('كلمة المرور قصيرة جداً'); return; }
  const p2 = prompt('🔑 أعد كتابة كلمة المرور الجديدة:');
  if(p2 !== p1){ alert('❌ كلمتا المرور غير متطابقتين'); return; }
  const newHash = await hash(p1);
  await saveMaintenanceSettings({ maintenancePasswordHash: newHash });
  alert('✅ تم تغيير كلمة المرور');
}

(async function init(){
  showLoader(true);
  try {
    await checkSetup();
    updatePrintBranding();
    const uid = sessionStorage.getItem('uid');
    if(uid){
      const users = await fsAll('users');
      const u = users.find(x => x.id === uid);
      if(u){
        const stArr = await fsAll('settings');
        const st = stArr.length ? stArr[0] : {};
        if(st.maintenance && u.role !== 'admin'){
          sessionStorage.removeItem('uid');
          $('loginPage').style.display = 'flex';
          $('app').style.display = 'none';
          const err = $('loginErr');
          err.textContent = '🔧 النظام تحت الصيانة حالياً';
          err.style.display = 'block';
        } else {
          currentUser = u; await loadAll(); enterApp();
        }
      }
    }
    ['loginUser','loginPass','loginName'].forEach(id => {
      const el = $(id);
      if(el) el.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
    });
  } catch(e){
    console.error('init failed:', e);
    $('loginPage').style.display = 'flex';
    $('app').style.display = 'none';
    const err = $('loginErr');
    err.textContent = '⚠️ خطأ في التهيئة: ' + (e?.message || e);
    err.style.display = 'block';
    $('loginHint').textContent = 'افتح Console (F12) للتفاصيل';
  } finally { showLoader(false); }
})();
