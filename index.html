<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام البصمة</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,sans-serif;background:#eef2f7;margin:0;color:#22303f}
  .topbar{background:linear-gradient(135deg,#1a365d,#2b6cb0);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  .brand{font-size:17px;font-weight:bold}
  .userbox{display:flex;align-items:center;gap:12px;font-size:13px}
  .container{max-width:1400px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:16px}
  h2{font-size:18px;color:#1a365d;margin:0 0 12px}
  h3{font-size:15px;color:#2b6cb0;margin:0 0 10px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .tab{background:#fff;border:1px solid #cbd5e0;color:#2c5282;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600}
  .tab.active{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
  .btn{background:#2b6cb0;color:#fff;border:none;padding:8px 16px;border-radius:7px;font-size:13.5px;cursor:pointer;font-weight:bold}
  .btn:hover{filter:brightness(1.1)}
  .btn-success{background:#38a169}
  .btn-warn{background:#dd6b20}
  .btn-danger{background:#e53e3e}
  .btn-ghost{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4)}
  .btn-sm{padding:4px 10px;font-size:11.5px;border-radius:5px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;font-weight:bold;color:#2c5282}
  input,select,textarea{padding:7px 10px;border:1px solid #cbd5e0;border-radius:6px;font-size:13px;font-family:inherit;background:#fff}
  input:focus,select:focus{outline:none;border-color:#4299e1}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
  th,td{border:1px solid #e2e8f0;padding:7px;text-align:center;vertical-align:middle}
  th{background:#2b6cb0;color:#fff;font-weight:600;font-size:12px}
  tbody tr:nth-child(even){background:#f7fafc}
  tbody tr:hover{background:#ebf8ff}
  .badge{padding:2px 8px;border-radius:5px;font-weight:bold;font-size:11px;display:inline-block}
  .b-green{background:#c6f6d5;color:#22543d}
  .b-red{background:#fed7d7;color:#9b2c2c}
  .b-orange{background:#feebc8;color:#c05621}
  .b-blue{background:#bee3f8;color:#2c5282}
  .b-gray{background:#e2e8f0;color:#4a5568}
  .b-purple{background:#e9d8fd;color:#553c9a}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .stat-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px}
  .stat-card h3{font-size:13.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #e2e8f0}
  .stat-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:#4a5568}
  .stat-row b{color:#1a365d}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a365d,#2b6cb0);padding:20px}
  .login-card{background:#fff;padding:32px;border-radius:16px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .login-card h1{text-align:center;color:#1a365d;font-size:21px;margin:0 0 22px}
  .login-card input{width:100%;margin-bottom:12px;padding:11px}
  .login-card .btn{width:100%;padding:12px;font-size:15px}
  .hint{text-align:center;font-size:11.5px;color:#718096;margin-top:12px;background:#f7fafc;padding:8px;border-radius:6px}
  .alert{padding:10px;border-radius:7px;margin-bottom:12px;font-weight:bold;font-size:13px;text-align:center}
  .alert-err{background:#fff5f5;color:#c53030;border:1px solid #fed7d7}
  .alert-ok{background:#f0fff4;color:#22543d;border:1px solid #c6f6d5}
  .alert-info{background:#ebf8ff;color:#2c5282;border:1px solid #bee3f8}
  .muted{color:#718096;font-size:12px}
  .empty{text-align:center;color:#a0aec0;padding:30px;font-size:13.5px}
  .scroll-x{overflow-x:auto}
  .loader{text-align:center;padding:40px;color:#2b6cb0;font-size:15px;font-weight:bold;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.95);padding:20px 40px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:2000}
  .daily-table input[type="time"],
  .daily-table input[type="text"],
  .daily-table input[type="number"]{padding:5px 6px;font-size:12px;width:100%}
  .daily-table select{padding:5px 6px;font-size:12px}
  .date-nav{display:flex;gap:4px;margin-top:4px}
  .date-nav button{padding:6px 10px;font-size:12px;border:1px solid #cbd5e0;background:#fff;border-radius:5px;cursor:pointer;font-weight:bold;color:#2c5282}
  .date-nav button.active{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
  .row-saving{background:#fffbeb !important}
  .row-saved{background:#f0fff4 !important;transition:background .3s}
  .branch-header{background:linear-gradient(135deg,#1a365d,#2b6cb0);color:#fff;padding:16px;margin-top:20px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .mini-dash{background:#fff;border-radius:10px;padding:10px 16px;margin-bottom:14px;display:flex;gap:18px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.04);font-size:13px;align-items:center;border:1px solid #e2e8f0}
  .mini-dash span{display:flex;align-items:center;gap:5px}
  .mini-dash b{color:#1a365d;font-size:14px}
  @media(max-width:700px){
    .row{flex-direction:column;align-items:stretch}
    .field{width:100%}
    input,select{width:100%}
    .container{padding:10px}
  }
</style>
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-card">
    <h1 id="loginTitle">⏱️ نظام البصمة</h1>
    <div id="setupNote" style="display:none" class="alert alert-info">🎉 أول تشغيل — أنشئ حساب المدير</div>
    <input id="loginUser" placeholder="اسم المستخدم">
    <input id="loginPass" type="password" placeholder="كلمة المرور">
    <input id="loginName" placeholder="الاسم الكامل" style="display:none">
    <button class="btn" id="loginBtn" onclick="doLogin()">🔐 دخول</button>
    <div id="loginErr" class="alert alert-err" style="display:none;margin-top:14px"></div>
  </div>
</div>

<div id="appView" style="display:none">
  <div class="topbar">
    <div class="brand">⏱️ نظام البصمة</div>
    <div class="userbox">
      <span id="userInfo"></span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">🚪 خروج</button>
    </div>
  </div>
  <div class="container">
    <div id="miniDash" class="mini-dash" style="display:none"></div>
    <div class="tabs" id="tabsNav"></div>
    <div id="tabContent"></div>
  </div>
</div>

<div id="globalLoader" class="loader" style="display:none">⏳ جاري التحميل...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getFirestore, collection, doc, getDocs,
  addDoc, updateDoc, deleteDoc, writeBatch, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBla94ZCx9oaTMm1-tmehyVx-Pyn-_zz3g",
  authDomain: "attendance-system-403c3.firebaseapp.com",
  projectId: "attendance-system-403c3",
  storageBucket: "attendance-system-403c3.firebasestorage.app",
  messagingSenderId: "241577979833",
  appId: "1:241577979833:web:af35ec638772254e95d068"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let DB = { branches:[], users:[], shifts:[], employees:[], punches:[], daily:[] };
let currentUser = null;
let activeTab = 'overview';
let UI = {
  dailyBranch:'', dailyDate: new Date().toISOString().slice(0,10),
  repBranch:'', repFrom:'', repTo:'', repView:'detailed',
  empBranch:'all', shiftBranch:'all'
};
let lastReport = null;
let listeners = [];

const dayNamesAr = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const STATUS = { present:'حاضر', absent:'غائب', leave:'أجازة', mission:'مهمة' };
const PERM_TYPES = { none:'لا', hour:'إذن ساعات', day:'إذن يوم كامل' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s==null?'':s).trim().toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,''); }
function showLoader(s){ document.getElementById('globalLoader').style.display = s ? 'block' : 'none'; }
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }

async function hashPass(p){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
function formatMins(m){
  m = Math.round(m || 0);
  const abs = Math.abs(m);
  if(abs === 0) return '0 دقيقة';
  const h = Math.floor(abs/60), mn = abs%60;
  let t = h > 0 && mn > 0 ? `${h}س ${mn}د` : (h > 0 ? `${h} ساعة` : `${mn} دقيقة`);
  return m < 0 ? `-${t}` : t;
}
function dtAt(dateKey, timeStr){
  const [y,m,d] = dateKey.split('-').map(Number);
  const [hh,mm] = String(timeStr||'00:00').split(':').map(Number);
  return new Date(y, m-1, d, hh||0, mm||0, 0, 0);
}
function dayName(dateKey){ return dayNamesAr[new Date(dateKey+'T00:00:00').getDay()]; }
function fmtHM(ms){ const d = new Date(ms); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtTimeAr(ms){ return new Date(ms).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',hour12:true}); }
function parseExcelDate(str){
  if(!str) return null;
  let s = String(str).trim();
  const isPM = s.includes('م') || s.toUpperCase().includes('PM');
  const isAM = s.includes('ص') || s.toUpperCase().includes('AM');
  s = s.replace(/[صم]/g,'').trim();
  const parts = s.split(/\s+/);
  if(parts.length >= 2){
    const dp = parts[0].split(/[\/\-\.]/);
    const tp = parts[1].split(':');
    if(dp.length === 3 && tp.length >= 2){
      let day = parseInt(dp[0],10), month = parseInt(dp[1],10)-1, year = parseInt(dp[2],10);
      if(year < 100) year += 2000;
      let hour = parseInt(tp[0],10), minute = parseInt(tp[1],10), sec = tp[2]?parseInt(tp[2],10):0;
      if(isPM && hour < 12) hour += 12;
      else if(isAM && hour === 12) hour = 0;
      const d = new Date(year, month, day, hour, minute, sec);
      if(!isNaN(d.getTime())) return d;
    }
  }
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function getBranch(id){ return DB.branches.find(b => b.id === id); }
function branchName(id){ const b = getBranch(id); return b ? b.name : '—'; }
function getShift(id){ return DB.shifts.find(s => s.id === id); }

async function fsAll(name){
  const snap = await getDocs(collection(db, name));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function fsAdd(name, data){
  const ref = await addDoc(collection(db, name), data);
  return { id: ref.id, ...data };
}
async function fsUpd(name, id, data){ await updateDoc(doc(db, name, id), data); }
async function fsDel(name, id){ await deleteDoc(doc(db, name, id)); }
async function fsBatchDel(name, fn){
  const snap = await getDocs(collection(db, name));
  const batch = writeBatch(db);
  let c = 0;
  snap.docs.forEach(d => { if(fn({id:d.id, ...d.data()})){ batch.delete(d.ref); c++; } });
  if(c) await batch.commit();
}
async function fsBatchAdd(name, items){
  const CH = 400;
  for(let i=0; i<items.length; i+=CH){
    const batch = writeBatch(db);
    items.slice(i, i+CH).forEach(it => {
      batch.set(doc(collection(db, name)), it);
    });
    await batch.commit();
  }
}

async function loadAll(){
  showLoader(true);
  const [br, us, sh, em, pu, dl] = await Promise.all([
    fsAll('branches'), fsAll('users'), fsAll('shifts'),
    fsAll('employees'), fsAll('punches'), fsAll('daily')
  ]);
  DB.branches = br; DB.users = us; DB.shifts = sh;
  DB.employees = em; DB.punches = pu; DB.daily = dl;
  showLoader(false);
}

function startLive(){
  listeners.forEach(u => { try{ u(); }catch(e){} });
  listeners = [];
  listeners.push(onSnapshot(collection(db, 'daily'), snap => {
    DB.daily = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(currentUser && activeTab === 'daily') renderMiniDash();
  }));
  listeners.push(onSnapshot(collection(db, 'punches'), snap => {
    DB.punches = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }));
  listeners.push(onSnapshot(collection(db, 'employees'), snap => {
    DB.employees = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(currentUser && activeTab === 'daily') renderMiniDash();
  }));
}
function stopLive(){ listeners.forEach(u => { try{ u(); }catch(e){} }); listeners = []; }

/* ============ Auth ============ */
async function checkSetup(){
  showLoader(true);
  const users = await fsAll('users');
  showLoader(false);
  const setup = document.getElementById('setupNote');
  const nameF = document.getElementById('loginName');
  const btn = document.getElementById('loginBtn');
  if(users.length === 0){
    setup.style.display = 'block';
    nameF.style.display = 'block';
    btn.textContent = '✨ إنشاء المدير والدخول';
    window.__setup = true;
  } else {
    setup.style.display = 'none';
    nameF.style.display = 'none';
    btn.textContent = '🔐 دخول';
    window.__setup = false;
  }
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('appView').style.display = 'none';
}
async function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  err.style.display = 'none';
  if(!u || !p){ err.style.display='block'; err.textContent='أدخل البيانات'; return; }
  showLoader(true);
  try {
    if(window.__setup){
      const name = document.getElementById('loginName').value.trim() || u;
      const hash = await hashPass(p);
      const user = await fsAdd('users', { username:u, passwordHash:hash, role:'admin', name, branchId:null, createdAt:Date.now() });
      currentUser = user;
      sessionStorage.setItem('uid', user.id);
      await loadAll();
      enterApp();
      return;
    }
    const users = await fsAll('users');
    const hash = await hashPass(p);
    const user = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.passwordHash === hash);
    if(!user){ err.style.display='block'; err.textContent='بيانات غلط'; showLoader(false); return; }
    currentUser = user;
    sessionStorage.setItem('uid', user.id);
    await loadAll();
    enterApp();
  } catch(e){ showLoader(false); err.style.display='block'; err.textContent = e.message; }
}
function doLogout(){
  stopLive();
  currentUser = null;
  sessionStorage.removeItem('uid');
  document.getElementById('appView').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('loginPass').value = '';
  checkSetup();
}
function enterApp(){
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  const role = currentUser.role === 'admin' ? 'مدير النظام' : 'فرع: ' + branchName(currentUser.branchId);
  document.getElementById('userInfo').innerHTML = `👤 <b>${esc(currentUser.name)}</b> — ${esc(role)}`;
  if(currentUser.role === 'admin'){
    if(!['overview','daily','branches','employees','shifts','upload','reports'].includes(activeTab)) activeTab='overview';
  } else {
    activeTab = 'daily';
  }
  startLive();
  renderTab();
}

const TABS_ADMIN = [
  {id:'overview',label:'📊 الرئيسية'},
  {id:'daily',label:'📅 اليومي'},
  {id:'branches',label:'🏢 الفروع'},
  {id:'employees',label:'👥 العمال'},
  {id:'shifts',label:'🕐 الشفتات'},
  {id:'upload',label:'📥 رفع البصمة'},
  {id:'reports',label:'📈 التقارير'}
];
const TABS_BRANCH = [{id:'daily',label:'📅 التسجيل اليومي'}];

function switchTab(id){ activeTab = id; renderTab(); window.scrollTo({top:0,behavior:'smooth'}); }
function renderTab(){
  const tabs = currentUser.role === 'admin' ? TABS_ADMIN : TABS_BRANCH;
  document.getElementById('tabsNav').innerHTML = tabs.map(t =>
    `<button class="tab ${t.id===activeTab?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
  renderMiniDash();
  let html = '';
  switch(activeTab){
    case 'overview':  html = viewOverview(); break;
    case 'daily':     html = viewDaily(); break;
    case 'branches':  html = viewBranches(); break;
    case 'employees': html = viewEmployees(); break;
    case 'shifts':    html = viewShifts(); break;
    case 'upload':    html = viewUpload(); break;
    case 'reports':   html = viewReports(); break;
  }
  document.getElementById('tabContent').innerHTML = html;
  afterRender();
}
function afterRender(){
  ['dailyBranch','repBranch','empBranch','shiftBranch'].forEach(id=>{
    const el = document.getElementById(id);
    if(el && UI[id] !== undefined) el.value = UI[id];
  });
  if(document.getElementById('repFrom')) document.getElementById('repFrom').value = UI.repFrom || '';
  if(document.getElementById('repTo')) document.getElementById('repTo').value = UI.repTo || '';
}
function renderMiniDash(){
  const el = document.getElementById('miniDash');
  const bId = currentUser.role === 'admin' ? UI.dailyBranch : currentUser.branchId;
  if(!bId || !getBranch(bId)){ el.style.display = 'none'; return; }
  el.style.display = 'flex';
  const today = UI.dailyDate;
  const emps = DB.employees.filter(e => e.branchId === bId);
  const entries = DB.daily.filter(d => d.branchId === bId && d.dateKey === today);
  const day = dayNamesAr[new Date(today+'T00:00:00').getDay()];
  el.innerHTML = `
    <span>🏢 <b>${esc(branchName(bId))}</b></span>
    <span>📅 <b>${day} ${today}</b></span>
    <span>👥 <b>${emps.length}</b> عامل</span>
    <span>✅ <b style="color:#38a169">${entries.length}</b> مسجل</span>
    <span>⏳ <b style="color:#dd6b20">${Math.max(0, emps.length - entries.length)}</b> باقي</span>
  `;
}

/* ============ Overview ============ */
function viewOverview(){
  if(DB.branches.length === 0){
    return `<div class="card">
      <div class="alert alert-info">🚀 ابدأ بالخطوات دي:</div>
      <ol style="line-height:2;font-size:14px">
        <li>روح <b>🏢 الفروع</b> → أضف فرع</li>
        <li>روح <b>🕐 الشفتات</b> → أضف شفتات الفرع</li>
        <li>روح <b>👥 العمال</b> → أضف العمال</li>
      </ol>
    </div>`;
  }
  const today = new Date().toISOString().slice(0,10);
  const cards = DB.branches.map(b=>{
    const emps = DB.employees.filter(e=>e.branchId===b.id).length;
    const todayC = DB.daily.filter(d=>d.branchId===b.id && d.dateKey===today).length;
    const punches = DB.punches.filter(p=>p.branchId===b.id).length;
    return `<div class="stat-card">
      <h3>🏢 ${esc(b.name)}</h3>
      <div class="stat-row"><span>👥 العمال</span><b>${emps}</b></div>
      <div class="stat-row"><span>✅ سجلوا اليوم</span><b style="color:${todayC>0?'#38a169':'#a0aec0'}">${todayC}</b></div>
      <div class="stat-row"><span>📥 بصمات</span><b>${punches}</b></div>
    </div>`;
  }).join('');
  return `<div class="card">
    <h2>📊 ملخص الفروع</h2>
    <div class="grid">${cards}</div>
  </div>`;
}

/* ============ Daily - قلب النظام ============ */
function viewDaily(){
  const isAdmin = currentUser.role === 'admin';
  const date = UI.dailyDate;
  if(!isAdmin) UI.dailyBranch = currentUser.branchId;
  const bId = isAdmin ? UI.dailyBranch : currentUser.branchId;

  const today = new Date().toISOString().slice(0,10);
  const y = new Date(); y.setDate(y.getDate()-1);
  const yest = y.toISOString().slice(0,10);
  const t = new Date(); t.setDate(t.getDate()+1);
  const tom = t.toISOString().slice(0,10);

  const branchField = isAdmin
    ? `<div class="field"><label>الفرع</label>
        <select id="dailyBranch" onchange="UI.dailyBranch=this.value;renderTab()">
          <option value="">— اختر —</option>
          ${DB.branches.map(b=>`<option value="${b.id}" ${UI.dailyBranch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
        </select></div>` : '';

  const dateField = `<div class="field"><label>التاريخ</label>

  let saved = 0;
  const rows = emps.map(e=>{
    const rec = dailyMap[e.id] || {};

    const shiftId = rec.shiftId || e.shiftId || defaultShift || '';
    const status = rec.status || 'present';
    const permType = rec.permType || 'none';

      <td>
        <select class="f-ptype" onchange="saveRow('${e.id}');toggleHours('${e.id}')">
          ${Object.keys(PERM_TYPES).map(k=>`<option value="${k}" ${permType===k?'selected':''}>${PERM_TYPES[k]}</option>`).join('')}
        </select>
      </td>
      <td>
        <input type="number" class="f-phours" min="0" max="24" step="0.5" placeholder="0"
          value="${permHours}" onchange="saveRow('${e.id}')"

      </td>
      <td><input type="text" class="f-notes" value="${esc(notes)}" placeholder="ملاحظات" style="min-width:110px" onchange="saveRow('${e.id}')"></td>
    </tr>`;
  }).join('');

  return `<div class="card">
    <h2>📅 التسجيل اليومي ${isAdmin ? '(أدمن)' : ''}</h2>
    <div class="row">${branchField}${dateField}

      <button class="btn" onclick="copyYesterday('${bId}','${date}')">📋 نسخ من الأمس</button>

      💡 اختار <b>الشفت</b> من القائمة + <b>الحالة</b>. لو فيه إذن، اختار <b>إذن ساعات</b> واكتب العدد.
      ${saved ? `<br>📌 <b>${saved}</b> عامل مسجل.` : ''}
    </div>
    ${emps.length ? `<div class="scroll-x daily-table"><table>
      <thead><tr>

        <th>الخروج</th>

    </table></div>` : '<div class="empty">لا يوجد عمال. الأدمن لازم يضيفهم أولاً.</div>'}

}

function toggleHours(empId){
  const tr = document.querySelector(`tr[data-empid="${empId}"]`);
  if(!tr) return;
  const t = tr.querySelector('.f-ptype').value;
  const h = tr.querySelector('.f-phours');
  h.style.display = t === 'hour' ? 'block' : 'none';
  if(t !== 'hour') h.value = '';
}

function saveRow(empId){
  const tr = document.querySelector(`tr[data-empid="${empId}"]`);
  if(!tr) return;
  tr.classList.add('row-saving');
  clearTimeout(tr.__timer);
  tr.__timer = setTimeout(async () => {
    await persistRow(tr, empId);
    tr.classList.remove('row-saving');
    tr.classList.add('row-saved');
    setTimeout(() => tr.classList.remove('row-saved'), 1200);
    renderMiniDash();
  }, 400);
}

async function persistRow(tr, empId){
  const bId = tr.dataset.branch;
  const date = tr.dataset.date;
  const shiftId = tr.querySelector('.f-shift').value;
  const timeIn = tr.querySelector('.f-in').value;
  const timeOut = tr.querySelector('.f-out').value;
  const status = tr.querySelector('.f-status').value;
  const permType = tr.querySelector('.f-ptype').value;
  const permHours = num(tr.querySelector('.f-phours').value);
  const notes = tr.querySelector('.f-notes').value.trim();

  const emp = DB.employees.find(e => e.id === empId);
  const defaultShift = emp?.shiftId || getBranch(bId)?.defaultShiftId || '';
  const isEmpty = !timeIn && !timeOut && !notes && status === 'present'
    && permType === 'none' && !permHours && shiftId === defaultShift;

  const existing = DB.daily.find(d => d.branchId===bId && d.dateKey===date && d.empId===empId);

  try {
    if(isEmpty && existing){
      await fsDel('daily', existing.id);
      DB.daily = DB.daily.filter(d => d.id !== existing.id);
    } else if(!isEmpty && existing){
      const data = { shiftId, timeIn, timeOut, status, permType, permHours, notes,
        updatedBy: currentUser.name, updatedAt: Date.now() };
      await fsUpd('daily', existing.id, data);
      Object.assign(existing, data);
    } else if(!isEmpty){
      const rec = await fsAdd('daily', {
        branchId: bId, dateKey: date, empId, shiftId, timeIn, timeOut,
        status, permType, permHours, notes,
        updatedBy: currentUser.name, updatedAt: Date.now()
      });
      DB.daily.push(rec);
    }
  } catch(e){ console.error(e); }
}

async function saveAll(bId, date){
  const rows = document.querySelectorAll('tr[data-empid]');
  if(!rows.length){ alert('لا يوجد عمال'); return; }
  showLoader(true);
  try {
    rows.forEach(tr => clearTimeout(tr.__timer));
    const old = DB.daily.filter(d => d.branchId===bId && d.dateKey===date);
    for(const d of old) await fsDel('daily', d.id);

    let count = 0;
    for(const tr of rows){
      const empId = tr.dataset.empid;
      const shiftId = tr.querySelector('.f-shift').value;
      const timeIn = tr.querySelector('.f-in').value;
      const timeOut = tr.querySelector('.f-out').value;
      const status = tr.querySelector('.f-status').value;
      const permType = tr.querySelector('.f-ptype').value;
      const permHours = num(tr.querySelector('.f-phours').value);
      const notes = tr.querySelector('.f-notes').value.trim();
      const emp = DB.employees.find(e => e.id === empId);
      const defaultShift = emp?.shiftId || getBranch(bId)?.defaultShiftId || '';
      const isEmpty = !timeIn && !timeOut && !notes && status === 'present'
        && permType === 'none' && !permHours && shiftId === defaultShift;
      if(isEmpty) continue;
      await fsAdd('daily', {
        branchId: bId, dateKey: date, empId, shiftId, timeIn, timeOut,
        status, permType, permHours, notes,
        updatedBy: currentUser.name, updatedAt: Date.now()
      });
      count++;
    }
    await loadAll();
    showLoader(false);
    alert('✅ تم حفظ ' + count + ' عامل');
    renderTab();
  } catch(e){ showLoader(false); alert('خطأ: ' + e.message); }
}

async function copyYesterday(bId, date){
  const y = new Date(date+'T00:00:00');
  y.setDate(y.getDate()-1);
  const yKey = y.toISOString().slice(0,10);
  const prev = DB.daily.filter(d => d.branchId===bId && d.dateKey===yKey);
  if(!prev.length){ alert('لا توجد بيانات في ' + yKey); return; }
  if(!confirm(`نسخ ${prev.length} سجل من ${yKey}؟`)) return;

  for(const p of prev){
    const tr = document.querySelector(`tr[data-empid="${p.empId}"]`);
    if(!tr) continue;
    if(p.shiftId) tr.querySelector('.f-shift').value = p.shiftId;
    if(p.status) tr.querySelector('.f-status').value = p.status;
    if(p.permType) tr.querySelector('.f-ptype').value = p.permType;
    if(p.permHours) tr.querySelector('.f-phours').value = p.permHours;
    if(p.notes) tr.querySelector('.f-notes').value = p.notes;
    toggleHours(p.empId);
  }
  alert('✅ تم النسخ — اضغط حفظ الكل');
}

async function importEmp(ev){
  const file = ev.target.files[0]; if(!file) return;
  const bId = document.getElementById('impEmpBranch').value;
  if(!bId){ alert('اختر الفرع'); ev.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = async e => {
    showLoader(true);
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', codepage:1256});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {raw:false});
      if(!rows.length){ showLoader(false); alert('الملف فاضي'); return; }
      const keys = Object.keys(rows[0]);
      const nameKey = keys.find(k => /name|الاسم|اسم/i.test(k));
      const codeKey = keys.find(k => /no\.?|code|id|كود|رقم/i.test(k));
      if(!nameKey || !codeKey){ showLoader(false); alert('محتاج عمودين: اسم + كود'); return; }
      const existing = DB.employees.filter(e => e.branchId === bId);
      const items = []; let skip = 0, dup = 0;
      rows.forEach(r => {
        const name = String(r[nameKey]||'').trim();
        const code = String(r[codeKey]||'').trim();
        if(!name || !code){ skip++; return; }
        if(existing.some(e => norm(e.code) === norm(code)) || items.some(i => norm(i.code) === norm(code))){ dup++; return; }
        items.push({ branchId:bId, name, code, shiftId:'', createdAt:Date.now() });
      });
      if(items.length) await fsBatchAdd('employees', items);
      await loadAll();
      showLoader(false);
      alert(`✅ ${items.length} عامل | مكرر ${dup} | ناقص ${skip}`);
      renderTab();
    } catch(err){ showLoader(false); alert(err.message); }
    ev.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function autoH(){
  const s = document.getElementById('shStart').value;
  const e = document.getElementById('shEnd').value;
  if(!s || !e) return;
  const [sh,sm] = s.split(':').map(Number);
  const [eh,em] = e.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins <= 0) mins += 1440;
  document.getElementById('shHours').value = (mins/60).toFixed(1).replace(/\.0$/,'');
}
async function addShift(){
  const bId = document.getElementById('shBAdd').value;
  const name = document.getElementById('shName').value.trim();
  const start = document.getElementById('shStart').value;
  const end = document.getElementById('shEnd').value;
  const hours = num(document.getElementById('shHours').value) || 8;
  const graceMins = num(document.getElementById('shGrace').value);
  const offDays = Array.from(document.querySelectorAll('.shOff:checked')).map(c=>+c.value);
  if(!bId || !name){ alert('أكمل'); return; }
  const sh = await fsAdd('shifts', { branchId:bId, name, start, end, hours, graceMins, offDays, createdAt:Date.now() });
  const br = getBranch(bId);
  if(br && !br.defaultShiftId) await fsUpd('branches', bId, { defaultShiftId: sh.id });
  await loadAll(); renderTab();
}
async function delShift(id){
  if(!confirm('حذف؟')) return;
  await fsDel('shifts', id);
  DB.employees.filter(e => e.shiftId === id).forEach(async e => {
    await fsUpd('employees', e.id, { shiftId: '' });
  });
  DB.branches.filter(b => b.defaultShiftId === id).forEach(async b => {
    await fsUpd('branches', b.id, { defaultShiftId: '' });
  });
  await loadAll(); renderTab();
}

function viewUpload(){

    <div class="row">

        <select id="upBranch"><option value="">— اختر —</option>${branchOpts}</select>
      </div>

        <label style="display:flex;align-items:center;gap:6px;padding:7px 0">
          <input type="checkbox" id="upReplace" checked> نعم
        </label>
      </div>
      <button class="btn btn-success" onclick="document.getElementById('upFile').click()">📁 اختر ملف البصمة</button>
      <input type="file" id="upFile" accept=".xls,.xlsx,.csv" style="display:none" onchange="handleUpload(event)">
    </div>
    <p class="muted">الملف يحتوي على: No. / Name / Date/Time / Status</p>
    <div id="uploadResult"></div>
  </div>`;

async function handleUpload(ev){
  const file = ev.target.files[0]; if(!file) return;
  const bId = document.getElementById('upBranch').value;
  const replace = document.getElementById('upReplace').checked;
  if(!bId){ alert('اختر الفرع'); ev.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = async e => {
    showLoader(true);
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', codepage:1256});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {raw:false});
      const emps = DB.employees.filter(e => e.branchId === bId);
      if(!emps.length){ showLoader(false); alert('لا يوجد عمال في الفرع'); return; }
      if(replace) await fsBatchDel('punches', p => p.branchId === bId);

      const items = []; let matched = 0, skipped = 0;
      rows.forEach(r => {
        const code = String(r['No.'] ?? r['Code'] ?? r['ID'] ?? r['كود'] ?? r['الرقم'] ?? '').trim();
        const name = String(r['Name'] ?? r['الاسم'] ?? '').trim();
        const dtStr = r['Date/Time'] ?? r['DateTime'] ?? r['التاريخ'] ?? r['التاريخ والوقت'];
        const status = String(r['Status'] ?? r['الحالة'] ?? '').trim();
        if(!dtStr){ skipped++; return; }
        const dt = parseExcelDate(dtStr);
        if(!dt){ skipped++; return; }
        const dateKey = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
        let emp = null;
        if(code){
          emp = emps.find(e => norm(e.code) === norm(code) && norm(e.name) === norm(name));
          if(!emp) emp = emps.find(e => norm(e.code) === norm(code));
        }
        if(!emp && name) emp = emps.find(e => norm(e.name) === norm(name));
        if(!emp){ skipped++; return; }
        matched++;
        items.push({ branchId:bId, empId:emp.id, code:emp.code, name:emp.name, dateKey, timeMs:dt.getTime(), status });
      });
      if(items.length) await fsBatchAdd('punches', items);
      await loadAll();
      showLoader(false);
      document.getElementById('uploadResult').innerHTML = `
        <div class="alert alert-ok">
          ✅ تم — مرتبط: <b>${matched}</b> | متجاهل: <b>${skipped}</b>
          <br><small>روح تبويب التقارير لعرض النتيجة</small>
        </div>`;
      ev.target.value = '';
    } catch(err){ showLoader(false); alert(err.message); ev.target.value=''; }
  };
  reader.readAsArrayBuffer(file);
}

/* ============ Reports ============ */
function calcDay(emp, dateKey, dailyRec, punches) {
  const shId = dailyRec?.shiftId || emp.shiftId || getBranch(emp.branchId)?.defaultShiftId;
  const sh = getShift(shId) || { start:'09:00', end:'17:00', hours:8, graceMins:15, offDays:[5], name:'افتراضي' };

  const status = dailyRec?.status || 'present';
  const permType = dailyRec?.permType || 'none';
  const permHours = num(dailyRec?.permHours);

  // إذا أجازة أو غائب
  if(status === 'leave'){
    return { dateKey, status:'أجازة', workMins:0, requiredMins:0, overtime:0, lateness:0, excusedMins:0, notes: dailyRec?.notes };
  }
  if(status === 'absent'){
    return { dateKey, status:'غياب', workMins:0, requiredMins:0, overtime:0, lateness:0, excusedMins:0, notes: dailyRec?.notes };
  }
  if(status === 'mission'){
    return { dateKey, status:'مهمة', workMins:0, requiredMins:0, overtime:0, lateness:0, excusedMins:0, notes: dailyRec?.notes };
  }

  // استخدام الأوقات: الأولوية للفرع، وإلا البصمة
  let timeIn = dailyRec?.timeIn || '';
  let timeOut = dailyRec?.timeOut || '';

  if((!timeIn || !timeOut) && punches.length){
    const sorted = punches.slice().sort((a,b) => a.timeMs - b.timeMs);
    const cin = sorted.find(p => /in/i.test(p.status||'')) || sorted[0];
    const couts = sorted.filter(p => /out/i.test(p.status||''));
    const cout = couts.length ? couts[couts.length-1] : null;
    if(!timeIn && cin) timeIn = fmtHM(cin.timeMs);
    if(!timeOut && cout) timeOut = fmtHM(cout.timeMs);
  }

  if(!timeIn || !timeOut){
    return { dateKey, status:'بصمة ناقصة', workMins:0, requiredMins:0, overtime:0, lateness:0, excusedMins:0, notes: dailyRec?.notes };
  }

  const dtIn = dtAt(dateKey, timeIn);
  let dtOut = dtAt(dateKey, timeOut);
  if(dtOut <= dtIn) dtOut = new Date(dtOut.getTime() + 86400000);

  const workMins = Math.round((dtOut - dtIn) / 60000);
  const shiftMins = Math.round(sh.hours * 60);

  // الإذن بالساعات يخصم من المطلوب
  let excusedMins = 0;
  if(permType === 'hour') excusedMins = Math.round(permHours * 60);
  else if(permType === 'day') excusedMins = shiftMins;

  // التأخير عن بداية الشفت
  const shiftStart = dtAt(dateKey, sh.start);
  let lateRaw = Math.round((dtIn - shiftStart) / 60000);
  if(lateRaw < 0) lateRaw = 0;
  if(lateRaw <= (sh.graceMins||0)) lateRaw = 0;

  const requiredMins = Math.max(0, shiftMins - excusedMins);
  const overtime = workMins - requiredMins;
  const netLateness = Math.max(0, lateRaw - (permType === 'hour' ? Math.round(permHours * 60) : 0));

  let statusLabel = 'منتظم';
  if(netLateness > 0) statusLabel = 'تأخير';
  else if(overtime < -1) statusLabel = 'عجز';

  return { dateKey, status:statusLabel, workMins, requiredMins, overtime, lateness:netLateness, excusedMins, notes: dailyRec?.notes, timeIn, timeOut };
}

function calcEmployee(emp, from, to){
  const days = {};
  DB.daily.forEach(d => {
    if(d.empId !== emp.id) return;
    if(from && d.dateKey < from) return;
    if(to && d.dateKey > to) return;
    days[d.dateKey] = d;
  });
  const punchesByDay = {};
  DB.punches.forEach(p => {
    if(p.empId !== emp.id) return;
    if(from && p.dateKey < from) return;
    if(to && p.dateKey > to) return;
    (punchesByDay[p.dateKey] = punchesByDay[p.dateKey] || []).push(p);
  });
  Object.keys(punchesByDay).forEach(k => { if(!days[k]) days[k] = null; });

  const allDates = Object.keys(days).sort();
  const dayResults = allDates.map(dk => calcDay(emp, dk, days[dk], punchesByDay[dk] || []));

  const totals = { days: dayResults.length, workMins:0, requiredMins:0, overtime:0, lateness:0, excused:0,
    present:0, absent:0, leave:0, mission:0, incomplete:0 };

  dayResults.forEach(d => {
    totals.workMins += d.workMins;
    totals.requiredMins += d.requiredMins;
    totals.overtime += d.overtime;
    totals.lateness += d.lateness;
    totals.excused += d.excusedMins;
    if(d.status === 'غياب') totals.absent++;
    else if(d.status === 'أجازة') totals.leave++;
    else if(d.status === 'مهمة') totals.mission++;
    else if(d.status === 'بصمة ناقصة') totals.incomplete++;
    else totals.present++;
  });

  return { emp, days: dayResults, totals, shift: getShift(emp.shiftId) };
}

function genReport(){
  const bId = document.getElementById('repBranch').value;
  const from = document.getElementById('repFrom').value;
  const to = document.getElementById('repTo').value;
  if(!bId){ alert('اختر الفرع'); return; }
  UI.repBranch = bId; UI.repFrom = from; UI.repTo = to;
  const emps = DB.employees.filter(e => e.branchId === bId);
  const rows = emps.map(e => calcEmployee(e, from, to)).filter(r => r.days.length > 0);
  lastReport = { rows, branchId: bId, from, to };
  renderTab();
}

function exportExcel(){
  if(!lastReport || !lastReport.rows.length){ alert('لا يوجد تقرير'); return; }
  const out = [];
  lastReport.rows.forEach(r => {
    r.days.forEach(d => {
      out.push({
        'الفرع': branchName(r.emp.branchId),
        'الكود': r.emp.code,
        'الاسم': r.emp.name,
        'التاريخ': d.dateKey,
        'اليوم': dayName(d.dateKey),
        'دخول': d.timeIn || '',
        'خروج': d.timeOut || '',
        'ساعات': formatMins(d.workMins),
        'مطلوب': formatMins(d.requiredMins),
        'إذن (دقيقة)': d.excusedMins,
        'تأخير (دقيقة)': d.lateness,
        'إضافي/عجز (دقيقة)': d.overtime,
        'الحالة': d.status
      });
    });
  });
  const ws = XLSX.utils.json_to_sheet(out);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'تقرير');
  XLSX.writeFile(wb, 'تقرير_البصمة.xlsx');
}
