<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام الحضور والانصراف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
--primary:#2563eb;--primary-dark:#1e40af;--primary-light:#dbeafe;
--success:#10b981;--warning:#f59e0b;--danger:#ef4444;
--whatsapp:#25D366;--whatsapp-dark:#128C7E;
--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;
--gray-500:#6b7280;--gray-700:#374151;--gray-900:#111827;
--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
--shadow-md:0 4px 6px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.03);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Tahoma,sans-serif;background:var(--gray-50);color:var(--gray-900);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 50%,#0ea5e9 100%);padding:20px;position:relative;overflow:hidden}
.login-page::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.08) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.06) 0%,transparent 40%)}
.login-card{position:relative;background:#fff;border-radius:20px;padding:44px 38px;width:100%;max-width:420px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.login-logo{text-align:center;font-size:52px;margin-bottom:8px}
.login-title{text-align:center;font-size:24px;font-weight:800;color:var(--gray-900);margin-bottom:6px}
.login-subtitle{text-align:center;font-size:13px;color:var(--gray-500);margin-bottom:28px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12.5px;font-weight:600;color:var(--gray-700);margin-bottom:6px}
.login-field input{width:100%;padding:12px 14px;border:1.5px solid var(--gray-200);border-radius:10px;transition:all .2s;font-size:14px}
.login-field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-light)}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:10px;font-size:15px;font-weight:700;margin-top:8px;transition:all .2s}
.login-btn:hover{transform:translateY(-1px)}
.login-btn:disabled{background:var(--gray-300);cursor:not-allowed;transform:none}
.login-error{background:#fef2f2;color:var(--danger);padding:11px 14px;border-radius:8px;font-size:13px;font-weight:600;margin-top:14px;border:1px solid #fecaca;display:none}
.login-hint{text-align:center;font-size:12px;color:var(--gray-500);margin-top:20px;padding-top:18px;border-top:1px solid var(--gray-100)}
.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:64px 1fr;grid-template-areas:"sidebar header" "sidebar main";height:100vh;overflow:hidden}
@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:64px 1fr;grid-template-areas:"header" "main"}}
.sidebar{grid-area:sidebar;background:#fff;border-left:1px solid var(--gray-200);display:flex;flex-direction:column;padding:20px 0;overflow-y:auto}
@media(max-width:900px){.sidebar{position:fixed;top:64px;right:-280px;width:260px;height:calc(100vh - 64px);z-index:100;transition:right .3s;box-shadow:-4px 0 20px rgba(0,0,0,.1)}.sidebar.open{right:0}}
.sidebar-brand{padding:0 20px 20px;border-bottom:1px solid var(--gray-100);margin-bottom:12px}
.sidebar-brand h1{font-size:17px;font-weight:800;color:var(--gray-900);display:flex;align-items:center;gap:8px}
.sidebar-brand p{font-size:11.5px;color:var(--gray-500);margin-top:2px}
.nav-group{padding:0 12px;margin-bottom:6px}
.nav-label{font-size:10.5px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.5px;padding:10px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--gray-700);cursor:pointer;transition:all .15s;width:100%;text-align:right}
.nav-item:hover{background:var(--gray-100)}
.nav-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:700}
.nav-item .icon{font-size:17px;width:22px;text-align:center}
.sidebar-footer{margin-top:auto;padding:16px 20px 0;border-top:1px solid var(--gray-100);font-size:11.5px;color:var(--gray-500);text-align:center}
.header{grid-area:header;background:#fff;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 24px;gap:16px;justify-content:space-between}
.header-title{font-size:17px;font-weight:700;color:var(--gray-900)}
.header-actions{display:flex;align-items:center;gap:12px}
.user-menu{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:30px;background:var(--gray-50);font-size:13px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.user-name{font-weight:600;color:var(--gray-900)}
.user-role{font-size:11px;color:var(--gray-500)}
.menu-btn{display:none;padding:8px;border-radius:8px;font-size:20px}
@media(max-width:900px){.menu-btn{display:block}}
.logout-btn{padding:7px 14px;background:var(--gray-100);border-radius:8px;font-size:12.5px;font-weight:600;color:var(--gray-700);transition:all .15s}
.logout-btn:hover{background:#fee2e2;color:var(--danger)}
.main{grid-area:main;overflow-y:auto;padding:24px}
@media(max-width:900px){.main{padding:16px}}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--gray-100)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.card-title{font-size:16px;font-weight:700;color:var(--gray-900)}
.card-subtitle{font-size:12.5px;color:var(--gray-500);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{background:var(--gray-300);cursor:not-allowed}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-whatsapp{background:var(--whatsapp);color:#fff}
.btn-whatsapp:hover{background:var(--whatsapp-dark)}
.btn-outline{background:#fff;color:var(--gray-700);border:1.5px solid var(--gray-200)}
.btn-outline:hover{border-color:var(--gray-300);background:var(--gray-50)}
.btn-outline:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:6px}
.form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:160px}
.field label{font-size:12px;font-weight:600;color:var(--gray-700)}
.field input,.field select{width:100%;padding:9px 12px;border:1.5px solid var(--gray-200);border-radius:9px;transition:all .15s;background:#fff}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border-radius:12px;padding:18px;border:1px solid var(--gray-100);box-shadow:var(--shadow);transition:all .2s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.stat-icon.blue{background:var(--primary-light);color:var(--primary)}
.stat-icon.green{background:#d1fae5;color:var(--success)}
.stat-icon.orange{background:#fed7aa;color:var(--warning)}
.stat-icon.red{background:#fee2e2;color:var(--danger)}
.stat-icon.purple{background:#e9d5ff;color:#9333ea}
.stat-value{font-size:26px;font-weight:800;color:var(--gray-900);line-height:1}
.stat-label{font-size:12.5px;color:var(--gray-500);margin-top:4px}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--gray-100);background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
thead{background:var(--gray-50)}
th{padding:11px 12px;text-align:right;font-weight:700;font-size:12px;color:var(--gray-700);border-bottom:1px solid var(--gray-200);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--gray-100);color:var(--gray-700)}
tbody tr:hover{background:var(--gray-50)}
tbody tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-green{background:#d1fae5;color:#065f46}
.b-red{background:#fee2e2;color:#991b1b}
.b-orange{background:#fed7aa;color:#92400e}
.b-blue{background:var(--primary-light);color:var(--primary-dark)}
.b-gray{background:var(--gray-100);color:var(--gray-700)}
.b-purple{background:#e9d5ff;color:#6b21a8}
.b-wa{background:#dcfce7;color:#166534}
.alert{padding:12px 14px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.alert-info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.alert-success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.alert-warning{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.alert-danger{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.empty{text-align:center;padding:50px 20px;color:var(--gray-500)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-title{font-size:15px;font-weight:600;color:var(--gray-700);margin-bottom:4px}
.loader-overlay{position:fixed;inset:0;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:2000}
.spinner{width:44px;height:44px;border:4px solid var(--gray-200);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.daily-table input,.daily-table select{padding:6px 8px;font-size:12.5px;border:1px solid var(--gray-200);border-radius:7px;width:100%;transition:all .15s}
.daily-table input:focus,.daily-table select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);outline:none}
.daily-table .perm-hours{max-width:80px}
.row-saving{background:#fffbeb}
.row-saved{background:#f0fdf4}
.date-nav{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.date-nav button{padding:6px 12px;font-size:12px;border:1.5px solid var(--gray-200);background:#fff;border-radius:7px;font-weight:600;color:var(--gray-700);transition:all .15s}
.date-nav button:hover{border-color:var(--primary);color:var(--primary)}
.date-nav button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tabs-inline{display:flex;gap:6px;padding:4px;background:var(--gray-100);border-radius:10px;margin-bottom:16px;width:fit-content;flex-wrap:wrap}
.tab-inline{padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--gray-700);transition:all .15s}
.tab-inline.active{background:#fff;color:var(--primary);box-shadow:var(--shadow)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1500}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.modal-header{font-size:17px;font-weight:800;color:var(--gray-900);margin-bottom:16px}
.modal-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.modal-actions .btn{flex:1;justify-content:center;min-width:120px}
.upload-zone{border:2px dashed var(--gray-300);border-radius:12px;padding:32px 20px;text-align:center;background:var(--gray-50);transition:all .2s;cursor:pointer}
.upload-zone:hover{border-color:var(--primary);background:var(--primary-light)}
.report-card{border:1px solid var(--gray-200);border-radius:12px;padding:16px;margin-bottom:14px;background:#fff}
.report-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--gray-100);margin-bottom:12px;flex-wrap:wrap;gap:10px}
.report-name{font-size:15px;font-weight:700;color:var(--gray-900)}
.report-summary{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;padding:12px;background:var(--gray-50);border-radius:10px;margin-bottom:12px}
.report-summary b{color:var(--gray-900)}
.timeline{position:relative;padding-right:28px;margin:16px 0}
.timeline::before{content:'';position:absolute;right:10px;top:8px;bottom:8px;width:2px;background:var(--gray-200)}
.timeline-item{position:relative;padding:12px 0}
.timeline-item::before{content:'';position:absolute;right:-24px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid #fff;box-shadow:0 0 0 2px var(--primary-light)}
.branch-section{border:1px solid var(--gray-200);border-radius:12px;padding:16px;margin-bottom:14px;background:#fff}
.branch-section-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--gray-100);margin-bottom:12px;flex-wrap:wrap;gap:10px}
.muted{color:var(--gray-500);font-size:12px}
.mt-2{margin-top:8px}
.mt-3{margin-top:12px}
.mt-4{margin-top:16px}
.inactive-row{opacity:.55}
.wa-preview{width:100%;min-height:320px;padding:12px;border:1.5px solid var(--gray-200);border-radius:9px;font-family:inherit;font-size:13px;resize:vertical;white-space:pre-wrap;direction:rtl;text-align:right;background:var(--gray-50);line-height:1.9}
.row-match{background:#f0fdf4}
.row-warn{background:#fffbeb}
.row-error{background:#fef2f2}
.cmp-print-only{display:none}

/* ===== Branch Cards ===== */
.branch-card{
  background:#fff;
  border:1px solid var(--gray-200);
  border-radius:12px;
  padding:16px;
  transition:all .15s;
}
.branch-card:hover{
  border-color:var(--primary);
  box-shadow:0 4px 12px rgba(37,99,235,.08);
}
.branch-card-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:12px;
  padding-bottom:12px;
  border-bottom:1px dashed var(--gray-200);
}
.branch-card-name{font-size:16px;font-weight:800;color:var(--gray-900);line-height:1.2}
.branch-card-info{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:12px;
  font-size:12.5px;
}
.branch-card-info .row{display:flex;gap:8px;align-items:center;color:var(--gray-700)}
.branch-card-info .lbl{color:var(--gray-500);min-width:70px;font-size:11.5px}
.branch-card-footer{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  padding-top:12px;
  border-top:1px dashed var(--gray-200);
}
.branch-card-footer .btn{flex:1;min-width:80px;justify-content:center}

/* ===== Daily Cards ===== */
.daily-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:14px;
}
.emp-card{
  background:#fff;
  border:1.5px solid var(--gray-200);
  border-radius:14px;
  padding:14px;
  transition:all .15s;
  position:relative;
}
.emp-card:hover{border-color:var(--gray-300)}
.emp-card.saving{border-color:var(--warning);background:#fffbeb}
.emp-card.saved{border-color:var(--success);background:#f0fdf4}
.emp-card.status-absent{background:#fef2f2;border-color:#fecaca}
.emp-card.status-leave{background:#eff6ff;border-color:#bfdbfe}
.emp-card.status-mission{background:#faf5ff;border-color:#e9d5ff}

.emp-card-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:12px;
  padding-bottom:10px;
  border-bottom:1px dashed var(--gray-200);
}
.emp-name{font-size:15px;font-weight:800;color:var(--gray-900);line-height:1.2}
.emp-code{font-size:11.5px;color:var(--gray-500);margin-top:3px}

.save-indicator{
  font-size:10.5px;
  padding:3px 9px;
  border-radius:20px;
  font-weight:700;
  white-space:nowrap;
  flex-shrink:0;
}
.save-indicator.saving{background:#fef3c7;color:#92400e}
.save-indicator.saved{background:#d1fae5;color:#065f46}

.status-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-bottom:12px;
}
.status-btn{
  padding:9px 3px;
  border-radius:9px;
  font-size:11.5px;
  font-weight:700;
  background:var(--gray-100);
  color:var(--gray-700);
  transition:all .15s;
  border:1.5px solid transparent;
  text-align:center;
  cursor:pointer;
  line-height:1.2;
}
.status-btn:hover{background:var(--gray-200);transform:translateY(-1px)}
.status-btn.active[data-status="present"]{background:#d1fae5;color:#065f46;border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.1)}
.status-btn.active[data-status="absent"]{background:#fee2e2;color:#991b1b;border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.1)}
.status-btn.active[data-status="leave"]{background:#dbeafe;color:#1e40af;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.status-btn.active[data-status="mission"]{background:#e9d5ff;color:#6b21a8;border-color:#9333ea;box-shadow:0 0 0 3px rgba(147,51,234,.1)}

.time-inputs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px;
  padding:12px;
  background:var(--gray-50);
  border-radius:10px;
}
.time-group{display:flex;flex-direction:column;gap:4px}
.time-group label{font-size:11px;font-weight:700;color:var(--gray-700);text-align:center}
.time-group input{
  padding:10px 8px;
  border:1.5px solid var(--gray-200);
  border-radius:8px;
  font-size:14px;
  text-align:center;
  font-weight:700;
  background:#fff;
  transition:all .15s;
}
.time-group input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-light);
  outline:none;
}

.extra-row{margin-bottom:10px}
.extra-row select{
  width:100%;
  padding:9px 12px;
  border:1.5px solid var(--gray-200);
  border-radius:9px;
  font-size:12.5px;
  background:#fff;
  transition:all .15s;
}
.extra-row select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);outline:none}

.perm-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  margin-bottom:10px;
}
.perm-row select{
  padding:9px 12px;
  border:1.5px solid var(--gray-200);
  border-radius:9px;
  font-size:12.5px;
  background:#fff;
}
.perm-row select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);outline:none}
.perm-row input{
  width:90px;
  padding:9px 8px;
  border:1.5px solid var(--gray-200);
  border-radius:9px;
  font-size:12.5px;
  text-align:center;
}
.perm-row input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);outline:none}

.emp-card .f-notes{
  width:100%;
  padding:9px 12px;
  border:1.5px solid var(--gray-200);
  border-radius:9px;
  font-size:12.5px;
  background:#fff;
  transition:all .15s;
}
.emp-card .f-notes:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);outline:none}

.daily-summary-bar{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  font-size:13px;
  padding:10px 14px;
  background:var(--gray-50);
  border-radius:10px;
  margin-top:8px;
  border:1px solid var(--gray-100);
}
.daily-summary-bar b{font-size:15px}

/* ===== Reset Options ===== */
.reset-option{
  display:flex;align-items:flex-start;gap:10px;padding:12px 14px;
  background:#fff;border:1.5px solid var(--gray-200);border-radius:10px;
  cursor:pointer;transition:all .15s
}
.reset-option:hover{border-color:var(--danger);background:#fef2f2}

}

<body>

<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="login-logo">⏱</div>
    <div class="login-title" id="loginTitle">نظام الحضور</div>
    <div class="login-subtitle" id="loginSub"></div>
    <div class="login-field">
      <label>اسم المستخدم</label>
      <input id="loginUser" autocomplete="username">
    </div>
    <div class="login-field">
      <label>كلمة المرور</label>
      <input id="loginPass" type="password" autocomplete="current-password">
    </div>
    <div class="login-field" id="loginNameWrap" style="display:none">
      <label>الاسم الكامل</label>
      <input id="loginName">
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">دخول</button>
    <div class="login-error" id="loginErr"></div>
    <div class="login-hint" id="loginHint"></div>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1>⏱ نظام الحضور</h1>
      <p id="sidebarRole">—</p>
    </div>
    <div id="navMenu"></div>
    <div class="sidebar-footer">إدارة الحضور والانصراف</div>
  </aside>
  <header class="header">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="header-title" id="pageTitle"></div>
    </div>
    <div class="header-actions">
      <div class="user-menu">
        <div class="user-avatar" id="userAvatar">—</div>
        <div>
          <div class="user-name" id="userName">—</div>
          <div class="user-role" id="userRole">—</div>
        </div>
      </div>
      <button class="logout-btn" onclick="doLogout()">خروج</button>
    </div>
  </header>
  <main class="main" id="mainContent"></main>
</div>

<div id="loader" class="loader-overlay" style="display:none"><div class="spinner"></div></div>
<div id="modalContainer"></div>

<div id="printHeader" class="print-header"></div>
<div id="printFooter" class="print-footer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getFirestore, collection, doc, getDocs,
  addDoc, updateDoc, deleteDoc, writeBatch, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBla94ZCx9oaTMm1-tmehyVx-Pyn-_zz3g",
  authDomain: "attendance-system-403c3.firebaseapp.com",
  projectId: "attendance-system-403c3",
  storageBucket: "attendance-system-403c3.firebasestorage.app",
  messagingSenderId: "241577979833",
  appId: "1:241577979833:web:af35ec638772254e95d068"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const DB = { branches:[], users:[], shifts:[], employees:[], punches:[], daily:[], settings:{}, settingsId:null };
let currentUser = null;
let activePage = 'dashboard';
let lastReport = null;
let lastEmpReport = null;
let lastComparison = null;
let unsubs = [];
const UI = {};

const DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const STATUS = { present:'حاضر', absent:'غائب', leave:'أجازة', mission:'مهمة' };
const PERM = { none:'بدون', hour:'إذن ساعات', day:'يوم كامل' };

const $ = id => document.getElementById(id);
const showLoader = v => $('loader').style.display = v ? 'flex' : 'none';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s==null?'':s).trim().toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,'');
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };

const localKey = d => {
  const dt = (d instanceof Date) ? d : new Date(d);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
};
const today = () => localKey(new Date());
const dayName = dk => DAYS[new Date(dk+'T00:00:00').getDay()];
const fmtDate = d => d ? new Date(d).toLocaleDateString('ar-EG', { year:'numeric', month:'short', day:'numeric' }) : '—';

function fmtMins(m){
  m = Math.round(m||0);
  const abs = Math.abs(m);
  if(!abs) return '0 دقيقة';
  const h = Math.floor(abs/60), mn = abs%60;
  let t = h && mn ? `${h}س ${mn}د` : (h ? `${h} ساعة` : `${mn} دقيقة`);
  return m < 0 ? `-${t}` : t;
}
function fmtHM(ms){
  const d = new Date(ms);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function dtAt(dateKey, timeStr){
  const [y,m,d] = dateKey.split('-').map(Number);
  const [hh,mm] = String(timeStr||'00:00').split(':').map(Number);
  return new Date(y, m-1, d, hh||0, mm||0, 0, 0);
}
function parseDate(str){
  if(!str) return null;
  let s = String(str).trim();
  const isPM = s.includes('م') || s.toUpperCase().includes('PM');
  const isAM = s.includes('ص') || s.toUpperCase().includes('AM');
  s = s.replace(/[صم]/g,'').trim();
  const parts = s.split(/\s+/);
  if(parts.length >= 2){
    const dp = parts[0].split(/[\/\-\.]/);
    const tp = parts[1].split(':');
    if(dp.length === 3 && tp.length >= 2){
      let d = parseInt(dp[0],10), m = parseInt(dp[1],10)-1, y = parseInt(dp[2],10);
      if(y < 100) y += 2000;
      let h = parseInt(tp[0],10), mn = parseInt(tp[1],10), sec = tp[2]?parseInt(tp[2],10):0;
      if(isPM && h < 12) h += 12;
      else if(isAM && h === 12) h = 0;
      const dt = new Date(y, m, d, h, mn, sec);
      if(!isNaN(dt.getTime())) return dt;
    }
  }
  const dt = new Date(s);
  return isNaN(dt.getTime()) ? null : dt;
}
async function hash(p){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function fsAll(n){
  const s = await getDocs(collection(db, n));
  return s.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function fsAdd(n, data){
  const r = await addDoc(collection(db, n), data);
  return { id: r.id, ...data };
}
async function fsUpd(n, id, data){ await updateDoc(doc(db, n, id), data); }
async function fsDel(n, id){ await deleteDoc(doc(db, n, id)); }
async function fsBatchDel(n, fn){
  const s = await getDocs(collection(db, n));
  const b = writeBatch(db);
  let c = 0;
  s.docs.forEach(d => { if(fn({id:d.id, ...d.data()})){ b.delete(d.ref); c++; } });
  if(c) await b.commit();
  return c;
}
async function fsBatchAdd(n, items){
  const CH = 400;
  for(let i=0; i<items.length; i+=CH){
    const b = writeBatch(db);
    items.slice(i, i+CH).forEach(it => b.set(doc(collection(db, n)), it));
    await b.commit();
  }
}
async function fsRestore(n, items){
  const CH = 400;
  for(let i=0; i<items.length; i+=CH){
    const b = writeBatch(db);
    items.slice(i, i+CH).forEach(it => {
      const { id, ...data } = it;
      if(id) b.set(doc(db, n, id), data);
    });
    await b.commit();
  }
}

async function loadAll(){
  showLoader(true);
  try {
    const [b, u, s, e, p, d, st] = await Promise.all([
      fsAll('branches'), fsAll('users'), fsAll('shifts'),
      fsAll('employees'), fsAll('punches'), fsAll('daily'),
      fsAll('settings')
    ]);
    Object.assign(DB, { branches:b, users:u, shifts:s, employees:e, punches:p, daily:d });
    DB.settings = st.length ? st[0] : {};
    DB.settingsId = st.length ? st[0].id : null;
  } finally {
    showLoader(false);
  }
}
function startLive(){
  unsubs.forEach(u => { try{ u(); }catch(e){} });
  unsubs = [];
  ['daily','punches','employees','shifts','branches','users'].forEach(col => {
    unsubs.push(onSnapshot(collection(db, col), snap => {
      DB[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if(currentUser && !['reports','employee','compare'].includes(activePage)) refreshPage();
    }, err => { console.error('onSnapshot error for', col, err); }));
  });
  unsubs.push(onSnapshot(collection(db, 'settings'), snap => {
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    DB.settings = list.length ? list[0] : {};
    DB.settingsId = list.length ? list[0].id : null;
    updatePrintBranding();
    if(currentUser) refreshPage();
  }, err => { console.error('settings live error', err); }));
}
function stopLive(){ unsubs.forEach(u => { try{ u(); }catch(e){} }); unsubs = []; }

const getBranch = id => DB.branches.find(b => b.id === id);
const branchName = id => getBranch(id)?.name || '—';
const getShift = id => DB.shifts.find(s => s.id === id);
const getDefaultShift = bId => {
  const b = getBranch(bId);
  return b?.defaultShiftId ? getShift(b.defaultShiftId) : null;
};

async function checkSetup(){
  showLoader(true);
  try {
    const users = await fsAll('users');
    const setup = users.length === 0;
    window.__setup = setup;
    $('loginTitle').textContent = setup ? 'إنشاء حساب المدير' : 'نظام الحضور';
    $('loginSub').textContent = setup ? 'أدخل بيانات حساب المدير الرئيسي' : 'تسجيل الدخول';
    $('loginNameWrap').style.display = setup ? 'block' : 'none';
    $('loginBtn').textContent = setup ? 'إنشاء الحساب' : 'دخول';
    $('loginHint').textContent = setup ? '' : 'يرجى التواصل مع الإدارة للحصول على بيانات الدخول';
    $('loginBtn').disabled = false;
    $('loginPage').style.display = 'flex';
    $('app').style.display = 'none';
  } catch(e){
    console.error('checkSetup failed:', e);
    $('loginPage').style.display = 'flex';
    $('app').style.display = 'none';
    const err = $('loginErr');
    err.textContent = '⚠️ فشل الاتصال بقاعدة البيانات: ' + (e?.message || e);
    err.style.display = 'block';
    $('loginBtn').disabled = true;
    $('loginHint').textContent = 'افتح Console (F12) للتفاصيل';
  } finally {
    showLoader(false);
  }
}
async function doLogin(){
  const u = $('loginUser').value.trim();
  const p = $('loginPass').value;
  const err = $('loginErr');
  err.style.display = 'none';
  if(!u || !p){ err.textContent = 'أدخل اسم المستخدم وكلمة المرور'; err.style.display='block'; return; }
  showLoader(true);
  try {
    if(window.__setup){
      const name = $('loginName').value.trim() || u;
      const user = await fsAdd('users', {
        username: u, passwordHash: await hash(p),
        role: 'admin', name, branchId: null, createdAt: Date.now()
      });
      currentUser = user;
      sessionStorage.setItem('uid', user.id);
      await loadAll();
      enterApp();
      return;
    }
    const users = await fsAll('users');
    const ph = await hash(p);
    const user = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.passwordHash === ph);
    if(!user){ err.textContent = 'بيانات الدخول غير صحيحة'; err.style.display = 'block'; return; }

    const stArr = await fsAll('settings');
    const st = stArr.length ? stArr[0] : {};
    if(st.maintenance && user.role !== 'admin'){
      err.innerHTML = '🔧 <b>النظام تحت الصيانة حالياً</b><br><span style="font-size:12px;font-weight:400">يرجى المحاولة لاحقاً</span>';
      err.style.display = 'block';
      return;
    }

    currentUser = user;
    sessionStorage.setItem('uid', user.id);
    await loadAll();
    enterApp();
  } catch(e){
    err.textContent = '⚠️ خطأ: ' + (e?.message || e);
    err.style.display = 'block';
  } finally {
    showLoader(false);
  }
}
function doLogout(){
  stopLive();
  currentUser = null;
  sessionStorage.removeItem('uid');
  $('app').style.display = 'none';
  $('loginPage').style.display = 'flex';
  $('loginPass').value = '';
  checkSetup();
}
function enterApp(){
  $('loginPage').style.display = 'none';
  $('app').style.display = 'grid';
  const role = currentUser.role === 'admin' ? 'مدير النظام' : branchName(currentUser.branchId);
  $('userName').textContent = currentUser.name;
  $('userRole').textContent = role;
  $('userAvatar').textContent = (currentUser.name || 'م').charAt(0).toUpperCase();
  $('sidebarRole').textContent = role;
  if(currentUser.role === 'admin'){
    if(!['dashboard','daily','settings','uploads','reports','employee','compare'].includes(activePage)) activePage = 'dashboard';
  } else {
    activePage = 'daily';
  }
  startLive();
  buildNav();
  renderPage();
  updatePrintBranding();
}
function toggleSidebar(){ $('sidebar').classList.toggle('open'); }
function buildNav(){
  const isAdmin = currentUser.role === 'admin';
  const items = isAdmin ? [
    { id:'dashboard', icon:'📊', label:'الرئيسية' },
    { id:'daily', icon:'📅', label:'التسجيل اليومي' },
    { id:'settings', icon:'⚙️', label:'الإعدادات' },
    { id:'uploads', icon:'📥', label:'رفع البصمة' },
    { id:'reports', icon:'📈', label:'التقارير' },
    { id:'employee', icon:'👤', label:'سجل الموظف' },
    { id:'compare', icon:'🔍', label:'المقارنة' }
  ] : [{ id:'daily', icon:'📅', label:'التسجيل اليومي' }];
  $('navMenu').innerHTML = `
    <div class="nav-group">
      <div class="nav-label">${isAdmin ? 'الإدارة' : 'الفرع'}</div>
      ${items.map(i => `
        <button class="nav-item ${activePage === i.id ? 'active' : ''}" onclick="navigateTo('${i.id}')">
          <span class="icon">${i.icon}</span>
          <span>${i.label}</span>
        </button>
      `).join('')}
    </div>`;
}
function navigateTo(page){
  activePage = page;
  if(window.innerWidth <= 900) $('sidebar').classList.remove('open');
  buildNav();
  renderPage();
  $('mainContent').scrollTop = 0;
}
function refreshPage(){
  const ae = document.activeElement;
  if(ae && ['INPUT','SELECT','TEXTAREA'].includes(ae.tagName)) return;
  if(document.querySelector('.emp-card.saving')) return;
  renderPage();
}

function getCurrentPrintBranch(){
  if(activePage === 'reports' && lastReport && lastReport.branchId) return branchName(lastReport.branchId);
  if(activePage === 'compare' && lastComparison && lastComparison.branchId) return branchName(lastComparison.branchId);
  if(activePage === 'employee' && UI.empReportId){
    const emp = DB.employees.find(e => e.id === UI.empReportId);
    if(emp) return branchName(emp.branchId);
  }
  if(activePage === 'daily' && UI.dailyBranch) return branchName(UI.dailyBranch);
  if(currentUser?.branchId) return branchName(currentUser.branchId);
  return '';
}

function renderPage(){
  const titles = { dashboard:'الرئيسية', daily:'التسجيل اليومي', settings:'الإعدادات', uploads:'رفع البصمة', reports:'التقارير', employee:'سجل الموظف', compare:'🔍 المقارنة' };
  $('pageTitle').textContent = titles[activePage] || '';
  const content = { dashboard: renderDashboard, daily: renderDaily, settings: renderSettings, uploads: renderUploads, reports: renderReports, employee: renderEmployeeHistory, compare: renderCompare };
  let banner = '';
  if(DB.settings?.maintenance){
    banner = `<div class="alert alert-danger" style="margin-bottom:16px;font-size:14px">
      🔴 <b>النظام تحت الصيانة</b> — الفروع لا تستطيع تسجيل الدخول حالياً
    </div>`;
  }
  $('mainContent').innerHTML = banner + (content[activePage]?.() || '');
  updatePrintBranding(getCurrentPrintBranch());
}

function renderDashboard(){
  if(DB.branches.length === 0){
    return `<div class="card"><div class="empty"><div class="empty-icon">🏢</div><div class="empty-title">لا توجد فروع</div>
      <button class="btn btn-primary mt-3" onclick="navigateTo('settings')">إضافة فرع</button></div></div>`;
  }
  const t = today();
  const activeEmps = DB.employees.filter(e => e.active !== false).length;
  const todayEntries = DB.daily.filter(d => d.dateKey === t).length;
  const totalPunches = DB.punches.length;
  const branchCards = DB.branches.map(b => {
    const emps = DB.employees.filter(e => e.branchId === b.id && e.active !== false).length;
    const todayC = DB.daily.filter(d => d.branchId === b.id && d.dateKey === t).length;
    const percent = emps ? Math.round(todayC / emps * 100) : 0;
    return `<div class="card">
      <div class="card-header">
        <div><div class="card-title">${esc(b.name)}</div><div class="card-subtitle">${emps} موظف</div></div>
        <span class="badge b-${percent >= 100 ? 'green' : percent > 0 ? 'orange' : 'gray'}">${percent}%</span>
      </div>
      <div style="background:var(--gray-100);border-radius:8px;height:8px;overflow:hidden;margin-bottom:12px">
        <div style="background:var(--success);height:100%;width:${percent}%"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--gray-500)">
        <span>${todayC} مسجل</span><span>${emps - todayC} متبقي</span>
      </div>
      <button class="btn btn-outline btn-sm mt-3" style="width:100%" onclick="viewBranchToday('${b.id}')">عرض التفاصيل</button>
    </div>`;
  }).join('');
  return `
    <div class="stats">
      <div class="stat"><div class="stat-icon blue">🏢</div><div class="stat-value">${DB.branches.length}</div><div class="stat-label">الفروع</div></div>
      <div class="stat"><div class="stat-icon green">👥</div><div class="stat-value">${activeEmps}</div><div class="stat-label">الموظفين</div></div>
      <div class="stat"><div class="stat-icon orange">✅</div><div class="stat-value">${todayEntries}</div><div class="stat-label">تسجيلات اليوم</div></div>
      <div class="stat"><div class="stat-icon purple">📥</div><div class="stat-value">${totalPunches}</div><div class="stat-label">البصمات</div></div>
    </div>
    <div class="card">
      <div class="card-header">
        <div><div class="card-title">حالة الفروع اليوم</div><div class="card-subtitle">${dayName(t)} ${t}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px">${branchCards}</div>
    </div>`;
}
function viewBranchToday(bId){ UI.dailyBranch = bId; navigateTo('daily'); }

/* ============================================================
   📅 التسجيل اليومي — كروت
   ============================================================ */

function renderDaily(){
  const isAdmin = currentUser.role === 'admin';
  const date = UI.dailyDate || today();
  UI.dailyDate = date;
  if(!isAdmin) UI.dailyBranch = currentUser.branchId;
  const bId = isAdmin ? UI.dailyBranch : currentUser.branchId;

  const branchField = isAdmin ? `
    <div class="field" style="max-width:240px">
      <label>🏢 الفرع</label>
      <select onchange="setDailyBranch(this.value)">
        <option value="">اختر الفرع</option>
        ${DB.branches.map(b => `<option value="${b.id}" ${bId === b.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}
      </select>
    </div>` : '';

  const base = new Date(date+'T00:00:00');
  const y = new Date(base); y.setDate(y.getDate()-1);
  const yn = new Date(base); yn.setDate(yn.getDate()+1);
  const yKey = localKey(y), ynKey = localKey(yn);
  const tKey = today();
  const dateNav = `
    <div class="field" style="max-width:200px">
      <label>📅 التاريخ</label>
      <input type="date" value="${date}" onchange="setDailyDate(this.value)">
    </div>
    <div class="date-nav" style="align-self:flex-end">
      <button class="${date === yKey ? 'active' : ''}" onclick="setDailyDate('${yKey}')">أمس</button>
      <button class="${date === tKey ? 'active' : ''}" onclick="setDailyDate('${tKey}')">اليوم</button>
      <button class="${date === ynKey ? 'active' : ''}" onclick="setDailyDate('${ynKey}')">غداً</button>
    </div>`;

  if(!bId){
    return `<div class="card">
      <div class="card-header"><div class="card-title">📅 التسجيل اليومي</div></div>
      <div class="form-row">${branchField}${dateNav}</div>
      <div class="empty"><div class="empty-icon">🏢</div><div class="empty-title">اختر الفرع أولاً</div></div>
    </div>`;
  }

  const emps = DB.employees.filter(e => e.branchId === bId && e.active !== false)
    .sort((a,b) => a.name.localeCompare(b.name,'ar'));
  const dailyMap = {};
  DB.daily.forEach(d => { if(d.dateKey === date && d.branchId === bId) dailyMap[d.empId] = d; });
  const branchShifts = DB.shifts.filter(s => s.branchId === bId);
  const defShift = getDefaultShift(bId);
  const savedCount = Object.keys(dailyMap).length;
  const remainingCount = emps.length - savedCount;

  if(!emps.length){
    return `<div class="card">
      <div class="card-header"><div class="card-title">📅 التسجيل اليومي</div></div>
      <div class="form-row">${branchField}${dateNav}</div>
      <div class="empty"><div class="empty-icon">👥</div><div class="empty-title">لا يوجد موظفين</div></div>
    </div>`;
  }

  const filter = UI.dailyFilter || 'all';
  const visibleEmps = filter === 'saved'
    ? emps.filter(e => dailyMap[e.id])
    : filter === 'remaining'
    ? emps.filter(e => !dailyMap[e.id])
    : emps;

  const cards = visibleEmps.map(e => {
    const rec = dailyMap[e.id] || {};
    const shiftId = rec.shiftId || e.shiftId || defShift?.id || '';
    const status = rec.status || 'present';
    const permType = rec.permType || 'none';
    const permHours = rec.permHours || '';
    const notes = rec.notes || '';
    const timeIn = rec.timeIn || '';
    const timeOut = rec.timeOut || '';
    const isSaved = !!dailyMap[e.id];
    const statusClass = status !== 'present' ? ` status-${status}` : '';

    return `<div class="emp-card${isSaved ? ' saved' : ''}${statusClass}" data-empid="${e.id}" data-branch="${bId}" data-date="${date}">
      <div class="emp-card-header">
        <div>
          <div class="emp-name">${esc(e.name)}</div>
          <div class="emp-code">#${esc(e.code)}</div>
        </div>
        <span class="save-indicator ${isSaved ? 'saved' : ''}" style="${isSaved ? '' : 'display:none'}">
          ${isSaved ? '✓ محفوظ' : ''}
        </span>
      </div>

      <div class="status-buttons">
        <button type="button" class="status-btn ${status === 'present' ? 'active' : ''}" data-status="present" onclick="setStatus('${e.id}','present')">✅ حاضر</button>
        <button type="button" class="status-btn ${status === 'absent' ? 'active' : ''}" data-status="absent" onclick="setStatus('${e.id}','absent')">❌ غائب</button>
        <button type="button" class="status-btn ${status === 'leave' ? 'active' : ''}" data-status="leave" onclick="setStatus('${e.id}','leave')">🏖️ أجازة</button>
        <button type="button" class="status-btn ${status === 'mission' ? 'active' : ''}" data-status="mission" onclick="setStatus('${e.id}','mission')">🎯 مهمة</button>
      </div>

      <div class="time-fields" style="${status === 'present' ? '' : 'display:none'}">
        <div class="time-inputs">
          <div class="time-group">
            <label>🕐 الدخول</label>
            <input type="time" class="f-in" value="${timeIn}" onchange="saveCard('${e.id}')">
          </div>
          <div class="time-group">
            <label>🕐 الخروج</label>
            <input type="time" class="f-out" value="${timeOut}" onchange="saveCard('${e.id}')">
          </div>
        </div>
      </div>

      <div class="extra-row">
        <select class="f-shift" onchange="saveCard('${e.id}')">
          <option value="">🕐 الشفت — اختر</option>
          ${branchShifts.map(s => `<option value="${s.id}" ${shiftId === s.id ? 'selected' : ''}>${esc(s.name)} (${s.start}-${s.end})</option>`).join('')}
        </select>
      </div>

      <div class="perm-row">
        <select class="f-ptype" onchange="saveCard('${e.id}');togglePermField('${e.id}')">
          ${Object.keys(PERM).map(k => `<option value="${k}" ${permType === k ? 'selected' : ''}>${PERM[k]}</option>`).join('')}
        </select>
        <input type="number" class="f-phours" min="0" max="24" step="0.5" value="${permHours}" placeholder="ساعات" onchange="saveCard('${e.id}')" style="${permType === 'hour' ? '' : 'display:none'}">
      </div>

      <input type="text" class="f-notes" value="${esc(notes)}" placeholder="📝 ملاحظات (اختياري)" onchange="saveCard('${e.id}')">
    </div>`;
  }).join('');

  return `<div class="card no-print">
    <div class="card-header">
      <div>
        <div class="card-title">📅 التسجيل اليومي</div>
        <div class="card-subtitle">${emps.length} موظف — <span style="color:var(--success);font-weight:700">${savedCount} محفوظ</span> · <span style="color:var(--warning);font-weight:700">${remainingCount} متبقي</span></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" onclick="markAllPresent('${bId}','${date}')">✅ الكل حاضر</button>
        <button class="btn btn-outline btn-sm" onclick="copyFromYesterday('${bId}','${date}')">📋 نسخ من الأمس</button>
        <button class="btn btn-whatsapp btn-sm" onclick="shareDailyWhatsApp('${bId}','${date}')">📤 واتساب</button>
        <button class="btn btn-success btn-sm" onclick="saveAll('${bId}','${date}')">💾 حفظ الكل</button>
      </div>
    </div>
    <div class="form-row">${branchField}${dateNav}</div>
    <div class="daily-summary-bar">
      <span>👥 إجمالي: <b>${emps.length}</b></span>
      <span style="color:var(--success)">✅ محفوظ: <b>${savedCount}</b></span>
      <span style="color:var(--warning)">⏳ متبقي: <b>${remainingCount}</b></span>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px">
      <button class="btn btn-outline btn-sm" onclick="setDailyFilter('all')" ${filter === 'all' ? 'disabled' : ''}>الكل (${emps.length})</button>
      <button class="btn btn-outline btn-sm" onclick="setDailyFilter('remaining')" ${filter === 'remaining' ? 'disabled' : ''}>⏳ المتبقي (${remainingCount})</button>
      <button class="btn btn-outline btn-sm" onclick="setDailyFilter('saved')" ${filter === 'saved' ? 'disabled' : ''}>✅ المحفوظ (${savedCount})</button>
    </div>
  </div>

  <div class="daily-grid">${cards || `<div class="card" style="grid-column:1/-1"><div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">لا يوجد موظفين مطابقين للفلتر</div></div></div>`}</div>`;
}

function setDailyBranch(b){ UI.dailyBranch = b; renderPage(); }
function setDailyDate(d){ UI.dailyDate = d; renderPage(); }
function setDailyFilter(f){ UI.dailyFilter = f; renderPage(); }

function setStatus(empId, status){
  const card = document.querySelector(`.emp-card[data-empid="${empId}"]`);
  if(!card) return;

  card.querySelectorAll('.status-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.status === status);
  });

  const timeFields = card.querySelector('.time-fields');
  if(timeFields){
    timeFields.style.display = (status === 'present') ? '' : 'none';
  }

  card.classList.remove('status-absent','status-leave','status-mission');
  if(status !== 'present') card.classList.add(`status-${status}`);

  saveCard(empId);
}

function togglePermField(empId){
  const card = document.querySelector(`.emp-card[data-empid="${empId}"]`);
  if(!card) return;
  const val = card.querySelector('.f-ptype').value;
  const inp = card.querySelector('.f-phours');
  inp.style.display = val === 'hour' ? '' : 'none';
  if(val !== 'hour') inp.value = '';
}

function saveCard(empId){
  const card = document.querySelector(`.emp-card[data-empid="${empId}"]`);
  if(!card) return;

  const indicator = card.querySelector('.save-indicator');
  if(indicator){
    indicator.textContent = '⏳ جاري الحفظ';
    indicator.className = 'save-indicator saving';
    indicator.style.display = '';
  }
  card.classList.add('saving');
  card.classList.remove('saved');

  clearTimeout(card.__t);
  card.__t = setTimeout(async () => {
    await persistCard(card, empId);
    card.classList.remove('saving');
    card.classList.add('saved');
    if(indicator){
      indicator.textContent = '✓ محفوظ';
      indicator.className = 'save-indicator saved';
    }
  }, 500);
}

function cardDataFromEl(card, bId, date){
  const empId = card.dataset.empid;
  const activeBtn = card.querySelector('.status-btn.active');
  const status = activeBtn ? activeBtn.dataset.status : 'present';
  return {
    branchId: bId,
    dateKey: date,
    empId,
    shiftId: card.querySelector('.f-shift').value,
    timeIn: card.querySelector('.f-in')?.value || '',
    timeOut: card.querySelector('.f-out')?.value || '',
    status,
    permType: card.querySelector('.f-ptype').value,
    permHours: num(card.querySelector('.f-phours').value),
    notes: card.querySelector('.f-notes').value.trim(),
    updatedBy: currentUser.name,
    updatedAt: Date.now()
  };
}

function isCardEmpty(data, emp, bId){
  const defShift = emp?.shiftId || getBranch(bId)?.defaultShiftId || '';
  return !data.timeIn && !data.timeOut && !data.notes
    && data.status === 'present' && data.permType === 'none'
    && !data.permHours && data.shiftId === defShift;
}

async function persistCard(card, empId){
  const bId = card.dataset.branch;
  const date = card.dataset.date;
  const data = cardDataFromEl(card, bId, date);
  const emp = DB.employees.find(e => e.id === empId);
  const isEmpty = isCardEmpty(data, emp, bId);
  const existing = DB.daily.find(d => d.branchId === bId && d.dateKey === date && d.empId === empId);
  try {
    if(isEmpty && existing){
      await fsDel('daily', existing.id);
      DB.daily = DB.daily.filter(d => d.id !== existing.id);
    } else if(!isEmpty && existing){
      await fsUpd('daily', existing.id, data);
      Object.assign(existing, data);
    } else if(!isEmpty){
      const rec = await fsAdd('daily', data);
      DB.daily.push(rec);
    }
  } catch(e){ console.error(e); }
}

async function markAllPresent(bId, date){
  if(!confirm('هيتم تعليم كل الموظفين «✅ حاضر». متابعة؟')) return;
  const cards = document.querySelectorAll('.emp-card[data-empid]');
  cards.forEach(card => {
    card.querySelectorAll('.status-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === 'present');
    });
    const tf = card.querySelector('.time-fields');
    if(tf) tf.style.display = '';
    card.classList.remove('status-absent','status-leave','status-mission');
  });
  await saveAll(bId, date);
}

async function saveAll(bId, date){
  const cards = document.querySelectorAll('.emp-card[data-empid]');
  if(!cards.length){ alert('لا يوجد موظفين'); return; }
  showLoader(true);
  try {
    cards.forEach(card => { clearTimeout(card.__t); card.classList.remove('saving'); });
    const old = DB.daily.filter(d => d.branchId === bId && d.dateKey === date);
    const newRecords = [];
    cards.forEach(card => {
      const empId = card.dataset.empid;
      const emp = DB.employees.find(e => e.id === empId);
      const data = cardDataFromEl(card, bId, date);
      if(isCardEmpty(data, emp, bId)) return;
      newRecords.push(data);
    });
    const totalOps = old.length + newRecords.length;
    if(totalOps <= 450){
      const b = writeBatch(db);
      old.forEach(d => b.delete(doc(db, 'daily', d.id)));
      newRecords.forEach(data => b.set(doc(collection(db, 'daily')), data));
      await b.commit();
    } else {
      for(let i=0; i<old.length; i+=400){
        const b = writeBatch(db);
        old.slice(i, i+400).forEach(d => b.delete(doc(db, 'daily', d.id)));
        await b.commit();
      }
      for(let i=0; i<newRecords.length; i+=400){
        const b = writeBatch(db);
        newRecords.slice(i, i+400).forEach(data => b.set(doc(collection(db, 'daily')), data));
        await b.commit();
      }
    }
    await loadAll();
    renderPage();
  } catch(e){ alert('خطأ في الحفظ: ' + e.message); }
  finally { showLoader(false); }
}

async function copyFromYesterday(bId, date){
  const base = new Date(date+'T00:00:00');
  const y = new Date(base); y.setDate(y.getDate()-1);
  const yKey = localKey(y);
  const prev = DB.daily.filter(d => d.branchId === bId && d.dateKey === yKey);
  if(!prev.length){ alert('📭 مفيش سجلات من الأمس'); return; }
  if(!confirm(`📋 نسخ ${prev.length} سجل من ${yKey}؟`)) return;
  for(const p of prev){
    const card = document.querySelector(`.emp-card[data-empid="${p.empId}"]`);
    if(!card) continue;
    if(p.shiftId) card.querySelector('.f-shift').value = p.shiftId;
    if(p.permType) card.querySelector('.f-ptype').value = p.permType;
    if(p.permHours) card.querySelector('.f-phours').value = p.permHours;
    if(p.notes) card.querySelector('.f-notes').value = p.notes;
    if(p.status){
      card.querySelectorAll('.status-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.status === p.status);
      });
      const tf = card.querySelector('.time-fields');
      if(tf) tf.style.display = (p.status === 'present') ? '' : 'none';
      card.classList.remove('status-absent','status-leave','status-mission');
      if(p.status !== 'present') card.classList.add(`status-${p.status}`);
    }
    togglePermField(p.empId);
  }
  alert('✅ تم النسخ — اضغط «حفظ الكل» للتأكيد');
}

/* ============================================================
   أدوات مساعدة — تحويل الأرقام العربية والتواريخ
   ============================================================ */

const AR_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];

function arNum(v){
  return String(v==null?'':v).replace(/[0-9]/g, d => AR_DIGITS[+d]);
}

function fmtDateArFull(dateKey){
  if(!dateKey) return '—';
  const d = new Date(dateKey + 'T00:00:00');
  if(isNaN(d.getTime())) return dateKey;
  const day = DAYS[d.getDay()];
  let month = '';
  try { month = d.toLocaleDateString('ar-EG', { month:'long' }); } catch(e){ month = ''; }
  return `${day} ${arNum(d.getDate())} ${month} ${arNum(d.getFullYear())}`.replace(/\s+/g,' ');
}

function arTime(hm){
  if(!hm || hm === '—') return '—';
  const parts = String(hm).split(':');
  let h = parseInt(parts[0], 10);
  const m = parseInt(parts[1] || '0', 10);
  if(isNaN(h)) return '—';
  const period = h < 12 ? 'ص' : 'م';
  let h12 = h % 12;
  if(h12 === 0) h12 = 12;
  return `${arNum(h12)}:${arNum(String(m).padStart(2,'0'))} ${period}`;
}

function fmtMinsAr(m){ return arNum(fmtMins(m)); }

/* ============================================================
   WhatsApp Sharing
   ============================================================ */

const NON_PRESENT_STATUSES = ['غياب','أجازة','مهمة','بصمة ناقصة'];

function buildDailyWhatsAppText(bId, date){
  const branch = getBranch(bId);
  const emps = DB.employees
    .filter(e => e.branchId === bId && e.active !== false)
    .sort((a,b) => String(a.name||'').localeCompare(String(b.name||''),'ar'));

  const dailyMap = {};
  DB.daily.forEach(d => { if(d.dateKey === date && d.branchId === bId) dailyMap[d.empId] = d; });

  const punchMap = {};
  DB.punches.forEach(p => {
    if(p.dateKey === date && p.branchId === bId){
      (punchMap[p.empId] = punchMap[p.empId] || []).push(p);
    }
  });

  let present = 0, absent = 0, leave = 0, mission = 0, incomplete = 0;
  const lines = [];

  emps.forEach(e => {
    const rec = dailyMap[e.id] || null;
    const punches = punchMap[e.id] || [];
    const day = calcDay(e, date, rec, punches, bId);

    if(day.status === 'غياب') absent++;
    else if(day.status === 'أجازة') leave++;
    else if(day.status === 'مهمة') mission++;
    else if(day.status === 'بصمة ناقصة') incomplete++;
    else present++;

    let line = e.name;
    if(!NON_PRESENT_STATUSES.includes(day.status) && day.timeIn && day.timeOut){
      line += `\n     🕐 دخول: ${arTime(day.timeIn)}  ←  خروج: ${arTime(day.timeOut)}`;
    } else {
      line += `\n     📌 ${day.status}`;
    }
    lines.push(line);
  });

  let txt = `━━━━━━━━━━━━━━━━━━\n`;
  txt += `🏢 الفرع: ${branch?.name || '—'}\n`;
  txt += `📅 التاريخ: ${fmtDateArFull(date)}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `👥 إجمالي الموظفين: ${arNum(emps.length)}\n`;
  txt += `✅ حاضر: ${arNum(present)}\n`;
  if(absent)     txt += `❌ غائب: ${arNum(absent)}\n`;
  if(leave)      txt += `🏖️ أجازة: ${arNum(leave)}\n`;
  if(mission)    txt += `🎯 مهمة: ${arNum(mission)}\n`;
  if(incomplete) txt += `⚠️ بصمة ناقصة: ${arNum(incomplete)}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `📋 تفاصيل الموظفين:\n\n`;
  txt += lines.length ? lines.join('\n\n') : 'لا يوجد موظفون';
  txt += `\n━━━━━━━━━━━━━━━━━━`;
  return txt;
}

function buildReportWhatsAppText(){
  if(!lastReport || !lastReport.rows.length) return '';
  const { rows, branchId, from, to } = lastReport;
  let gP=0, gA=0, gL=0, gM=0, gI=0;
  rows.forEach(r => {
    gP += r.totals.present; gA += r.totals.absent;
    gL += r.totals.leave; gM += r.totals.mission; gI += r.totals.incomplete;
  });
  const period = `${from ? fmtDateArFull(from) : 'البداية'} ← ${to ? fmtDateArFull(to) : 'الآن'}`;
  let txt = `━━━━━━━━━━━━━━━━━━\n`;
  txt += `🏢 الفرع: ${branchName(branchId)}\n`;
  txt += `📅 الفترة: ${period}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `👥 عدد الموظفين: ${arNum(rows.length)}\n`;
  txt += `✅ إجمالي الحضور: ${arNum(gP)}\n`;
  if(gA)  txt += `❌ إجمالي الغياب: ${arNum(gA)}\n`;
  if(gL)  txt += `🏖️ إجمالي الأجازات: ${arNum(gL)}\n`;
  if(gM)  txt += `🎯 إجمالي المهام: ${arNum(gM)}\n`;
  if(gI)  txt += `⚠️ بصمة ناقصة: ${arNum(gI)}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `📋 تفاصيل الموظفين:\n\n`;
  const lines = rows.map(r => {
    const t = r.totals;
    let line = r.emp.name;
    line += `\n     📅 أيام: ${arNum(t.days)}  |  ✅ حضور: ${arNum(t.present)}  |  ❌ غياب: ${arNum(t.absent)}`;
    if(t.leave)   line += `  |  🏖️ أجازة: ${arNum(t.leave)}`;
    if(t.mission) line += `  |  🎯 مهمة: ${arNum(t.mission)}`;
    return line;
  });
  txt += lines.length ? lines.join('\n\n') : 'لا توجد بيانات';
  txt += `\n━━━━━━━━━━━━━━━━━━`;
  return txt;
}

  txt += `🔢 رقم البصمة: ${arNum(emp.code)}\n`;

  txt += `📊 الإجمالي:\n`;
  txt += `📅 عدد الأيام: ${arNum(grand.days)}\n`;
  txt += `✅ حضور: ${arNum(grand.present)}\n`;
  if(grand.absent)     txt += `❌ غياب: ${arNum(grand.absent)}\n`;
  if(grand.leave)      txt += `🏖️ أجازة: ${arNum(grand.leave)}\n`;
  if(grand.mission)    txt += `🎯 مهمة: ${arNum(grand.mission)}\n`;
  if(grand.incomplete) txt += `⚠️ بصمة ناقصة: ${arNum(grand.incomplete)}\n`;
  const history = emp.transferHistory || [];
  if(history.length){
    txt += `━━━━━━━━━━━━━━━━━━\n`;
    txt += `🔄 سجل التنقلات:\n`;
    history.forEach(h => {
      txt += `• ${h.fromName} ← ${h.toName} — ${fmtDateArFull(h.date)}${h.reason ? ' (' + h.reason + ')' : ''}\n`;
    });
  }
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `📋 التفاصيل اليومية:\n\n`;
  const lines = [];
  branchStats.forEach(b => {
    lines.push(`🏢 ${b.branchName}  (${fmtDateArFull(b.firstDate)} ← ${fmtDateArFull(b.lastDate)})`);
    b.days.forEach(d => {
      let line = `${d.dateKey}`;
      if(!NON_PRESENT_STATUSES.includes(d.status) && d.timeIn && d.timeOut){
        line += `\n     🕐 دخول: ${arTime(d.timeIn)}  ←  خروج: ${arTime(d.timeOut)}`;
      } else {
        line += `\n     📌 ${d.status}`;
      }
      lines.push(line);
    });
    lines.push('');
  });
  txt += lines.length ? lines.join('\n') : 'لا توجد سجلات';
  txt += `\n━━━━━━━━━━━━━━━━━━`;
  return txt;
}

function buildCompareWhatsAppText(){
  if(!lastComparison || !lastComparison.rows.length) return '';
  const { rows, summary, branchId, from, to } = lastComparison;
  const period = `${from ? fmtDateArFull(from) : 'البداية'} ← ${to ? fmtDateArFull(to) : 'الآن'}`;
  let txt = `━━━━━━━━━━━━━━━━━━\n`;
  txt += `🔍 تقرير المقارنة\n`;
  txt += `🏢 الفرع: ${branchName(branchId)}\n`;
  txt += `📅 الفترة: ${period}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `📊 الملخص:\n`;
  txt += `✅ مطابق: ${arNum(summary.match)}\n`;
  txt += `⚠️ فروقات: ${arNum(summary.warn)}\n`;
  txt += `❌ تناقضات: ${arNum(summary.error)}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  const issues = rows.filter(r => r.level === 'error' || r.level === 'warn');
  if(!issues.length){
    txt += `🎉 لا توجد فروقات — كل حاجة مطابقة\n`;
  } else {
    txt += `⚠️ الفروقات والتناقضات:\n\n`;
    const lines = issues.slice(0, 60).map(r => {
      let line = `${r.empName} — ${r.dateKey}`;
      line += `\n     📌 ${r.issues.join(' | ')}`;
      if(r.branchIn || r.branchOut){
        line += `\n     🏢 الفرع: ${arTime(r.branchIn) || '—'} ← ${arTime(r.branchOut) || '—'}`;
        if(r.branchNetMins !== null) line += ` (صافي ${fmtMinsAr(r.branchNetMins)})`;
      } else if(r.branchStatus !== 'present'){
        line += `\n     🏢 الفرع: ${STATUS[r.branchStatus] || r.branchStatus}`;
      }
      if(r.hasPunch){
        line += `\n     📥 البصمة: ${arTime(r.punchIn) || '—'} ← ${arTime(r.punchOut) || '—'}`;
        if(r.punchMins !== null) line += ` (${fmtMinsAr(r.punchMins)})`;
      }
      return line;
    });
    txt += lines.join('\n\n');
    if(issues.length > 60) txt += `\n\n... و${arNum(issues.length - 60)} صف إضافي`;
  }
  txt += `\n━━━━━━━━━━━━━━━━━━`;
  return txt;
}

function openWhatsAppShare(text, title){
  if(!text){ alert('لا يوجد محتوى لمشاركته'); return; }
  let defaultPhone = '';
  if(UI.dailyBranch){
    const b = getBranch(UI.dailyBranch);
    if(b?.whatsapp) defaultPhone = b.whatsapp;
  } else if(currentUser?.branchId){
    const b = getBranch(currentUser.branchId);
    if(b?.whatsapp) defaultPhone = b.whatsapp;
  }

  showModal(`
    <div class="modal-header">📤 إرسال عبر واتساب</div>
    <div class="field" style="margin-bottom:12px">
      <label>رقم الواتساب (اختياري)</label>
      <input id="waPhone" type="tel" dir="ltr" style="text-align:left"
        placeholder="مثال: 201012345678 — اتركه فارغ لاختيار جهة الاتصال يدويًا"
        value="${esc(defaultPhone)}">
      <div class="muted" style="margin-top:4px;font-size:11px">
        💡 اكتب الرقم بالصيغة الدولية بدون + أو مسافات (مثال: 201012345678)
      </div>
    </div>
    <div class="field" style="margin-bottom:12px">
      <label>📄 معاينة الرسالة (${esc(title)})</label>
      <textarea id="waText" class="wa-preview" readonly>${esc(text)}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-whatsapp" onclick="sendWhatsApp()">📱 فتح واتساب</button>
      <button class="btn btn-outline" onclick="copyWhatsAppText()">📋 نسخ النص</button>
      <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
    </div>
    <div class="muted" style="margin-top:12px;font-size:11.5px;text-align:center;padding-top:10px;border-top:1px solid var(--gray-100)">
      💡 على الموبايل هيظهرلك خيار "مشاركة" مع كل التطبيقات المتاحة
    </div>
  `);

  setTimeout(() => {
    const el = $('waPhone');
    if(el && !el.value) el.focus();
  }, 100);
}

function sendWhatsApp(){
  const text = $('waText')?.value || '';
  if(!text){ alert('لا يوجد نص'); return; }
  let phone = ($('waPhone')?.value || '').trim().replace(/[^\d+]/g, '');
  phone = phone.replace(/^\+/, '').replace(/^0+/, '');
  if(!phone && navigator.share){
    navigator.share({ text, title: 'تقرير الحضور' })
      .then(() => closeModal())
      .catch(err => {
        if(err.name !== 'AbortError'){
          const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
          window.open(url, '_blank');
        }
      });
    return;
  }
  const encoded = encodeURIComponent(text);
  const url = phone ? `https://wa.me/${phone}?text=${encoded}` : `https://wa.me/?text=${encoded}`;
  window.open(url, '_blank');
  closeModal();
}

function copyWhatsAppText(){
  const text = $('waText')?.value || '';
  if(!text) return;
  const done = () => {
    const btn = document.querySelector('.modal-actions button:nth-child(2)');
    if(btn){
      const old = btn.textContent;
      btn.textContent = '✅ تم النسخ';
      setTimeout(() => { btn.textContent = old; }, 1500);
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => {
      const ta = $('waText');
      if(ta){ ta.removeAttribute('readonly'); ta.select(); document.execCommand('copy'); ta.setAttribute('readonly',''); done(); }
    });
  } else {
    const ta = $('waText');
    if(ta){ ta.removeAttribute('readonly'); ta.select(); document.execCommand('copy'); ta.setAttribute('readonly',''); done(); }
  }
}

function fileToBase64Resized(file, maxSize = 350){
  return new Promise((resolve, reject) => {
    if(!file.type.startsWith('image/')){ reject(new Error('الملف ليس صورة')); return; }
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxSize || h > maxSize){
          if(w > h){ h = Math.round(h * maxSize / w); w = maxSize; }
          else { w = Math.round(w * maxSize / h); h = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const hasAlpha = file.type === 'image/png' || file.type === 'image/svg+xml';
        const mime = hasAlpha ? 'image/png' : 'image/jpeg';
        const quality = hasAlpha ? undefined : 0.85;
        const dataUrl = canvas.toDataURL(mime, quality);
        if(dataUrl.length > 700000){
          const smallCanvas = document.createElement('canvas');
          const ratio = Math.min(1, 200 / Math.max(w, h));
          smallCanvas.width = Math.round(w * ratio);
          smallCanvas.height = Math.round(h * ratio);
          const sctx = smallCanvas.getContext('2d');
          sctx.clearRect(0, 0, smallCanvas.width, smallCanvas.height);
          sctx.drawImage(img, 0, 0, smallCanvas.width, smallCanvas.height);
          resolve(smallCanvas.toDataURL('image/jpeg', 0.8));
        } else {
          resolve(dataUrl);
        }
      };
      img.onerror = () => reject(new Error('فشل تحميل الصورة'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('فشل قراءة الملف'));
    reader.readAsDataURL(file);
  });
}

async function uploadLogo(ev){
  const file = ev.target.files[0];
  if(!file) return;
  showLoader(true);
  try {
    const base64 = await fileToBase64Resized(file, 350);
    await saveMaintenanceSettings({ companyLogo: base64 });
    updatePrintBranding(getCurrentPrintBranch());
    alert('✅ تم رفع اللوجو بنجاح');
    renderPage();
  } catch(e){
    alert('❌ ' + e.message);
  } finally {
    showLoader(false);
    ev.target.value = '';
  }
}

              <div style="font-weight:700">🕐 الشفتات</div>
              <div class="muted" style="font-size:11.5px">حذف الشفتات</div>
              <div class="muted" style="font-size:11px">عدد الإجمالي: <b>${arNum(DB.shifts.length)}</b></div>
            </div>
          </label>

        <button class="btn btn-outline" onclick="previewReset()">👁️ معاينة العدد</button>
        <button class="btn btn-danger" onclick="executeReset()">🗑️ تنفيذ الحذف</button>
      </div>

      <div id="resetPreview" style="margin-top:14px"></div>
    </div>`;
}

function getResetConfig(){
  const branchId = $('resetBranch').value;
  const from = $('resetFrom').value;
  const to = $('resetTo').value;
  const targets = Array.from(document.querySelectorAll('.rs-target:checked')).map(c => c.value);
  return { branchId, from, to, targets };
}

function countResetRecords({ branchId, from, to, targets }){
  const result = {};
  if(targets.includes('daily')){
    result.daily = DB.daily.filter(d => {
      if(branchId && d.branchId !== branchId) return false;
      if(from && d.dateKey < from) return false;
      if(to && d.dateKey > to) return false;
      return true;
    }).length;
  }
  if(targets.includes('punches')){
    result.punches = DB.punches.filter(p => {
      if(branchId && p.branchId !== branchId) return false;
      if(from && p.dateKey < from) return false;
      if(to && p.dateKey > to) return false;
      return true;
    }).length;
  }
  if(targets.includes('employees')){
    result.employees = DB.employees.filter(e => !branchId || e.branchId === branchId).length;
  }
  if(targets.includes('shifts')){
    result.shifts = DB.shifts.filter(s => !branchId || s.branchId === branchId).length;
  }
  return result;
}

function previewReset(){
  const cfg = getResetConfig();
  const el = $('resetPreview');
  if(!cfg.targets.length){
    el.innerHTML = `<div class="alert alert-warning">⚠️ اختر نوع واحد على الأقل من البيانات</div>`;
    return;
  }
  const counts = countResetRecords(cfg);
  const total = Object.values(counts).reduce((s, n) => s + n, 0);
  const branchTxt = cfg.branchId ? `فرع: <b>${esc(branchName(cfg.branchId))}</b>` : 'كل الفروع';
  const periodTxt = (cfg.from || cfg.to) ? ` | من <b>${cfg.from || '—'}</b> إلى <b>${cfg.to || '—'}</b>` : '';
  const labels = { daily:'📅 التسجيل اليومي', punches:'📥 البصمات', employees:'👥 الموظفين', shifts:'🕐 الشفتات' };
  const rowsHtml = Object.entries(counts).map(([k, n]) =>
    `<div style="display:flex;justify-content:space-between;padding:8px 12px;background:#fff;border-radius:8px;margin-bottom:6px;border:1px solid var(--gray-200)">
      <span>${labels[k]}</span>
      <span style="font-weight:700;color:${n > 0 ? 'var(--danger)' : 'var(--gray-500)'}">${arNum(n)} سجل</span>
    </div>`
  ).join('');
  el.innerHTML = `
    <div class="alert alert-info" style="display:block">
      <div style="font-weight:700;margin-bottom:10px">📊 النطاق: ${branchTxt}${periodTxt}</div>
      ${rowsHtml}
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid #bfdbfe;font-weight:700;font-size:14px">
        🗑️ الإجمالي المرشح للحذف: <span style="color:var(--danger)">${arNum(total)} سجل</span>
      </div>
      ${total === 0 ? '<div class="muted" style="margin-top:8px;font-size:12px">⚠️ مفيش بيانات مطابقة للنطاق المحدد</div>' : ''}
    </div>`;
}

async function executeReset(){
  const cfg = getResetConfig();
  if(!cfg.targets.length){ alert('اختر حاجة واحدة على الأقل'); return; }
  const counts = countResetRecords(cfg);
  const total = Object.values(counts).reduce((s, n) => s + n, 0);
  if(!total){ alert('مفيش بيانات مطابقة للحذف'); return; }

  if(cfg.targets.includes('employees') && !cfg.targets.includes('daily') && !cfg.targets.includes('punches')){
    if(!confirm('⚠️ تحذير: هتحذف موظفين بدون حذف تسجيلاتهم وبصماتهم\n\nده هيسيب بيانات orphaned. تحب تختار «التسجيل اليومي» + «البصمات» كمان؟\n\nاضغط Cancel للرجوع.')) return;
  }

  const hasPass = !!DB.settings?.maintenancePasswordHash;
  if(hasPass){
    const p = prompt('🔑 أدخل كلمة مرور الصيانة لتأكيد الحذف:');
    if(!p) return;
    const ph = await hash(p);
    if(ph !== DB.settings.maintenancePasswordHash){
      alert('❌ كلمة المرور غير صحيحة');
      return;
    }
  }

  const labels = { daily:'التسجيل اليومي', punches:'البصمات', employees:'الموظفين', shifts:'الشفتات' };
  const summary = Object.entries(counts).map(([k, n]) => `• ${labels[k]}: ${n}`).join('\n');
  if(!confirm(`⚠️ سيتم حذف نهائي:\n\n${summary}\n\nالإجمالي: ${total}\n\nهل أنت متأكد؟`)) return;
  if(!confirm('🚨 تأكيد أخير — لا يمكن التراجع!\n\nاضغط OK للتنفيذ.')) return;

  showLoader(true);
  try {
    let deletedTotal = 0;
    if(cfg.targets.includes('daily')){
      const c = await fsBatchDel('daily', d => {
        if(cfg.branchId && d.branchId !== cfg.branchId) return false;
        if(cfg.from && d.dateKey < cfg.from) return false;
        if(cfg.to && d.dateKey > cfg.to) return false;
        return true;
      });
      deletedTotal += c;
    }
    if(cfg.targets.includes('punches')){
      const c = await fsBatchDel('punches', p => {
        if(cfg.branchId && p.branchId !== cfg.branchId) return false;
        if(cfg.from && p.dateKey < cfg.from) return false;
        if(cfg.to && p.dateKey > cfg.to) return false;
        return true;
      });
      deletedTotal += c;
    }
    if(cfg.targets.includes('employees')){
      const c = await fsBatchDel('employees', e => !cfg.branchId || e.branchId === cfg.branchId);
      deletedTotal += c;
    }
    if(cfg.targets.includes('shifts')){
      const c = await fsBatchDel('shifts', s => !cfg.branchId || s.branchId === cfg.branchId);
      deletedTotal += c;
    }
    await loadAll();
    alert(`✅ تم الحذف بنجاح\n\nعدد السجلات المحذوفة: ${deletedTotal}`);
    renderPage();
  } catch(e){
    alert('❌ خطأ: ' + e.message);
  } finally {
    showLoader(false);
  }
}

async function submitAddBranch(){
  const name = $('brName').value.trim();
  const user = $('brUser').value.trim();
  const pass = $('brPass').value.trim();
  const mgr = $('brMgr').value.trim() || name;
  const wa = $('brWa').value.trim().replace(/[^\d+]/g,'').replace(/^\+/,'');

  if(!name || !user || !pass){
    alert('❌ أكمل الحقول المطلوبة:\n• اسم الفرع\n• اسم المستخدم\n• كلمة المرور');
    return;
  }
  if(DB.users.some(u => u.username.toLowerCase() === user.toLowerCase())){
    alert('❌ اسم المستخدم مستخدم بالفعل');
    return;
  }

  showLoader(true);
  try {
    const b = await fsAdd('branches', { name, defaultShiftId:'', whatsapp: wa, createdAt: Date.now() });
    await fsAdd('users', { username: user, passwordHash: await hash(pass), role: 'branch', name: mgr, branchId: b.id, createdAt: Date.now() });
    await loadAll();
    closeModal();
    alert(`✅ تم إضافة فرع "${name}" بنجاح`);
    renderPage();
  } catch(e){ alert('❌ ' + e.message); }
  finally { showLoader(false); }
}

    await fsBatchDel('shifts', s => s.branchId === id);

    await fsBatchDel('daily', d => d.branchId === id);
    await loadAll();

  finally { showLoader(false); }

function autoShiftHours(){
  const s = $('shStart').value, e = $('shEnd').value;
  if(!s || !e) return;
  const [sh,sm] = s.split(':').map(Number);
  const [eh,em] = e.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins <= 0) mins += 1440;
  $('shHours').value = (mins/60).toFixed(1).replace(/\.0$/,'');
}
async function addShift(){

  const start = $('shStart').value;
  const end = $('shEnd').value;

  const graceMins = num($('shGrace').value);
  const offDays = Array.from(document.querySelectorAll('.shOff:checked')).map(c => +c.value);
  if(!bId || !name){ alert('أكمل الحقول المطلوبة'); return; }
  showLoader(true);
  try {
    const sh = await fsAdd('shifts', { branchId:bId, name, start, end, hours, graceMins, offDays, createdAt: Date.now() });
    const br = getBranch(bId);
    if(br && !br.defaultShiftId) await fsUpd('branches', bId, { defaultShiftId: sh.id });
    await loadAll();
    renderPage();
  } catch(e){ alert(e.message); }
  finally { showLoader(false); }
}

async function importEmployees(ev){
  const file = ev.target.files[0]; if(!file) return;
  const bId = $('impEmpBranch').value;
  if(!bId){ alert('اختر الفرع'); ev.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = async e => {
    showLoader(true);
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', codepage:1256 });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { raw:false });
      if(!rows.length){ alert('الملف فارغ'); return; }
      const keys = Object.keys(rows[0]);
      const nameKey = keys.find(k => /name|الاسم|اسم/i.test(k));
      const codeKey = keys.find(k => /no\.?|code|id|كود|رقم/i.test(k));
      if(!nameKey || !codeKey){ alert('مطلوب عمودين: اسم + رقم بصمة'); return; }
      const existing = DB.employees.filter(e => e.branchId === bId);
      const items = []; let skipped = 0, dup = 0;
      rows.forEach(r => {
        const name = String(r[nameKey]||'').trim();
        const code = String(r[codeKey]||'').trim();
        if(!name || !code){ skipped++; return; }
        if(existing.some(e => norm(e.code) === norm(code)) || items.some(i => norm(i.code) === norm(code))){ dup++; return; }
        items.push({ branchId:bId, name, code, shiftId:'', active: true, createdAt: Date.now() });
      });
      if(items.length) await fsBatchAdd('employees', items);
      await loadAll();
      alert(`تم استيراد ${items.length} موظف\n(مكرر: ${dup} | ناقص: ${skipped})`);
      renderPage();
    } catch(err){ alert(err.message); }
    finally { showLoader(false); ev.target.value = ''; }
  };
  reader.readAsArrayBuffer(file);
}
