function buildDailyWhatsAppText(bId, date){
  const branch = getBranch(bId);
  const emps = DB.employees
    .filter(e => e.branchId === bId && e.active !== false)
    .sort((a,b) => String(a.name||'').localeCompare(String(b.name||''),'ar'));

  const dailyMap = {};
  DB.daily.forEach(d => { if(d.dateKey === date && d.branchId === bId) dailyMap[d.empId] = d; });

  const punchMap = {};
  DB.punches.forEach(p => {
    if(p.dateKey === date && p.branchId === bId){
      (punchMap[p.empId] = punchMap[p.empId] || []).push(p);
    }
  });

  let present = 0, absent = 0, leave = 0, mission = 0, incomplete = 0;
  const lines = [];

  emps.forEach(e => {
    const rec = dailyMap[e.id] || null;
    const punches = punchMap[e.id] || [];
    const day = calcDay(e, date, rec, punches, bId);

    if(day.status === 'غياب') absent++;
    else if(day.status === 'أجازة') leave++;
    else if(day.status === 'مهمة') mission++;
    else if(day.status === 'بصمة ناقصة') incomplete++;
    else present++;

    let line = e.name;
    if(!NON_PRESENT.includes(day.status) && day.timeIn && day.timeOut){
      line += `\n     🕐 دخول: ${arTime(day.timeIn)}  ←  خروج: ${arTime(day.timeOut)}`;
    } else {
      line += `\n     📌 ${day.status}`;
    }
    lines.push(line);
  });

  let txt = `━━━━━━━━━━━━━━━━━━\n`;
  txt += `🏢 الفرع: ${branch?.name || '—'}\n`;
  txt += `📅 التاريخ: ${fmtDateArFull(date)}\n`;
  if(isHoliday(date)) txt += `🎉 ${getHoliday(date).name}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `👥 إجمالي الموظفين: ${arNum(emps.length)}\n`;
  txt += `✅ حاضر: ${arNum(present)}\n`;
  if(absent)     txt += `❌ غائب: ${arNum(absent)}\n`;
  if(leave)      txt += `🏖️ أجازة: ${arNum(leave)}\n`;
  if(mission)    txt += `🎯 مهمة: ${arNum(mission)}\n`;
  if(incomplete) txt += `⚠️ بصمة ناقصة: ${arNum(incomplete)}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `📋 تفاصيل الموظفين:\n\n`;
  txt += lines.length ? lines.join('\n\n') : 'لا يوجد موظفون';
  txt += `\n━━━━━━━━━━━━━━━━━━`;
  return txt;
}

function buildReportWhatsAppText(){
  if(!lastReport || !lastReport.rows.length) return '';
  const { rows, branchId, from, to } = lastReport;
  let gP=0, gA=0, gL=0, gM=0, gI=0;
  rows.forEach(r => {
    gP += r.totals.present; gA += r.totals.absent;
    gL += r.totals.leave; gM += r.totals.mission; gI += r.totals.incomplete;
  });
  const period = `${from ? fmtDateArFull(from) : 'البداية'} ← ${to ? fmtDateArFull(to) : 'الآن'}`;
  let txt = `━━━━━━━━━━━━━━━━━━\n`;
  txt += `🏢 الفرع: ${branchName(branchId)}\n`;
  txt += `📅 الفترة: ${period}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `👥 عدد الموظفين: ${arNum(rows.length)}\n`;
  txt += `✅ إجمالي الحضور: ${arNum(gP)}\n`;
  if(gA)  txt += `❌ إجمالي الغياب: ${arNum(gA)}\n`;
  if(gL)  txt += `🏖️ إجمالي الأجازات: ${arNum(gL)}\n`;
  if(gM)  txt += `🎯 إجمالي المهام: ${arNum(gM)}\n`;
  if(gI)  txt += `⚠️ بصمة ناقصة: ${arNum(gI)}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `📋 تفاصيل الموظفين:\n\n`;
  const lines = rows.map(r => {
    const t = r.totals;
    let line = r.emp.name;
    line += `\n     📅 أيام: ${arNum(t.days)}  |  ✅ حضور: ${arNum(t.present)}  |  ❌ غياب: ${arNum(t.absent)}`;
    if(t.leave)   line += `  |  🏖️ أجازة: ${arNum(t.leave)}`;
    if(t.mission) line += `  |  🎯 مهمة: ${arNum(t.mission)}`;
    return line;
  });
  txt += lines.length ? lines.join('\n\n') : 'لا توجد بيانات';
  txt += `\n━━━━━━━━━━━━━━━━━━`;
  return txt;
}

function buildEmployeeWhatsAppText(){
  if(!lastEmpReport) return '';
  const { emp, from, to, branchStats, grand } = lastEmpReport;
  const period = `${from ? fmtDateArFull(from) : 'البداية'} ← ${to ? fmtDateArFull(to) : 'الآن'}`;
  let txt = `━━━━━━━━━━━━━━━━━━\n`;
  txt += `👤 الاسم: ${emp.name}\n`;
  txt += `🔢 رقم البصمة: ${arNum(emp.code)}\n`;
  txt += `🏢 الفرع: ${branchName(emp.branchId)}\n`;
  txt += `📅 الفترة: ${period}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `📊 الإجمالي:\n`;
  txt += `📅 عدد الأيام: ${arNum(grand.days)}\n`;
  txt += `✅ حضور: ${arNum(grand.present)}\n`;
  if(grand.absent)     txt += `❌ غياب: ${arNum(grand.absent)}\n`;
  if(grand.leave)      txt += `🏖️ أجازة: ${arNum(grand.leave)}\n`;
  if(grand.mission)    txt += `🎯 مهمة: ${arNum(grand.mission)}\n`;
  if(grand.incomplete) txt += `⚠️ بصمة ناقصة: ${arNum(grand.incomplete)}\n`;

  // HR summary للموظف
  const hrSum = getEmpHrSummary(emp.id, from, to);
  if(hrSum.advanceCount || hrSum.penaltyCount || hrSum.leaveCount){
    txt += `━━━━━━━━━━━━━━━━━━\n`;
    txt += `💼 حركات الموظف:\n`;
    if(hrSum.advanceCount) txt += `💰 سلف: ${arNum(hrSum.advanceTotal.toLocaleString('en-US'))} ج.م (${arNum(hrSum.advanceCount)})\n`;
    if(hrSum.penaltyCount) txt += `⚖️ جزاءات: ${arNum(hrSum.penaltyTotal.toLocaleString('en-US'))} ج.م (${arNum(hrSum.penaltyCount)})\n`;
    if(hrSum.leaveCount)   txt += `🏖️ أجازات: ${arNum(hrSum.leaveDays)} يوم (${arNum(hrSum.leaveCount)} فترة)\n`;
  }

  const history = emp.transferHistory || [];
  if(history.length){
    txt += `━━━━━━━━━━━━━━━━━━\n`;
    txt += `🔄 سجل التنقلات:\n`;
    history.forEach(h => {
      txt += `• ${h.fromName} ← ${h.toName} — ${fmtDateArFull(h.date)}${h.reason ? ' (' + h.reason + ')' : ''}\n`;
    });
  }
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `📋 التفاصيل اليومية:\n\n`;
  const lines = [];
  branchStats.forEach(b => {
    lines.push(`🏢 ${b.branchName}  (${fmtDateArFull(b.firstDate)} ← ${fmtDateArFull(b.lastDate)})`);
    b.days.forEach(d => {
      let line = `${d.dateKey}`;
      if(!NON_PRESENT.includes(d.status) && d.timeIn && d.timeOut){
        line += `\n     🕐 دخول: ${arTime(d.timeIn)}  ←  خروج: ${arTime(d.timeOut)}`;
      } else {
        line += `\n     📌 ${d.status}`;
      }
      lines.push(line);
    });
    lines.push('');
  });
  txt += lines.length ? lines.join('\n') : 'لا توجد سجلات';
  txt += `\n━━━━━━━━━━━━━━━━━━`;
  return txt;
}

function buildCompareWhatsAppText(){
  if(!lastComparison || !lastComparison.rows.length) return '';
  const { rows, summary, branchId, from, to } = lastComparison;
  const period = `${from ? fmtDateArFull(from) : 'البداية'} ← ${to ? fmtDateArFull(to) : 'الآن'}`;
  let txt = `━━━━━━━━━━━━━━━━━━\n`;
  txt += `🔍 تقرير المقارنة\n`;
  txt += `🏢 الفرع: ${branchName(branchId)}\n`;
  txt += `📅 الفترة: ${period}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `📊 الملخص:\n`;
  txt += `✅ مطابق: ${arNum(summary.match)}\n`;
  txt += `⚠️ فروقات: ${arNum(summary.warn)}\n`;
  txt += `❌ تناقضات: ${arNum(summary.error)}\n`;
  if(summary.pending) txt += `📭 معلّق: ${arNum(summary.pending)}\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  const issues = rows.filter(r => r.level === 'error' || r.level === 'warn');
  if(!issues.length){
    txt += `🎉 لا توجد فروقات — كل حاجة مطابقة\n`;
  } else {
    txt += `⚠️ الفروقات والتناقضات:\n\n`;
    const lines = issues.slice(0, 60).map(r => {
      let line = `${r.empName} — ${r.dateKey}`;
      line += `\n     📌 ${r.issues.join(' | ')}`;
      if(r.branchIn || r.branchOut){
        line += `\n     🏢 الفرع: ${arTime(r.branchIn) || '—'} ← ${arTime(r.branchOut) || '—'}`;
        if(r.branchNetMins !== null) line += ` (صافي ${fmtMinsAr(r.branchNetMins)})`;
      } else if(r.branchStatus !== 'present'){
        line += `\n     🏢 الفرع: ${STATUS[r.branchStatus] || r.branchStatus}`;
      }
      if(r.hasPunch){
        line += `\n     📥 البصمة: ${arTime(r.punchIn) || '—'} ← ${arTime(r.punchOut) || '—'}`;
        if(r.punchMins !== null) line += ` (${fmtMinsAr(r.punchMins)})`;
      }
      return line;
    });
    txt += lines.join('\n\n');
    if(issues.length > 60) txt += `\n\n... و${arNum(issues.length - 60)} صف إضافي`;
  }
  txt += `\n━━━━━━━━━━━━━━━━━━`;
  return txt;
}

function openWhatsAppShare(text, title){
  if(!text){ alert('لا يوجد محتوى لمشاركته'); return; }
  let defaultPhone = '';
  const bid = UI.dailyBranch || UI.hrBranch || UI.cmpBranch;
  if(bid){
    const b = getBranch(bid);
    if(b?.whatsapp) defaultPhone = b.whatsapp;
  } else if(currentUser?.branchId){
    const b = getBranch(currentUser.branchId);
    if(b?.whatsapp) defaultPhone = b.whatsapp;
  }

  showModal(`
    <div class="modal-header">📤 إرسال عبر واتساب</div>
    <div class="field" style="margin-bottom:12px">
      <label>رقم الواتساب (اختياري)</label>
      <input id="waPhone" type="tel" dir="ltr" style="text-align:left"
        placeholder="مثال: 201012345678" value="${esc(defaultPhone)}">
    </div>
    <div class="field" style="margin-bottom:12px">
      <label>📄 معاينة الرسالة (${esc(title)})</label>
      <textarea id="waText" class="wa-preview" readonly>${esc(text)}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-whatsapp" onclick="sendWhatsApp()">📱 فتح واتساب</button>
      <button class="btn btn-outline" onclick="copyWhatsAppText()">📋 نسخ النص</button>
      <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}

function sendWhatsApp(){
  const text = $('waText')?.value || '';
  if(!text){ alert('لا يوجد نص'); return; }
  let phone = ($('waPhone')?.value || '').trim().replace(/[^\d+]/g, '');
  phone = phone.replace(/^\+/, '').replace(/^0+/, '');
  if(!phone && navigator.share){
    navigator.share({ text, title: 'تقرير الحضور' })
      .then(() => closeModal())
      .catch(err => {
        if(err.name !== 'AbortError'){
          const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
          window.open(url, '_blank');
        }
      });
    return;
  }
  const encoded = encodeURIComponent(text);
  const url = phone ? `https://wa.me/${phone}?text=${encoded}` : `https://wa.me/?text=${encoded}`;
  window.open(url, '_blank');
  closeModal();
}

function copyWhatsAppText(){
  const text = $('waText')?.value || '';
  if(!text) return;
  const done = () => {
    const btn = document.querySelector('.modal-actions button:nth-child(2)');
    if(btn){
      const old = btn.textContent;
      btn.textContent = '✅ تم النسخ';
      setTimeout(() => { btn.textContent = old; }, 1500);
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => {
      const ta = $('waText');
      if(ta){ ta.removeAttribute('readonly'); ta.select(); document.execCommand('copy'); ta.setAttribute('readonly',''); done(); }
    });
  } else {
    const ta = $('waText');
    if(ta){ ta.removeAttribute('readonly'); ta.select(); document.execCommand('copy'); ta.setAttribute('readonly',''); done(); }
  }
}

  if(!bId){ alert('اختر الفرع'); return; }
  UI.dailyBranch = bId;
  const text = buildDailyWhatsAppText(bId, date);
  openWhatsAppShare(text, `تقرير ${getBranch(bId)?.name || ''} - ${date}`);
}

}
