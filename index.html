<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام البصمة متعدد الفروع</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#eef2f7;margin:0;color:#22303f}
  .topbar{background:linear-gradient(135deg,#1a365d,#2b6cb0);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .brand{font-size:17px;font-weight:bold}
  .userbox{display:flex;align-items:center;gap:12px;font-size:13px}
  .container{max-width:1350px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:16px}
  h2{font-size:18px;color:#1a365d;margin:0 0 12px}
  h3{font-size:15px;color:#2b6cb0;margin:0 0 10px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .tab{background:#fff;border:1px solid #cbd5e0;color:#2c5282;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600}
  .tab:hover{background:#ebf8ff}
  .tab.active{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
  .btn{background:#2b6cb0;color:#fff;border:none;padding:8px 16px;border-radius:7px;font-size:13.5px;cursor:pointer;font-weight:bold}
  .btn:hover{filter:brightness(1.1)}
  .btn-success{background:#38a169}
  .btn-warn{background:#dd6b20}
  .btn-danger{background:#e53e3e}
  .btn-ghost{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4)}
  .btn-sm{padding:4px 10px;font-size:11.5px;border-radius:5px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;font-weight:bold;color:#2c5282}
  input,select,textarea{padding:7px 10px;border:1px solid #cbd5e0;border-radius:6px;font-size:13px;font-family:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#4299e1}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
  th,td{border:1px solid #e2e8f0;padding:7px;text-align:center;vertical-align:middle}
  th{background:#2b6cb0;color:#fff;font-weight:600;font-size:12px}
  tbody tr:nth-child(even){background:#f7fafc}
  tbody tr:hover{background:#ebf8ff}
  .badge{padding:2px 8px;border-radius:5px;font-weight:bold;font-size:11px;display:inline-block}
  .b-green{background:#c6f6d5;color:#22543d}
  .b-red{background:#fed7d7;color:#9b2c2c}
  .b-orange{background:#feebc8;color:#c05621}
  .b-blue{background:#bee3f8;color:#2c5282}
  .b-gray{background:#e2e8f0;color:#4a5568}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .stat-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px}
  .stat-card h3{font-size:13.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #e2e8f0}
  .stat-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:#4a5568}
  .stat-row b{color:#1a365d}
  .emp-card{background:#fff;border:1px solid #cbd5e0;border-radius:10px;padding:16px;margin-bottom:16px}
  .emp-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #e2e8f0;padding-bottom:10px;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  .emp-title{font-size:15px;font-weight:bold;color:#2b6cb0}
  .emp-summary{display:flex;gap:14px;font-size:12.5px;font-weight:600;background:#f7fafc;padding:8px 12px;border-radius:7px;flex-wrap:wrap;margin-bottom:10px}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a365d,#2b6cb0);padding:20px}
  .login-card{background:#fff;padding:32px;border-radius:16px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .login-card h1{text-align:center;color:#1a365d;font-size:21px;margin:0 0 22px}
  .login-card input{width:100%;margin-bottom:12px;padding:11px}
  .login-card .btn{width:100%;padding:12px;font-size:15px}
  .hint{text-align:center;font-size:11.5px;color:#718096;margin-top:12px;background:#f7fafc;padding:8px;border-radius:6px}
  .alert{padding:10px;border-radius:7px;margin-bottom:12px;font-weight:bold;font-size:13px;text-align:center}
  .alert-err{background:#fff5f5;color:#c53030;border:1px solid #fed7d7}
  .alert-ok{background:#f0fff4;color:#22543d;border:1px solid #c6f6d5}
  .alert-info{background:#ebf8ff;color:#2c5282;border:1px solid #bee3f8}
  .upload-area{border:2px dashed #4299e1;border-radius:10px;padding:18px;text-align:center;background:#f7fafc;cursor:pointer;margin-bottom:12px}
  .upload-area:hover{background:#ebf8ff}
  .muted{color:#718096;font-size:12px}
  .empty{text-align:center;color:#a0aec0;padding:30px;font-size:13.5px}
  .scroll-x{overflow-x:auto}
  .loader{text-align:center;padding:40px;color:#2b6cb0;font-size:15px;font-weight:bold;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.95);padding:20px 40px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:2000}
  .daily-table input[type="time"],
  .daily-table input[type="text"]{padding:4px 6px;font-size:12px;width:100%}
  .daily-table select{padding:4px 6px;font-size:12px}
  .daily-table th{white-space:nowrap}
  .branch-header{background:linear-gradient(135deg,#1a365d,#2b6cb0);color:#fff;padding:16px;margin-top:20px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .mini-dash{background:#fff;border-radius:10px;padding:10px 16px;margin-bottom:14px;display:flex;gap:18px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.04);font-size:13px;align-items:center;border:1px solid #e2e8f0}
  .mini-dash span{display:flex;align-items:center;gap:5px}
  .mini-dash b{color:#1a365d;font-size:14px}
  .row-saving{background:#fffbeb !important;transition:background .2s}
  .row-saved{background:#f0fff4 !important;transition:background .3s}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1500;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal-box{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:480px;box-shadow:0 25px 60px rgba(0,0,0,.35);max-height:90vh;overflow-y:auto}
  .modal-box h2{color:#1a365d;margin-bottom:16px;font-size:18px}
  .modal-actions{display:flex;gap:10px;margin-top:16px}
  .modal-actions .btn{flex:1}
  .date-nav{display:flex;gap:4px;margin-top:4px}
  .date-nav button{padding:6px 10px;font-size:12px;border:1px solid #cbd5e0;background:#fff;border-radius:5px;cursor:pointer;font-weight:bold;color:#2c5282}
  .date-nav button.active{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
  .date-nav button:hover{background:#ebf8ff}
  @media(max-width:700px){
    .row{flex-direction:column;align-items:stretch}
    .field{width:100%}
    input,select{width:100%}
    .container{padding:10px}
    .tabs{gap:4px}
    .tab{padding:6px 10px;font-size:12px}
    .userbox{font-size:12px}
    table{font-size:11.5px}
    th,td{padding:5px}
    .daily-table input[type="time"]{min-width:80px}
    .grid{grid-template-columns:1fr 1fr}
  }
  @media print{
    body{background:#fff}
    .topbar,.tabs,.mini-dash,.btn,.row .btn,.modal-backdrop{display:none !important}
    .card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}
    .emp-card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid;margin-bottom:12px}
    .branch-header{background:#1a365d !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .container{max-width:100%;padding:0}
    h2{font-size:14px}
    table{font-size:10px}
    th,td{padding:3px 4px}
    .no-print{display:none !important}
  }
</style>
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-card">
    <h1 id="loginTitle">⏱️ نظام البصمة</h1>
    <div id="setupNote" style="display:none" class="alert alert-info">🎉 أول تشغيل — أنشئ حساب المدير الرئيسي</div>
    <input id="loginUser" placeholder="اسم المستخدم" autocomplete="username">
    <input id="loginPass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
    <input id="loginName" placeholder="الاسم الكامل (للمدير فقط)" style="display:none">
    <button class="btn" id="loginBtn" onclick="doLogin()">🔐 دخول</button>
    <div id="loginErr" class="alert alert-err" style="display:none;margin-top:14px"></div>
    <div class="hint" id="loginHint">اتصل بالمدير للحصول على بيانات الدخول</div>
  </div>
</div>

<div id="appView" style="display:none">
  <div class="topbar">
    <div class="brand">⏱️ نظام البصمة متعدد الفروع</div>
    <div class="userbox">
      <span id="userInfo"></span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">🚪 خروج</button>
    </div>
  </div>
  <div class="container">
    <div id="miniDash" class="mini-dash" style="display:none"></div>
    <div class="tabs" id="tabsNav"></div>
    <div id="tabContent"></div>
  </div>
</div>

<!-- Modal: تسجيل إذن -->
<div id="permModal" class="modal-backdrop" style="display:none">
  <div class="modal-box">
    <h2>📝 تسجيل إذن</h2>
    <input type="hidden" id="pmEmpId">
    <input type="hidden" id="pmDateVal">
    <div class="field" style="margin-bottom:10px">
      <label>العامل</label>
      <input id="pmEmpName" disabled style="background:#f7fafc">
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>نوع الإذن</label>
      <select id="pmType" onchange="togglePermModalTimes()">
        <option value="late">إذن تأخير</option>
        <option value="early">إذن انصراف مبكر</option>
        <option value="mid">إذن خلال العمل</option>
        <option value="mission">مهمة خارجية</option>
        <option value="leave">أجازة يوم كامل</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:10px" id="pmTimesRow">
      <div class="field" style="flex:1">
        <label>من</label>
        <input type="time" id="pmFrom" value="09:00">
      </div>
      <div class="field" style="flex:1">
        <label>إلى</label>
        <input type="time" id="pmTo" value="11:00">
      </div>
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>ملاحظات</label>
      <input id="pmReason" placeholder="اختياري">
    </div>
    <div id="pmExisting"></div>
    <div class="modal-actions">
      <button class="btn btn-success" onclick="savePermFromModal()">💾 حفظ الإذن</button>
      <button class="btn" onclick="closePermModal()">❌ إلغاء</button>
    </div>
  </div>
</div>

<div id="globalLoader" class="loader" style="display:none">⏳ جاري التحميل...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getFirestore, collection, doc, getDocs,
  addDoc, updateDoc, deleteDoc, writeBatch
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBla94ZCx9oaTMm1-tmehyVx-Pyn-_zz3g",
  authDomain: "attendance-system-403c3.firebaseapp.com",
  projectId: "attendance-system-403c3",
  storageBucket: "attendance-system-403c3.firebasestorage.app",
  messagingSenderId: "241577979833",
  appId: "1:241577979833:web:af35ec638772254e95d068"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let DB = { branches:[], users:[], shifts:[], employees:[], permissions:[], punches:[], unmatched:[], dailyEntries:[] };
let currentUser = null;
let activeTab = 'overview';
let UI = {
  empBranch:'all', shiftBranch:'all',
  repBranch:'', repEmp:'all', repFrom:'', repTo:'', repViewMode:'detailed',
  dailyBranch:'', dailyDate: new Date().toISOString().slice(0,10), dailySearch:''
};
let importMsg = null;
let empImportMsg = null;
let lastReport = null;

const dayNamesAr = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const PERM_TYPES = {
  late:'إذن تأخير', early:'إذن انصراف مبكر', mid:'إذن خلال العمل',
  mission:'مهمة خارجية', leave:'أجازة يوم كامل'
};
const STATUS_TYPES = { present:'حاضر', absent:'غائب', leave:'أجازة', mission:'مهمة' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s==null?'':s).trim().toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,''); }
function showLoader(show){ document.getElementById('globalLoader').style.display = show ? 'block' : 'none'; }
async function hashPass(pass){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pass));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function formatMinsToText(totalMinutes){
  const n = Math.round(totalMinutes || 0);
  const abs = Math.abs(n);
  if(abs === 0) return '0 دقيقة';
  const hrs = Math.floor(abs/60), mins = abs%60;
  let t = '';
  if(hrs > 0 && mins > 0) t = `${hrs} ساعة و ${mins} دقيقة`;
  else if(hrs > 0) t = `${hrs} ساعة`;
  else t = `${mins} دقيقة`;
  return n < 0 ? `- ${t}` : t;
}
function parseCustomDate(dtStr){
  if(!dtStr) return null;
  let s = String(dtStr).trim();
  const isPM = s.includes('م') || s.toUpperCase().includes('PM');
  const isAM = s.includes('ص') || s.toUpperCase().includes('AM');
  s = s.replace(/[صم]/g,'').trim();
  const parts = s.split(/\s+/);
  if(parts.length >= 2){
    const dp = parts[0].split(/[\/\-\.]/);
    const tp = parts[1].split(':');
    if(dp.length === 3 && tp.length >= 2){
      let day = parseInt(dp[0],10), month = parseInt(dp[1],10)-1, year = parseInt(dp[2],10);
      if(year < 100) year += 2000;
      let hour = parseInt(tp[0],10), minute = parseInt(tp[1],10), sec = tp[2]?parseInt(tp[2],10):0;
      if(isPM && hour < 12) hour += 12;
      else if(isAM && hour === 12) hour = 0;
      const d = new Date(year, month, day, hour, minute, sec);
      if(!isNaN(d.getTime())) return d;
    }
  }
  const sd = new Date(s);
  return isNaN(sd.getTime()) ? null : sd;
}
function dtAt(dateKey, timeStr){
  const [y,m,d] = dateKey.split('-').map(Number);
  const [hh,mm] = String(timeStr||'00:00').split(':').map(Number);
  return new Date(y, m-1, d, hh||0, mm||0, 0, 0);
}
function dayNameOf(dateKey){ return dayNamesAr[new Date(dateKey+'T00:00:00').getDay()]; }
function overlapMs(a1,a2,b1,b2){ return Math.max(0, Math.min(a2,b2) - Math.max(a1,b1)); }
function fmtTimeMs(ms){ return new Date(ms).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',hour12:true}); }
function fmtTimeHM(ms){ const d = new Date(ms); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function statusBadge(st){
  const map = {'منتظم':'b-green','تأخير':'b-red','عجز':'b-orange','بصمة ناقصة':'b-orange','أجازة':'b-blue','غياب':'b-gray','راحة':'b-gray','مهمة':'b-blue'};
  return `<span class="badge ${map[st]||'b-gray'}">${st}</span>`;
}
function getShiftFor(emp){ return DB.shifts.find(s => s.id === emp.shiftId) || null; }
function getBranch(id){ return DB.branches.find(b => b.id === id); }
function branchName(id){ const b = getBranch(id); return b ? b.name : '—'; }
function getBranchDefaultShift(branchId){
  const b = getBranch(branchId);
  return b && b.defaultShiftId ? DB.shifts.find(s => s.id === b.defaultShiftId) : null;
}

async function fsGetAll(name){
  const snap = await getDocs(collection(db, name));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function fsAdd(name, data){
  const ref = await addDoc(collection(db, name), data);
  return { id: ref.id, ...data };
}
async function fsUpdate(name, id, data){ await updateDoc(doc(db, name, id), data); }
async function fsDelete(name, id){ await deleteDoc(doc(db, name, id)); }
async function fsBatchDelete(name, filterFn){
  const snap = await getDocs(collection(db, name));
  const batch = writeBatch(db);
  let cnt = 0;
  snap.docs.forEach(d => { if(filterFn({id:d.id, ...d.data()})){ batch.delete(d.ref); cnt++; } });
  if(cnt) await batch.commit();
}
async function fsBatchAdd(name, items){
  const CHUNK = 450;
  for(let i=0; i<items.length; i+=CHUNK){
    const batch = writeBatch(db);
    items.slice(i, i+CHUNK).forEach(it => {
      const ref = doc(collection(db, name));
      batch.set(ref, it);
    });
    await batch.commit();
  }
}

async function loadAllData(){
  showLoader(true);
  const [br, us, sh, em, pm, pu, un, de] = await Promise.all([
    fsGetAll('branches'), fsGetAll('users'), fsGetAll('shifts'),
    fsGetAll('employees'), fsGetAll('permissions'), fsGetAll('punches'),
    fsGetAll('unmatched'), fsGetAll('dailyEntries')
  ]);
  DB.branches = br; DB.users = us; DB.shifts = sh;
  DB.employees = em; DB.permissions = pm; DB.punches = pu;
  DB.unmatched = un; DB.dailyEntries = de;
  showLoader(false);
}

async function checkSetup(){
  showLoader(true);
  const users = await fsGetAll('users');
  showLoader(false);
  const setupNote = document.getElementById('setupNote');
  const nameField = document.getElementById('loginName');
  const loginBtn = document.getElementById('loginBtn');
  const loginTitle = document.getElementById('loginTitle');
  const loginHint = document.getElementById('loginHint');
  if(users.length === 0){
    setupNote.style.display = 'block';
    nameField.style.display = 'block';
    loginTitle.textContent = '🎉 إنشاء حساب المدير';
    loginBtn.textContent = '✨ إنشاء المدير والدخول';
    loginHint.textContent = 'اختر اسم مستخدم وكلمة مرور قوية للمدير الرئيسي';
    window.__setupMode = true;
  } else {
    setupNote.style.display = 'none';
    nameField.style.display = 'none';
    loginTitle.textContent = '⏱️ نظام البصمة';
    loginBtn.textContent = '🔐 دخول';
    loginHint.textContent = 'اتصل بالمدير للحصول على بيانات الدخول';
    window.__setupMode = false;
  }
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('appView').style.display = 'none';
}

async function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  err.style.display = 'none';
  if(!u || !p){ err.style.display = 'block'; err.textContent = '❌ أدخل اسم المستخدم وكلمة المرور'; return; }
  showLoader(true);
  try {
    if(window.__setupMode){
      const name = document.getElementById('loginName').value.trim() || u;
      const hash = await hashPass(p);
      const user = await fsAdd('users', { username: u, passwordHash: hash, role: 'admin', name, branchId: null, createdAt: Date.now() });
      currentUser = user;
      sessionStorage.setItem('att_user_id', user.id);
      await loadAllData();
      enterApp();
      return;
    }
    const users = await fsGetAll('users');
    const hash = await hashPass(p);
    const user = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.passwordHash === hash);
    if(!user){ err.style.display = 'block'; err.textContent = '❌ اسم المستخدم أو كلمة المرور غير صحيحة'; showLoader(false); return; }
    currentUser = user;
    sessionStorage.setItem('att_user_id', user.id);
    await loadAllData();
    enterApp();
  } catch(e){
    console.error(e);
    err.style.display = 'block';
    err.textContent = '❌ ' + e.message;
    showLoader(false);
  }
}

function doLogout(){
  currentUser = null;
  sessionStorage.removeItem('att_user_id');
  document.getElementById('appView').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('loginPass').value = '';
  checkSetup();
}

function enterApp(){
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  const roleTxt = currentUser.role === 'admin' ? 'مدير النظام' : ('فرع: ' + branchName(currentUser.branchId));
  document.getElementById('userInfo').innerHTML = `👤 <b>${esc(currentUser.name)}</b> — ${esc(roleTxt)}`;
  const allowed = currentUser.role === 'admin'
    ? ['overview','daily','branches','employees','shifts','files','reports']
    : ['overview','daily','employees','shifts','reports'];
  if(!allowed.includes(activeTab)) activeTab = 'overview';
  renderTab();
}

  {id:'overview',label:'📊 لوحة التحكم'},
  {id:'daily',label:'📅 التسجيل اليومي'},
  {id:'branches',label:'🏢 الفروع'},
  {id:'employees',label:'👥 العمال'},
  {id:'shifts',label:'🕐 الشفتات'},
  {id:'files',label:'📥 رفع الملفات'},
  {id:'reports',label:'📈 التقارير'}
];
const TABS_BRANCH = [
  {id:'overview',label:'📊 لوحة التحكم'},
  {id:'daily',label:'📅 التسجيل اليومي'},
  {id:'employees',label:'👥 العمال'},
  {id:'shifts',label:'🕐 الشفتات'},
  {id:'reports',label:'📈 التقارير'}
];
function switchTab(id){ activeTab = id; importMsg = null; empImportMsg = null; renderTab(); window.scrollTo({top:0, behavior:'smooth'}); }

function renderTab(){
  const tabs = currentUser.role === 'admin' ? TABS_ADMIN : TABS_BRANCH;
  document.getElementById('tabsNav').innerHTML = tabs.map(t =>
    `<button class="tab ${t.id===activeTab?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
  renderMiniDash();
  let html = '';
  switch(activeTab){
    case 'overview':    html = viewOverview(); break;
    case 'daily':       html = viewDaily(); break;
    case 'branches':    html = viewBranches(); break;
    case 'employees':   html = viewEmployees(); break;
    case 'shifts':      html = viewShifts(); break;
    case 'files':       html = viewFiles(); break;
    case 'reports':     html = viewReports(); break;
  }
  document.getElementById('tabContent').innerHTML = html;
  afterRender();
}
function afterRender(){
  ['empBranch','shiftBranch','repBranch','repEmp','dailyBranch','empImportBranch'].forEach(id=>{
    const el = document.getElementById(id);
    if(el && UI[id] !== undefined) el.value = UI[id];
  });
  const f = document.getElementById('repFrom'); if(f) f.value = UI.repFrom;
  const t = document.getElementById('repTo');   if(t) t.value = UI.repTo;
  const s = document.getElementById('dailySearch'); if(s) s.value = UI.dailySearch || '';
  if(document.getElementById('empBranchAdd')) loadShiftSelectForAdd();
}

function renderMiniDash(){
  const el = document.getElementById('miniDash');
  if(!el) return;
  const bId = currentUser.role === 'admin' ? (UI.dailyBranch || (DB.branches[0] && DB.branches[0].id)) : currentUser.branchId;
  if(!bId || !getBranch(bId)){ el.style.display = 'none'; return; }
  el.style.display = 'flex';
  const today = new Date().toISOString().slice(0,10);
  const emps = DB.employees.filter(e => e.branchId === bId);
  const todayEntries = DB.dailyEntries.filter(d => d.branchId === bId && d.dateKey === today);
  const dates = DB.punches.filter(p => p.branchId === bId).map(p => p.dateKey).sort();
  const lastPunch = dates.length ? dates[dates.length-1] : '—';
  const dayName = dayNamesAr[new Date(today+'T00:00:00').getDay()];
  el.innerHTML = `
    <span>🏢 <b>${esc(branchName(bId))}</b></span>
    <span>📅 <b>${dayName} ${today}</b></span>
    <span>👥 عمال: <b>${emps.length}</b></span>
    <span>✅ سجلوا اليوم: <b style="color:#38a169">${todayEntries.length}</b></span>
    <span>⏳ باقي: <b style="color:#dd6b20">${Math.max(0, emps.length - todayEntries.length)}</b></span>

/* =========================================================
   التسجيل اليومي — مع بحث + حفظ تلقائي + نسخ من الأمس
   ========================================================= */
function viewDaily(){
  const isAdmin = currentUser.role === 'admin';
  const selectedDate = UI.dailyDate || new Date().toISOString().slice(0,10);
  UI.dailyDate = selectedDate;
  if(!isAdmin) UI.dailyBranch = currentUser.branchId;
  const filterB = isAdmin ? (UI.dailyBranch || '') : currentUser.branchId;

  const branchField = isAdmin
    ? `<div class="field"><label>الفرع</label>
        <select id="dailyBranch" onchange="UI.dailyBranch=this.value;renderTab()">
          <option value="">— اختر الفرع —</option>
          ${DB.branches.map(b=>`<option value="${b.id}" ${UI.dailyBranch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}
        </select></div>` : '';

  // Quick date nav
  const today = new Date().toISOString().slice(0,10);
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  const t = new Date(); t.setDate(t.getDate()+1);
  const tomorrow = t.toISOString().slice(0,10);

  const dateNav = `<div class="field"><label>التاريخ</label>
    <input type="date" id="dailyDate" value="${selectedDate}" onchange="UI.dailyDate=this.value;renderTab()">
    <div class="date-nav">
      <button class="${selectedDate===yesterday?'active':''}" onclick="UI.dailyDate='${yesterday}';renderTab()">أمس</button>
      <button class="${selectedDate===today?'active':''}" onclick="UI.dailyDate='${today}';renderTab()">اليوم</button>
      <button class="${selectedDate===tomorrow?'active':''}" onclick="UI.dailyDate='${tomorrow}';renderTab()">غداً</button>
    </div>
  </div>`;

  if(!filterB){
    return `<div class="card"><h2>📅 التسجيل اليومي</h2><div class="row">${branchField}${dateNav}</div><div class="empty">اختر الفرع</div></div>`;
  }

  const emps = DB.employees.filter(e => e.branchId === filterB).sort((a,b)=> a.name.localeCompare(b.name,'ar'));
  const punchesByEmp = {};
  DB.punches.forEach(p=>{
    if(p.branchId !== filterB || p.dateKey !== selectedDate) return;
    (punchesByEmp[p.empId] = punchesByEmp[p.empId] || []).push(p);
  });
  const dailyByEmp = {};
  DB.dailyEntries.forEach(d=>{
    if(d.dateKey === selectedDate && d.branchId === filterB) dailyByEmp[d.empId] = d;
  });
  const permsByEmp = {};
  DB.permissions.forEach(p=>{
    if(p.date === selectedDate && p.branchId === filterB)
      (permsByEmp[p.empId] = permsByEmp[p.empId] || []).push(p);
  });

  const defaultShift = getBranchDefaultShift(filterB);
  let savedCount = 0;
  const rows = emps.map(e=>{
    const daily = dailyByEmp[e.id] || {};
    const punches = punchesByEmp[e.id] || [];
    const perms = permsByEmp[e.id] || [];
    if(dailyByEmp[e.id]) savedCount++;

    let autoIn = '', autoOut = '';
    if(punches.length){
      const sorted = punches.slice().sort((a,b)=> a.timeMs - b.timeMs);
      const cin = sorted.find(p=>/c\s*\/?\s*in/i.test(p.status||'')) || sorted[0];
      const couts = sorted.filter(p=>/c\s*\/?\s*out/i.test(p.status||''));
      const cout = couts.length ? couts[couts.length-1] : (sorted.length>1 ? sorted[sorted.length-1] : null);
      if(cin) autoIn = fmtTimeHM(cin.timeMs);
      if(cout && cout !== cin) autoOut = fmtTimeHM(cout.timeMs);
    }

    const manualIn  = daily.manualIn  !== undefined ? daily.manualIn  : autoIn;
    const manualOut = daily.manualOut !== undefined ? daily.manualOut : autoOut;
    const shiftId   = daily.shiftId   || e.shiftId || (defaultShift ? defaultShift.id : '');
    const status    = daily.status    || 'present';
    const notes     = daily.notes     || '';
    const branchShifts = DB.shifts.filter(s => s.branchId === e.branchId);
    const permTxt = perms.length ? perms.map(p => PERM_TYPES[p.type] || p.type).join(' + ') : '—';
    const hasFingerprint = punches.length
      ? `<span class="badge b-green" style="font-size:9.5px">بصمة ✓</span>`
      : `<span class="badge b-gray" style="font-size:9.5px">لا بصمة</span>`;
    const savedBadge = dailyByEmp[e.id] ? `<span class="badge b-blue" style="font-size:9.5px">محفوظ</span>` : '';

    return `<tr data-empid="${e.id}" data-branch="${filterB}" data-date="${selectedDate}">
      <td style="text-align:right;min-width:140px">
        <b>${esc(e.name)}</b><br>
        <span class="muted" style="font-size:10.5px">كود: ${esc(e.code)}</span>
        <div style="margin-top:3px">${hasFingerprint} ${savedBadge}</div>
      </td>
      <td style="min-width:120px">
        <select class="daily-shift" onchange="onDailyFieldChange('${e.id}')">
          <option value="">— بدون —</option>
          ${branchShifts.map(s=>`<option value="${s.id}" ${shiftId===s.id?'selected':''}>${esc(s.name)} (${s.start}-${s.end})</option>`).join('')}
        </select>
      </td>
      <td><input type="time" class="daily-in" value="${manualIn}" onchange="onDailyFieldChange('${e.id}')"></td>
      <td><input type="time" class="daily-out" value="${manualOut}" onchange="onDailyFieldChange('${e.id}')"></td>
      <td>
        <select class="daily-status" onchange="onDailyFieldChange('${e.id}')">
          ${Object.keys(STATUS_TYPES).map(k=>`<option value="${k}" ${status===k?'selected':''}>${STATUS_TYPES[k]}</option>`).join('')}
        </select>
      </td>
      <td style="font-size:11px;min-width:90px">${permTxt}</td>
      <td><input type="text" class="daily-notes" value="${esc(notes)}" placeholder="ملاحظات" style="min-width:100px" onchange="onDailyFieldChange('${e.id}')"></td>
      <td><button class="btn btn-warn btn-sm" onclick="openPermModal('${e.id}','${selectedDate}')">📝 إذن</button></td>
    </tr>`;
  }).join('');

  return `<div class="card">
    <h2>📅 التسجيل اليومي</h2>
    <div class="row">
      ${branchField}
      ${dateNav}
      <div class="field">
        <label>🔍 بحث</label>
        <input type="text" id="dailySearch" placeholder="ابحث بالاسم أو الكود..." value="${esc(UI.dailySearch||'')}" oninput="UI.dailySearch=this.value;filterDailyRows()">
      </div>
      <button class="btn btn-success" onclick="saveAllDaily('${filterB}','${selectedDate}')">💾 حفظ الكل</button>
      <button class="btn" onclick="copyFromYesterday('${filterB}','${selectedDate}')">📋 نسخ من الأمس</button>
      <button class="btn" onclick="loadFingerprintsIntoForm('${filterB}','${selectedDate}')">⬇️ البصمات للحقول</button>
      ${defaultShift ? `<div class="badge b-blue" style="align-self:center">الشفت الافتراضي: ${esc(defaultShift.name)}</div>` : ''}
    </div>
    <div class="alert alert-info" style="font-size:12px">
      💡 <b>الحفظ تلقائي</b> بعد ثانيتين من أي تعديل — وممكن كمان تضغط <b>💾 حفظ الكل</b>. بياناتك هتاخد الأولوية على البصمة.
      ${savedCount ? `<br>📌 <b>${savedCount}</b> عامل مسجل بالفعل في هذا اليوم.` : ''}
    </div>
    ${emps.length ? `<div class="scroll-x daily-table"><table>
      <thead><tr>
        <th>العامل</th><th>الشفت</th><th>الدخول</th><th>الخروج</th><th>الحالة</th><th>الأذونات</th><th>ملاحظات</th><th>إجراء</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>` : '<div class="empty">لا يوجد عمال. أضف أو استورد عمال أولاً.</div>'}
  </div>`;
}

function filterDailyRows(){
  const q = (UI.dailySearch||'').trim().toLowerCase();
  document.querySelectorAll('tr[data-empid]').forEach(tr => {
    const text = tr.querySelector('td').innerText.toLowerCase();
    tr.style.display = (!q || text.includes(q)) ? '' : 'none';
  });
}

function onDailyFieldChange(empId){
  const tr = document.querySelector(`tr[data-empid="${empId}"]`);
  if(!tr) return;
  const branchId = tr.dataset.branch;
  const dateKey = tr.dataset.date;
  tr.classList.add('row-saving');
  clearTimeout(tr.__saveTimer);
  tr.__saveTimer = setTimeout(async () => {
    await saveRowEntry(tr, empId, branchId, dateKey);
    tr.classList.remove('row-saving');
    tr.classList.add('row-saved');
    setTimeout(() => tr.classList.remove('row-saved'), 1500);
    renderMiniDash();
  }, 1500);
}

async function saveRowEntry(tr, empId, branchId, dateKey){
  const manualIn  = tr.querySelector('.daily-in').value;
  const manualOut = tr.querySelector('.daily-out').value;
  const shiftId   = tr.querySelector('.daily-shift').value;
  const status    = tr.querySelector('.daily-status').value;
  const notes     = tr.querySelector('.daily-notes').value.trim();
  const emp = DB.employees.find(e => e.id === empId);
  const empDefaultShift = emp ? (emp.shiftId || '') : '';
  const branchDefault = getBranchDefaultShift(branchId);
  const defShiftId = empDefaultShift || (branchDefault ? branchDefault.id : '');
  const isEmpty = !manualIn && !manualOut && !notes && status === 'present' && shiftId === defShiftId;

  const existing = DB.dailyEntries.find(d => d.branchId===branchId && d.dateKey===dateKey && d.empId===empId);
  try {
    if(isEmpty && existing){
      await fsDelete('dailyEntries', existing.id);
      DB.dailyEntries = DB.dailyEntries.filter(d => d.id !== existing.id);
    } else if(!isEmpty && existing){
      const data = { manualIn, manualOut, shiftId, status, notes, enteredBy: currentUser.name, updatedAt: Date.now() };
      await fsUpdate('dailyEntries', existing.id, data);
      Object.assign(existing, data);
    } else if(!isEmpty && !existing){
      const doc = await fsAdd('dailyEntries', {
        branchId, dateKey, empId, manualIn, manualOut, shiftId, status, notes,
        enteredBy: currentUser.name, updatedAt: Date.now()
      });
      DB.dailyEntries.push(doc);
    }
    // تحديث البادج في الـ DOM
    const badges = tr.querySelector('td div');
    if(badges){
      const hasSaved = tr.querySelector('.b-blue');
      if(!isEmpty && !hasSaved){
        badges.innerHTML += ' <span class="badge b-blue" style="font-size:9.5px">محفوظ</span>';
      }
    }
  } catch(e){
    console.error('Auto-save error:', e);
  }
}

async function saveAllDaily(branchId, dateKey){
  const rows = document.querySelectorAll('tr[data-empid]');
  if(!rows.length){ alert('لا يوجد عمال'); return; }
  showLoader(true);
  try {
    const old = DB.dailyEntries.filter(d => d.branchId===branchId && d.dateKey===dateKey);
    for(const d of old) await fsDelete('dailyEntries', d.id);
    let saved = 0;
    for(const row of rows){
      const empId = row.dataset.empid;
      const manualIn  = row.querySelector('.daily-in').value;
      const manualOut = row.querySelector('.daily-out').value;
      const shiftId   = row.querySelector('.daily-shift').value;
      const status    = row.querySelector('.daily-status').value;
      const notes     = row.querySelector('.daily-notes').value.trim();
      const emp = DB.employees.find(e => e.id === empId);
      const empDefaultShift = emp ? (emp.shiftId || '') : '';
      const branchDefault = getBranchDefaultShift(branchId);
      const defShiftId = empDefaultShift || (branchDefault ? branchDefault.id : '');
      const isEmpty = !manualIn && !manualOut && !notes && status === 'present' && shiftId === defShiftId;
      if(isEmpty) continue;
      await fsAdd('dailyEntries', {
        branchId, dateKey, empId, manualIn, manualOut, shiftId, status, notes,
        enteredBy: currentUser.name, updatedAt: Date.now()
      });
      saved++;
    }
    await loadAllData();
    showLoader(false);
    alert('✅ تم حفظ بيانات ' + saved + ' عامل');
    renderTab();
  } catch(e){ showLoader(false); alert('خطأ: ' + e.message); }
}

async function copyFromYesterday(branchId, dateKey){
  const y = new Date(dateKey + 'T00:00:00');
  y.setDate(y.getDate() - 1);
  const yKey = y.toISOString().slice(0,10);
  const yesterdayEntries = DB.dailyEntries.filter(d => d.branchId===branchId && d.dateKey===yKey);
  if(!yesterdayEntries.length){ alert('❌ لا توجد بيانات مسجلة في يوم ' + yKey); return; }
  if(!confirm(`هيتم نسخ بيانات يوم ${yKey} (${yesterdayEntries.length} عامل) لهذا اليوم. متابعة؟`)) return;

  showLoader(true);
  try {
    for(const entry of yesterdayEntries){
      const tr = document.querySelector(`tr[data-empid="${entry.empId}"]`);
      if(!tr) continue;
      if(entry.manualIn)  tr.querySelector('.daily-in').value = entry.manualIn;
      if(entry.manualOut) tr.querySelector('.daily-out').value = entry.manualOut;
      if(entry.shiftId)   tr.querySelector('.daily-shift').value = entry.shiftId;
      if(entry.status)    tr.querySelector('.daily-status').value = entry.status;
      if(entry.notes)     tr.querySelector('.daily-notes').value = entry.notes;
    }
    showLoader(false);
    alert(`✅ تم نسخ ${yesterdayEntries.length} سجل. اضغط "حفظ الكل" لتثبيتهم.`);
  } catch(e){ showLoader(false); alert('خطأ: ' + e.message); }
}

function loadFingerprintsIntoForm(branchId, dateKey){
  const rows = document.querySelectorAll('tr[data-empid]');
  let count = 0;
  rows.forEach(row=>{
    const empId = row.dataset.empid;
    const punches = DB.punches.filter(p => p.branchId===branchId && p.dateKey===dateKey && p.empId===empId);
    if(!punches.length) return;
    const sorted = punches.slice().sort((a,b)=> a.timeMs - b.timeMs);
    const cin = sorted.find(p=>/c\s*\/?\s*in/i.test(p.status||'')) || sorted[0];
    const couts = sorted.filter(p=>/c\s*\/?\s*out/i.test(p.status||''));
    const cout = couts.length ? couts[couts.length-1] : (sorted.length>1 ? sorted[sorted.length-1] : null);
    const inEl = row.querySelector('.daily-in');
    const outEl = row.querySelector('.daily-out');
    if(cin && inEl && !inEl.value){ inEl.value = fmtTimeHM(cin.timeMs); count++; }
    if(cout && cout !== cin && outEl && !outEl.value){ outEl.value = fmtTimeHM(cout.timeMs); }
  });
  if(count === 0){ alert('لا توجد بصمات جديدة'); return; }
  alert('✅ تم استيراد ' + count + ' بصمة للحقول. اضغط حفظ الكل.');
}

/* =========================================================
   Modal: تسجيل إذن
   ========================================================= */
function openPermModal(empId, date){
  const emp = DB.employees.find(e => e.id === empId);
  if(!emp){ alert('العامل غير موجود'); return; }
  document.getElementById('pmEmpId').value = empId;
  document.getElementById('pmDateVal').value = date;
  document.getElementById('pmEmpName').value = emp.name + ' (' + emp.code + ') — ' + date;
  document.getElementById('pmReason').value = '';
  document.getElementById('pmType').value = 'late';
  document.getElementById('pmFrom').value = '09:00';
  document.getElementById('pmTo').value = '11:00';
  togglePermModalTimes();

  // عرض الأذونات الموجودة في نفس اليوم
  const existing = DB.permissions.filter(p => p.empId === empId && p.date === date);
  const el = document.getElementById('pmExisting');
  if(existing.length){
    el.innerHTML = `<div class="alert alert-info" style="font-size:12px">
      <b>الأذونات الحالية في نفس اليوم:</b><br>
      ${existing.map(p => `• ${PERM_TYPES[p.type]||p.type} ${p.fromTime?`(${p.fromTime} - ${p.toTime})`:''} <button class="btn btn-danger btn-sm" onclick="deletePermFromModal('${p.id}')">🗑</button>`).join('<br>')}
    </div>`;
  } else {
    el.innerHTML = '';
  }

  document.getElementById('permModal').style.display = 'flex';
}
function closePermModal(){
  document.getElementById('permModal').style.display = 'none';
}
function togglePermModalTimes(){
  const t = document.getElementById('pmType').value;
  const hide = (t === 'leave');
  document.getElementById('pmTimesRow').style.display = hide ? 'none' : 'flex';
}
async function savePermFromModal(){
  const empId = document.getElementById('pmEmpId').value;
  const date = document.getElementById('pmDateVal').value;
  const type = document.getElementById('pmType').value;
  const fromTime = document.getElementById('pmFrom').value;
  const toTime = document.getElementById('pmTo').value;
  const reason = document.getElementById('pmReason').value.trim();
  const emp = DB.employees.find(e => e.id === empId); if(!emp){ alert('العامل غير موجود'); return; }

  let minutes = 0;
  if(type !== 'leave'){
    if(!fromTime || !toTime){ alert('أدخل الأوقات'); return; }
    const s = dtAt(date, fromTime), e = dtAt(date, toTime);
    let mins = Math.round((e - s)/60000);
    if(mins <= 0) mins += 1440;
    minutes = mins;
  }
  showLoader(true);
  try {
    await fsAdd('permissions', {
      branchId: emp.branchId, empId, date, type,
      fromTime: type==='leave'?'':fromTime,
      toTime: type==='leave'?'':toTime,
      minutes, reason, createdBy: currentUser.name, createdAt: Date.now()
    });
    await loadAllData();
    showLoader(false);
    openPermModal(empId, date);
    renderMiniDash();
  } catch(e){ showLoader(false); alert('خطأ: ' + e.message); }
}
async function deletePermFromModal(permId){

  const empId = document.getElementById('pmEmpId').value;
  const date = document.getElementById('pmDateVal').value;
  showLoader(true);
  try {
    await fsDelete('permissions', permId);
    await loadAllData();
    showLoader(false);
    openPermModal(empId, date);
  } catch(e){ showLoader(false); alert('خطأ: ' + e.message); }
}

function autoShiftHours(){
  const s = document.getElementById('shStart').value;
  const e = document.getElementById('shEnd').value;
  if(!s || !e) return;
  const [sh,sm] = s.split(':').map(Number);
  const [eh,em] = e.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins <= 0) mins += 1440;
  document.getElementById('shHours').value = (mins/60).toFixed(1).replace(/\.0$/,'');
}
async function addShift(){
  const bId = document.getElementById('shBranchAdd').value;
  const name = document.getElementById('shName').value.trim();
  const start = document.getElementById('shStart').value;
  const end = document.getElementById('shEnd').value;
  const hours = parseFloat(document.getElementById('shHours').value) || 8;
  const graceMins = parseInt(document.getElementById('shGrace').value) || 0;
  const offDays = Array.from(document.querySelectorAll('.shDayOff:checked')).map(c=>parseInt(c.value));
  if(!bId){ alert('اختر الفرع'); return; }
  if(!name){ alert('أدخل اسم الشفت'); return; }
  showLoader(true);
  try {
    const shift = await fsAdd('shifts', { branchId:bId, name, start, end, hours, graceMins, offDays, createdAt:Date.now() });
    // لو الفرع ملوش شفت افتراضي، خليه هو
    const br = getBranch(bId);
    if(br && !br.defaultShiftId){
      await fsUpdate('branches', bId, { defaultShiftId: shift.id });
    }
    await loadAllData();
    showLoader(false);
    renderTab();
  } catch(e){ showLoader(false); alert('خطأ: ' + e.message); }
}

    });

async function deleteShift(id){

  showLoader(true);
  try {
    await fsDelete('shifts', id);
    const empsWithShift = DB.employees.filter(e => e.shiftId === id);

function loadEmpImportShiftSelect(){
  const bId = document.getElementById('empImportBranch').value;
  const sel = document.getElementById('empImportShift');
  if(!sel) return;
  const sh = DB.shifts.filter(s => s.branchId === bId);
  sel.innerHTML = sh.length
    ? `<option value="">— بدون شفت —</option>` + sh.map(s=>`<option value="${s.id}">${esc(s.name)} (${s.start}-${s.end})</option>`).join('')
    : `<option value="">— لا توجد شفتات —</option>`;
}

async function handleEmpImport(ev){
  const file = ev.target.files[0]; if(!file) return;
  const branchId = document.getElementById('empImportBranch').value;
  const defaultShift = document.getElementById('empImportShift').value;
  if(!branchId){ alert('اختر الفرع أولاً'); ev.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = async function(e){
    showLoader(true);
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', codepage:1256});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {raw:false});
      if(!rows || !rows.length){ empImportMsg = {ok:false, text:'❌ الملف فارغ'}; showLoader(false); renderTab(); return; }

      const keys = Object.keys(rows[0]);
      const nameKey = keys.find(k => /^(name|الاسم|employee name|employee|اسم الموظف|اسم العامل)/i.test(k.trim()));
      const codeKey = keys.find(k => /^(no\.?|code|id|كود|الرقم|رقم البصمة|employee id)/i.test(k.trim()));

      if(!nameKey || !codeKey){
        empImportMsg = {ok:false, text:'❌ لازم يكون فيه عمود للاسم وعمود لرقم البصمة. الأعمدة: ' + keys.join(', ')};
        showLoader(false); renderTab(); return;
      }

      const existing = DB.employees.filter(e => e.branchId === branchId);
      const newEmps = [];
      let skipped = 0, dup = 0;

      rows.forEach(row=>{
        const name = String(row[nameKey] || '').trim();
        const code = String(row[codeKey] || '').trim();
        if(!name || !code){ skipped++; return; }
        if(existing.some(e => norm(e.code) === norm(code)) ||
           newEmps.some(e => norm(e.code) === norm(code))){ dup++; return; }
        newEmps.push({ branchId, name, code, shiftId: defaultShift || '', active:true, createdAt: Date.now() });
      });

      if(newEmps.length) await fsBatchAdd('employees', newEmps);
      await loadAllData();
      showLoader(false);
      empImportMsg = {ok:true, text:`✅ تم استيراد <b>${newEmps.length}</b> موظف | مكرر: ${dup} | ناقص: ${skipped}`};
      renderTab();
    } catch(err){
      console.error(err);
      empImportMsg = {ok:false, text:'❌ خطأ: ' + err.message};
      showLoader(false); renderTab();
    }
    ev.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

async function handleImport(ev){
  const file = ev.target.files[0]; if(!file) return;
  const branchId = document.getElementById('impBranch').value;
  const replace = document.getElementById('impReplace').checked;
  if(!branchId){ alert('اختر الفرع'); ev.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = async function(e){
    showLoader(true);
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', codepage:1256});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {raw:false});
      if(!rows || !rows.length){ importMsg = {ok:false, text:'❌ الملف فارغ'}; showLoader(false); renderTab(); return; }
      await importRows(rows, branchId, replace);
    } catch(err){
      console.error(err);
      importMsg = {ok:false, text:'❌ خطأ: ' + err.message};
      showLoader(false); renderTab();
    }
    ev.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

async function importRows(rows, branchId, replace){
  const emps = DB.employees.filter(e => e.branchId === branchId);
  if(emps.length === 0){
    importMsg = {ok:false, text:'❌ لا يوجد عمال في هذا الفرع.'};
    showLoader(false); renderTab(); return;
  }
  if(replace) await fsBatchDelete('punches', p => p.branchId === branchId);
  await fsBatchDelete('unmatched', u => u.branchId === branchId);

  const newPunches = [], unmatchedRows = [];
  let matched = 0, skipped = 0;

  rows.forEach(row=>{
    const code = String(row['No.'] ?? row['كود'] ?? row['Code'] ?? row['Employee ID'] ?? row['ID'] ?? row['الرقم'] ?? row['رقم البصمة'] ?? '').trim();
    const name = String(row['Name'] ?? row['الاسم'] ?? row['Employee Name'] ?? row['Employee'] ?? row['اسم الموظف'] ?? '').trim();
    const rawDt = row['Date/Time'] ?? row['التاريخ'] ?? row['DateTime'] ?? row['Date'] ?? row['وقت البصمة'] ?? row['التاريخ والوقت'];
    const status = String(row['Status'] ?? row['الحالة'] ?? row['State'] ?? '').trim();
    if(!rawDt){ skipped++; return; }
    const dt = parseCustomDate(rawDt);
    if(!dt){ skipped++; return; }
    const dateKey = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;

    let emp = null;
    if(code){
      emp = emps.find(e => norm(e.code) === norm(code) && norm(e.name) === norm(name));
      if(!emp) emp = emps.find(e => norm(e.code) === norm(code));
    }
    if(!emp && name){ emp = emps.find(e => norm(e.name) === norm(name)); }

    if(emp){
      matched++;
      newPunches.push({ branchId, empId: emp.id, code: emp.code, name: emp.name, dateKey, timeMs: dt.getTime(), status });
    }else{
      unmatchedRows.push({ branchId, code, name, dateKey, timeMs: dt.getTime(), status });
    }
  });

  if(newPunches.length) await fsBatchAdd('punches', newPunches);
  if(unmatchedRows.length) await fsBatchAdd('unmatched', unmatchedRows);

  await loadAllData();
  showLoader(false);
  importMsg = {ok:true, text:`✅ تم — مرتبطة: <b>${matched}</b> | غير مرتبطة: <b>${unmatchedRows.length}</b> | متجاهلة: <b>${skipped}</b>`};
  renderTab();
}

async function mapUnmatched(i){
  const sel = document.getElementById('map_' + i);
  const empId = sel ? sel.value : '';
  if(!empId){ alert('اختر العامل'); return; }
  const rec = DB.unmatched[i]; if(!rec) return;
  const emp = DB.employees.find(e => e.id === empId); if(!emp) return;
  showLoader(true);
  try {
    await fsAdd('punches', {
      branchId: emp.branchId, empId: emp.id, code: emp.code, name: emp.name,
      dateKey: rec.dateKey, timeMs: rec.timeMs, status: rec.status
    });
    await fsDelete('unmatched', rec.id);
    await loadAllData();
    showLoader(false);
    importMsg = {ok:true, text:'✅ تم الربط'};
    renderTab();
  } catch(e){ showLoader(false); alert('خطأ: ' + e.message); }
}

function calcEmployee(emp, fromDate, toDate){
  const empShift = getShiftFor(emp);
  const branchDefault = getBranchDefaultShift(emp.branchId);
  const empDefaultShift = empShift || branchDefault || { start:'09:00', end:'17:00', hours:8, graceMins:15, offDays:[], name:'افتراضي' };
  const byDay = {};
  DB.punches.forEach(p=>{
    if(p.empId !== emp.id) return;
    if(fromDate && p.dateKey < fromDate) return;
    if(toDate && p.dateKey > toDate) return;
    (byDay[p.dateKey] = byDay[p.dateKey] || []).push(p);
  });
  const permByDay = {};
  DB.permissions.forEach(p=>{
    if(p.empId !== emp.id) return;
    if(fromDate && p.date < fromDate) return;
    if(toDate && p.date > toDate) return;
    (permByDay[p.date] = permByDay[p.date] || []).push(p);
    if(!byDay[p.date]) byDay[p.date] = [];
  });
  const dailyByDay = {};
  DB.dailyEntries.forEach(d=>{
    if(d.empId !== emp.id) return;
    if(fromDate && d.dateKey < fromDate) return;
    if(toDate && d.dateKey > toDate) return;
    dailyByDay[d.dateKey] = d;
    if(!byDay[d.dateKey]) byDay[d.dateKey] = [];
  });
  const days = Object.keys(byDay).sort().map(dk =>
    calcDay(emp, empDefaultShift, dk, byDay[dk], permByDay[dk] || [], dailyByDay[dk] || null)
  );
  const totals = { days: days.length, workMins:0, requiredMins:0, overtime:0, netLateness:0, excused:0, presentDays:0, lateDays:0, absentDays:0, leaveDays:0, incompleteDays:0, missionDays:0 };
  days.forEach(d=>{
    totals.workMins += d.workMins;
    totals.requiredMins += d.requiredMins;
    totals.overtime += d.overtime;
    totals.netLateness += d.netLateness;
    totals.excused += d.excusedMins;
    if(d.status === 'تأخير') totals.lateDays++;
    if(d.status === 'بصمة ناقصة') totals.incompleteDays++;
    if(d.status === 'أجازة') totals.leaveDays++;
    if(d.status === 'مهمة') totals.missionDays++;
    if(d.status === 'غياب') totals.absentDays++;
    if(['منتظم','عجز','تأخير','مهمة'].includes(d.status)) totals.presentDays++;
  });
  return { shift: empDefaultShift, days, totals };
}

function calcDay(emp, empDefaultShift, dateKey, punches, perms, dailyEntry){
  let sh = empDefaultShift;
  if(dailyEntry && dailyEntry.shiftId){
    const overrideShift = DB.shifts.find(s => s.id === dailyEntry.shiftId);
    if(overrideShift) sh = overrideShift;
  }
  const manualStatus = dailyEntry ? dailyEntry.status : null;
  const dObj = new Date(dateKey + 'T00:00:00');
  const dayIdx = dObj.getDay();
  const dayName = dayNamesAr[dayIdx];
  const isOffDay = (sh.offDays || []).includes(dayIdx);
  const sorted = punches.slice().sort((a,b)=> a.timeMs - b.timeMs);
  const shiftStart = dtAt(dateKey, sh.start);
  let shiftEnd = dtAt(dateKey, sh.end);
  if(shiftEnd <= shiftStart) shiftEnd = new Date(shiftEnd.getTime() + 86400000);
  const shiftMins = Math.round((shiftEnd - shiftStart) / 60000);
  const graceMins = sh.graceMins || 0;

  let cIn = null, cOut = null;
  if(sorted.length){
    cIn = sorted.find(p => /c\s*\/?\s*in/i.test(p.status || '')) || sorted[0];
    const outs = sorted.filter(p => /c\s*\/?\s*out/i.test(p.status || ''));
    if(outs.length) cOut = outs[outs.length - 1];
    else if(sorted.length > 1) cOut = sorted[sorted.length - 1];
    if(cOut && cIn && cOut.timeMs <= cIn.timeMs) cOut = null;
  }
  if(dailyEntry && dailyEntry.manualIn){
    const dt = dtAt(dateKey, dailyEntry.manualIn);
    cIn = { timeMs: dt.getTime(), status: 'C/In', manual: true };
  }
  if(dailyEntry && dailyEntry.manualOut){
    const dt = dtAt(dateKey, dailyEntry.manualOut);
    if(cIn && dt.getTime() > cIn.timeMs) cOut = { timeMs: dt.getTime(), status: 'C/Out', manual: true };
  }

  const inStr  = cIn  ? fmtTimeMs(cIn.timeMs)  : 'مفقودة';
  const outStr = cOut ? fmtTimeMs(cOut.timeMs) : 'مفقودة';
  const isLeave = perms.some(p => p.type === 'leave') || manualStatus === 'leave';

  let workMins=0, lateness=0, excusedLate=0, excusedEarly=0, excusedMid=0;
  let requiredMins = shiftMins, overtime = 0, status = 'منتظم';

  const windows = perms.filter(p => p.type !== 'leave' && p.fromTime && p.toTime).map(p=>{
    let s = dtAt(dateKey, p.fromTime), e = dtAt(dateKey, p.toTime);
    if(e <= s) e = new Date(e.getTime() + 86400000);
    return [s.getTime(), e.getTime()];
  });

  if(manualStatus === 'absent'){
    return buildDayObj(dateKey, dayName, isOffDay, '—', '—', 0, shiftMins, 0, 0, 0, 0, 0, 0, 0, 'غياب', perms);
  }
  if(manualStatus === 'mission') status = 'مهمة';
  if(isLeave){
    status = 'أجازة';
    requiredMins = 0;
    workMins = (cIn && cOut) ? Math.round((cOut.timeMs - cIn.timeMs)/60000) : 0;
    overtime = workMins;
  } else if(!cIn){
    status = manualStatus === 'mission' ? 'مهمة' : 'غياب';
    workMins = 0; overtime = 0; requiredMins = manualStatus === 'mission' ? 0 : shiftMins;
  } else if(!cOut){
    status = 'بصمة ناقصة';
    workMins = 0; overtime = 0; requiredMins = shiftMins;
  } else {
    workMins = Math.round((cOut.timeMs - cIn.timeMs) / 60000);
    if(!isOffDay){
      const lateRaw = Math.round((cIn.timeMs - shiftStart.getTime()) / 60000);
      if(lateRaw > graceMins) lateness = lateRaw;
      const inMs = cIn.timeMs, outMs = cOut.timeMs;
      const sMs = shiftStart.getTime(), eMs = shiftEnd.getTime();
      windows.forEach(([ws, we])=>{
        excusedLate  += overlapMs(sMs, Math.min(inMs, eMs), ws, we);
        excusedEarly += overlapMs(Math.max(outMs, sMs), eMs, ws, we);
        excusedMid   += overlapMs(Math.max(inMs, sMs), Math.min(outMs, eMs), ws, we);
      });
      excusedLate  = Math.round(excusedLate / 60000);
      excusedEarly = Math.round(excusedEarly / 60000);
      excusedMid   = Math.round(excusedMid / 60000);
      requiredMins = Math.max(0, shiftMins - excusedLate - excusedEarly - excusedMid);
      overtime = workMins - requiredMins;
    } else {
      requiredMins = 0;
      overtime = workMins;
      lateness = 0;
    }
    if(manualStatus === 'mission'){
      status = 'مهمة';
    } else {
      const netLate = Math.max(0, lateness - excusedLate);
      if(netLate > 0) status = 'تأخير';
      else if(overtime < -1) status = 'عجز';
      else status = 'منتظم';
    }
  }
  const excusedMins = excusedLate + excusedEarly + excusedMid;
  const netLateness = isLeave ? 0 : Math.max(0, lateness - excusedLate);
  return buildDayObj(dateKey, dayName, isOffDay, inStr, outStr, workMins, requiredMins, excusedMins, excusedLate, excusedEarly, excusedMid, lateness, netLateness, overtime, status, perms);
}

function buildDayObj(dateKey, dayName, isOffDay, inStr, outStr, workMins, requiredMins, excusedMins, excusedLate, excusedEarly, excusedMid, lateness, netLateness, overtime, status, perms){
  return {
    dateKey, dayName, isOffDay, inStr, outStr,
    workMins, requiredMins, excusedMins, excusedLate, excusedEarly, excusedMid,
    lateness, netLateness, overtime, status,
    perms: (perms||[]).map(p => PERM_TYPES[p.type] || p.type)
  };
}

        </div>
      </div>`;

      let content = '';
      if(UI.repBranch === 'all'){
        const byBranch = {};
        lastReport.rows.forEach(r => { (byBranch[r.emp.branchId] = byBranch[r.emp.branchId] || []).push(r); });
        const branchOrder = DB.branches.map(b => b.id).filter(id => byBranch[id]);
        branchOrder.forEach((bId) => {
          const list = byBranch[bId];
          let bw=0, bo=0, bl=0, bDays=0, bPresent=0, bAbsent=0, bLeave=0;
          list.forEach(r=>{
            bw += r.totals.workMins; bo += r.totals.overtime; bl += r.totals.netLateness;
            bDays += r.totals.days; bPresent += r.totals.presentDays; bAbsent += r.totals.absentDays; bLeave += r.totals.leaveDays;
          });
          content += `<div class="branch-header">
            <div style="font-size:19px;font-weight:bold">🏢 ${esc(branchName(bId))}</div>
            <div style="font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap">
              <span>👥 ${list.length}</span>
              <span>📅 ${bDays}</span>
              <span>✅ ${bPresent}</span>
              <span>❌ ${bAbsent}</span>
              <span>🏖️ ${bLeave}</span>
              <span>⌛ ${formatMinsToText(bw)}</span>
              <span>⏰ ${formatMinsToText(bl)}</span>
              <span>⚖️ ${bo>=0?'+':''}${formatMinsToText(bo)}</span>
            </div>
          </div>`;
          if(viewMode === 'summary'){
            content += `<div class="card"><div class="scroll-x">${reportSummaryTable(list)}</div></div>`;
          } else {
            list.forEach(r => { content += reportCardHtml(r); });
          }
        });
      } else {
        if(viewMode === 'summary'){
          content = `<div class="card">
            <h2>🏢 ${esc(branchName(UI.repBranch))} — ملخص العمال</h2>
            <div class="scroll-x">${reportSummaryTable(lastReport.rows)}</div>
          </div>`;
        } else {
          content = lastReport.rows.map(r => reportCardHtml(r)).join('');
        }
      }
      body = summary + content;
    }
  } else {
    body = '<div class="card"><div class="empty">اضغط <b>🔄 عرض</b>.</div></div>';
  }

  return `<div class="card">
    <h2>📈 التقارير</h2>
    ${controls}
  </div>${body}`;
}

function reportSummaryTable(rows){
  const trs = rows.map(r => {
    const t = r.totals;
    const overColor = t.overtime >= 0 ? '#2b6cb0' : '#c53030';
    return `<tr>
      <td style="text-align:right"><b>${esc(r.emp.name)}</b></td>
      <td>${esc(r.emp.code)}</td>
      <td>${t.days}</td>
      <td style="color:#38a169"><b>${t.presentDays}</b></td>
      <td style="color:#e53e3e"><b>${t.absentDays || 0}</b></td>
      <td style="color:#2b6cb0"><b>${t.leaveDays || 0}</b></td>
      <td>${t.incompleteDays || 0}</td>
      <td>${formatMinsToText(t.workMins)}</td>
      <td style="color:#c53030">${formatMinsToText(t.netLateness)}</td>
      <td style="color:${overColor}"><b>${t.overtime>=0?'+':''}${formatMinsToText(t.overtime)}</b></td>
    </tr>`;
  }).join('');
  return `<table>
    <thead><tr>
      <th>الاسم</th><th>الكود</th><th>أيام</th><th>حضور</th><th>غياب</th><th>أجازة</th>
      <th>بصمة ناقصة</th><th>ساعات العمل</th><th>التأخير</th><th>إضافي/عجز</th>
    </tr></thead>
    <tbody>${trs}</tbody>
  </table>`;
}

function reportCardHtml(r){
  const t = r.totals;
  const overColor = t.overtime >= 0 ? '#2b6cb0' : '#c53030';
  const shiftTxt = r.shift ? `${r.shift.name} (${r.shift.start} - ${r.shift.end})` : 'بدون شفت';
  const rows = r.days.map(d=>{
    const exc = d.excusedMins > 0 ? `<span class="badge b-blue">${formatMinsToText(d.excusedMins)}</span>` : '—';
    const permTxt = d.perms && d.perms.length ? `<div class="muted" style="font-size:10px">${d.perms.join(' + ')}</div>` : '';
    const ovTxt = (d.status === 'بصمة ناقصة' || d.status === 'غياب') ? '—' :
      (d.overtime > 0 ? `<b style="color:#2b6cb0">+${formatMinsToText(d.overtime)}</b>` :
        (d.overtime < 0 ? `<b style="color:#c53030">${formatMinsToText(d.overtime)}</b>` : '0'));
    const lateTxt = d.netLateness > 0 ? `<b style="color:#c53030">${formatMinsToText(d.netLateness)}</b>` : '0';
    const workTxt = (d.status === 'غياب') ? '—' : formatMinsToText(d.workMins);
    const reqTxt = (d.status === 'أجازة' || d.status === 'غياب') ? '—' : formatMinsToText(d.requiredMins);
    return `<tr>
      <td>${d.dateKey}<br><span class="muted" style="font-size:10px">${d.dayName}${d.isOffDay?' (راحة)':''}</span></td>
      <td>${d.inStr}</td><td>${d.outStr}</td>
      <td><b>${workTxt}</b></td><td>${reqTxt}</td>
      <td>${exc}${permTxt}</td><td>${lateTxt}</td><td>${ovTxt}</td>
      <td>${statusBadge(d.status)}</td>
    </tr>`;
  }).join('');
  return `<div class="emp-card">
    <div class="emp-header">
      <div class="emp-title">👤 ${esc(r.emp.name)} — كود: ${esc(r.emp.code)}</div>
      <div class="muted">🕐 ${esc(shiftTxt)}</div>
    </div>
    <div class="emp-summary">
      <span>📅 أيام: ${t.days}</span>
      <span>✅ حضور: ${t.presentDays}</span>
      <span>⏰ تأخير: <span style="color:#c53030">${formatMinsToText(t.netLateness)}</span></span>
      <span>📝 أذونات: ${formatMinsToText(t.excused)}</span>
      <span>⌛ ساعات: ${formatMinsToText(t.workMins)}</span>
      <span>⚖️ إضافي/عجز: <span style="color:${overColor}">${t.overtime>=0?'+':''}${formatMinsToText(t.overtime)}</span></span>
      ${t.absentDays ? `<span>❌ غياب: ${t.absentDays}</span>` : ''}
      ${t.leaveDays ? `<span>🏖️ أجازة: ${t.leaveDays}</span>` : ''}
      ${t.incompleteDays ? `<span>⚠️ بصمة ناقصة: ${t.incompleteDays}</span>` : ''}
    </div>
    <div class="scroll-x"><table>
      <thead><tr>
        <th>التاريخ</th><th>دخول</th><th>خروج</th><th>ساعات العمل</th>
        <th>المطلوب</th><th>إذن</th><th>تأخير</th><th>إضافي/عجز</th><th>الحالة</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function generateReport(){
  const isAdmin = currentUser.role === 'admin';
  const branchId = isAdmin ? (document.getElementById('repBranch')?.value || UI.repBranch) : currentUser.branchId;
  const empId = document.getElementById('repEmp')?.value || UI.repEmp || 'all';
  const fromDate = document.getElementById('repFrom')?.value || '';
  const toDate = document.getElementById('repTo')?.value || '';
  UI.repBranch = branchId; UI.repEmp = empId; UI.repFrom = fromDate; UI.repTo = toDate;
  let emps = DB.employees.slice();
  if(branchId !== 'all') emps = emps.filter(e => e.branchId === branchId);
  if(empId !== 'all' && empId) emps = emps.filter(e => e.id === empId);
  const rows = emps.map(emp => {
    const c = calcEmployee(emp, fromDate, toDate);
    return { emp, shift: c.shift, days: c.days, totals: c.totals };
  }).filter(r => r.days.length > 0).sort((a,b)=> a.emp.name.localeCompare(b.emp.name,'ar'));
  lastReport = { rows, branchId, empId, fromDate, toDate, generatedAt: new Date().toISOString() };
  renderTab();
}

function exportReport(){
  if(!lastReport || !lastReport.rows.length){ alert('لا يوجد تقرير.'); return; }
  const out = [];
  lastReport.rows.forEach(r=>{
    r.days.forEach(d=>{
      out.push({
        'الفرع': branchName(r.emp.branchId),
        'كود': r.emp.code, 'اسم': r.emp.name,
        'الشفت': r.shift ? r.shift.name : '',
        'التاريخ': d.dateKey, 'اليوم': d.dayName,
        'الدخول': d.inStr, 'الخروج': d.outStr,
        'ساعات العمل': formatMinsToText(d.workMins),
        'المطلوبة': formatMinsToText(d.requiredMins),
        'إذن (د)': d.excusedMins,
        'تأخير (د)': d.netLateness, 'تأخير': formatMinsToText(d.netLateness),
        'إضافي/عجز (د)': d.overtime, 'إضافي/عجز': formatMinsToText(d.overtime),
        'الحالة': d.status
      });
    });
  });
  if(!out.length){ alert('لا بيانات'); return; }
  const ws = XLSX.utils.json_to_sheet(out);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'تقرير');
  XLSX.writeFile(wb, 'تقرير_الحضور.xlsx');
}

function printReport(){
  if(!lastReport || !lastReport.rows.length){ alert('لا يوجد تقرير لعرضه. اضغط "عرض" أولاً.'); return; }
  window.print();
}

Object.assign(window, {
  doLogin, doLogout, switchTab,
  addBranch, deleteBranch, editBranchUser, setBranchDefaultShift,
  loadShiftSelectForAdd, addEmployee, setEmpShift, editEmployee, deleteEmployee,
  autoShiftHours, addShift, editShift, deleteShift,
  handleImport, handleEmpImport, mapUnmatched, loadEmpImportShiftSelect,
  generateReport, exportReport, printReport,
  saveAllDaily, loadFingerprintsIntoForm, openPermModal,
  closePermModal, togglePermModalTimes, savePermFromModal, deletePermFromModal,
  onDailyFieldChange, copyFromYesterday, filterDailyRows, filterEmpRows
});

(async function init(){
  try {
    await checkSetup();
    const saved = sessionStorage.getItem('att_user_id');
    if(saved){
      const users = await fsGetAll('users');
      const u = users.find(x => x.id === saved);
      if(u){ currentUser = u; await loadAllData(); enterApp(); }
    }
    ['loginUser','loginPass','loginName'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
    });
  } catch(e){
    console.error(e);
    alert('خطأ: ' + e.message);
  }
})();
</script>
